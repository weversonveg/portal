<!-- Scripts do Flatpickr -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/pt.js"></script>

<script>
    // Inicialização do Flatpickr para datas
    flatpickr("#dataNascimento", {
        locale: "pt",
        dateFormat: "Y-m-d",
        maxDate: "today"
    });

    flatpickr("#dataAdmissao", {
        locale: "pt",
        dateFormat: "Y-m-d",
        maxDate: "today"
    });

    // Funções auxiliares de formatação e interatividade
    function formatarCPF(input) {
        let v = input.value.replace(/\D/g, "");
        if (v.length > 11) v = v.slice(0, 11);
        v = v.replace(/(\d{3})(\d)/, "$1.$2");
        v = v.replace(/(\d{3})(\d)/, "$1.$2");
        v = v.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
        input.value = v;
        atualizarCorCampo(input);
    }

    function verificarCpfDuplicado(input) {
        if (input.value.length === 14) {
            atualizarCorCampo(input);
        }
    }

    function formatarTelefone(input) {
        let v = input.value.replace(/\D/g, "");
        if (v.length > 11) v = v.slice(0, 11);
        if (v.length > 10) {
            v = v.replace(/^(\d{2})(\d{5})(\d{4}).*/, "($1) $2-$3");
        } else if (v.length > 5) {
            v = v.replace(/^(\d{2})(\d{4})(\d{0,4}).*/, "($1) $2-$3");
        } else if (v.length > 2) {
            v = v.replace(/^(\d{2})(\d{0,5})/, "($1) $2");
        } else {
            v = v.replace(/^(\d*)/, "($1");
        }
        input.value = v;
        atualizarCorCampo(input);
    }

    function formatarCEP(input) {
        let v = input.value.replace(/\D/g, "");
        if (v.length > 8) v = v.slice(0, 8);
        v = v.replace(/^(\d{5})(\d{0,3})/, "$1-$2");
        input.value = v;
        atualizarCorCampo(input);
    }

    async function buscarCEP(input) {
        let cep = input.value.replace(/\D/g, "");
        if (cep.length === 8) {
            try {
                let response = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
                let data = await response.json();
                if (!data.erro) {
                    document.getElementById("logradouro").value = data.logradouro || "";
                    document.getElementById("bairro").value = data.bairro || "";
                    document.getElementById("cidade").value = data.localidade || "";
                    document.getElementById("uf").value = data.uf || "";
                    
                    ["logradouro", "bairro", "cidade", "uf"].forEach(id => {
                        let el = document.getElementById(id);
                        if (el.value) el.classList.add("preenchido");
                    });
                }
            } catch (e) {
                console.error("Erro ao buscar CEP", e);
            }
        }
    }

    function atualizarCorCampo(input) {
        if (input.value && input.value.trim() !== "") {
            input.classList.add("preenchido");
        } else {
            input.classList.remove("preenchido");
        }
    }

    document.querySelectorAll("select").forEach(select => {
        select.addEventListener("change", function() {
            if (this.value) {
                this.classList.add("preenchido");
            } else {
                this.classList.remove("preenchido");
            }
        });
    });

    function toggleEscolaExtra(matriculaNum) {
        const bloco = document.getElementById(`escolaExtra${matriculaNum}`);
        const btn = document.getElementById(`btnToggleEscola${matriculaNum}`);
        if (bloco.classList.contains("ativo")) {
            bloco.classList.remove("ativo");
            btn.innerHTML = '<span class="material-symbols-outlined" style="font-size: 16px;">add_circle</span> Adicionar segunda escola / lotação para esta matrícula';
        } else {
            bloco.classList.add("ativo");
            btn.innerHTML = '<span class="material-symbols-outlined" style="font-size: 16px;">remove_circle</span> Remover segunda escola / lotação';
        }
    }

    function toggleSegundoVinculo() {
        const checkbox = document.getElementById("possuiSegundoVinculo");
        const bloco = document.getElementById("blocoSegundoVinculo");
        const inputsMatricula2 = bloco.querySelectorAll("input, select");

        if (checkbox.checked) {
            bloco.classList.add("ativo");
            inputsMatricula2.forEach(el => {
                if (["numeroMatricula2", "cargo2", "escola1_m2", "empresa1_m2", "qtdPassagens1_m2"].includes(el.id)) {
                    el.setAttribute("required", "required");
                }
            });
        } else {
            bloco.classList.remove("ativo");
            inputsMatricula2.forEach(el => {
                el.removeAttribute("required");
                el.value = "";
                el.classList.remove("preenchido");
            });
            document.getElementById("escolaExtra2").classList.remove("ativo");
            document.getElementById("btnToggleEscola2").innerHTML = '<span class="material-symbols-outlined" style="font-size: 16px;">add_circle</span> Adicionar segunda escola / lotação para esta matrícula';
        }
    }

    function salvarServidor(event) {
        event.preventDefault();
        const msg = document.getElementById("mensagemFeedback");
        msg.className = "mensagem sucesso";
        msg.innerHTML = "Servidor cadastrado com sucesso no sistema de Vale Transporte!";
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
</script>
