<!-- SCRIPTS JAVASCRIPT -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script>
// Inicialização do Flatpickr
flatpickr("#dataNascimento", { dateFormat: "Y-m-d", locale: "pt" });
flatpickr("#dataAdmissao", { dateFormat: "Y-m-d", locale: "pt" });

// Funções auxiliares do formulário
function formatarCPF(input) {
    let v = input.value.replace(/\D/g, "");
    if (v.length > 11) v = v.slice(0, 11);
    v = v.replace(/(\d{3})(\d)/, "$1.$2");
    v = v.replace(/(\d{3})(\d)/, "$1.$2");
    v = v.replace(/(\d{3})(\d{1,2})$/, "$1-$2");
    input.value = v;
    atualizarCorCampo(input);
}

function verificarCpfDuplicado(input) {
    if (input.value.length === 14) {
        if (input.value.endsWith("-00")) {
            input.classList.add("erro-input");
            input.classList.remove("preenchido");
            mostrarMensagem("Este CPF já está cadastrado no sistema.", "erro");
        } else {
            input.classList.remove("erro-input");
            input.classList.add("preenchido");
            ocultarMensagem();
        }
    }
}

function formatarTelefone(input) {
    let v = input.value.replace(/\D/g, "");
    if (v.length > 11) v = v.slice(0, 11);
    if (v.length > 10) {
        v = v.replace(/^(\d{2})(\d{5})(\d{4}).*/, "($1) $2-$3");
    } else if (v.length > 5) {
        v = v.replace(/^(\d{2})(\d{4})(\d{0,4}).*/, "($1) $2-$3");
    } else if (v.length > 2) {
        v = v.replace(/^(\d{2})(\d{0,5})/, "($1) $2");
    } else {
        v = v.replace(/^(\d*)/, "($1");
    }
    input.value = v;
    atualizarCorCampo(input);
}

function formatarCEP(input) {
    let v = input.value.replace(/\D/g, "");
    if (v.length > 8) v = v.slice(0, 8);
    v = v.replace(/(\d{5})(\d{1,3})$/, "$1-$2");
    input.value = v;
    atualizarCorCampo(input);
}

function buscarCEP(input) {
    let cep = input.value.replace(/\D/g, "");
    if (cep.length === 8) {
        fetch(`https://viacep.com.br/ws/${cep}/json/`)
            .then(response => response.json())
            .then(data => {
                if (!data.erro) {
                    document.getElementById("logradouro").value = data.logradouro || "";
                    document.getElementById("bairro").value = data.bairro || "";
                    document.getElementById("cidade").value = data.localidade || "";
                    document.getElementById("uf").value = data.uf || "";
                    [document.getElementById("logradouro"), document.getElementById("bairro"), document.getElementById("cidade"), document.getElementById("uf")].forEach(el => {
                        if (el.value) el.classList.add("preenchido");
                    });
                }
            })
            .catch(err => console.error("Erro ao buscar CEP:", err));
    }
}

function atualizarCorCampo(input) {
    if (input.value && input.value.trim() !== "") {
        input.classList.add("preenchido");
        input.classList.remove("erro-input");
    } else {
        input.classList.remove("preenchido");
    }
}

function toggleEscolaExtra(num) {
    const bloco = document.getElementById(`escolaExtra${num}`);
    bloco.classList.toggle("ativo");
}

function toggleSegundoVinculo() {
    const checkbox = document.getElementById("possuiSegundoVinculo");
    const bloco = document.getElementById("blocoSegundoVinculo");
    const inputsM2 = bloco.querySelectorAll("input, select");
    
    if (checkbox.checked) {
        bloco.classList.add("ativo");
        document.getElementById("numeroMatricula2").setAttribute("required", "true");
        document.getElementById("cargo2").setAttribute("required", "true");
        document.getElementById("escola1_m2").setAttribute("required", "true");
        document.getElementById("empresa1_m2").setAttribute("required", "true");
        document.getElementById("qtdPassagens1_m2").setAttribute("required", "true");
    } else {
        bloco.classList.remove("ativo");
        inputsM2.forEach(input => {
            input.value = "";
            input.classList.remove("preenchido", "erro-input");
            input.removeAttribute("required");
        });
        document.getElementById("escolaExtra2").classList.remove("ativo");
    }
}

function salvarServidor(event) {
    event.preventDefault();
    mostrarMensagem("Servidor cadastrado com sucesso!", "sucesso");
    document.getElementById("formServidor").reset();
    document.querySelectorAll(".preenchido").forEach(el => el.classList.remove("preenchido"));
    document.getElementById("blocoSegundoVinculo").classList.remove("ativo");
    document.getElementById("escolaExtra1").classList.remove("ativo");
    document.getElementById("escolaExtra2").classList.remove("ativo");
}

function mostrarMensagem(texto, tipo) {
    const msg = document.getElementById("mensagemFeedback");
    msg.textContent = texto;
    msg.className = `mensagem ${tipo}`;
    setTimeout(() => {
        msg.className = "mensagem";
    }, 5000);
}
</script>
