<script type="module">
import { db } from "./firebase.js";
import { collection, addDoc, doc, getDoc, updateDoc, getDocs, query, where, limit } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const urlParams = new URLSearchParams(window.location.search);
const servidorId = urlParams.get('id');

function atualizarStatusConexao() {
  const statusDiv = document.getElementById("statusConexao");
  const statusTexto = document.getElementById("statusTexto");
  if (!navigator.onLine) {
    statusDiv.className = "status-conexao offline";
    statusTexto.textContent = "Sem Conexão";
    statusDiv.title = "Computador desconectado da internet";
    return;
  }
  const conexao = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  if (conexao) {
    if (conexao.effectiveType === 'slow-2g' || conexao.effectiveType === '2g' || conexao.effectiveType === '3g') {
      statusDiv.className = "status-conexao instavel";
      statusTexto.textContent = "Instável";
      statusDiv.title = "Rede móvel ou conexão lenta detectada";
    } else {
      statusDiv.className = "status-conexao online";
      statusTexto.textContent = "Online";
      statusDiv.title = "Conexão de alta velocidade (4G/Wi-Fi)";
    }
  } else {
    statusDiv.className = "status-conexao online";
    statusTexto.textContent = "Online";
    statusDiv.title = "Sistema Conectado";
  }
}

window.addEventListener('online', atualizarStatusConexao);
window.addEventListener('offline', atualizarStatusConexao);

document.addEventListener("DOMContentLoaded", async function() {
  atualizarStatusConexao();
  flatpickr("input[type='date']", {
    locale: "pt",
    dateFormat: "Y-m-d",
    allowInput: false,
    onChange: function(selectedDates, dateStr, instance) {
      window.atualizarCorCampo(instance.element);
      ocultarMensagem();
    }
  });

  const campos = document.querySelectorAll("#formServidor input, #formServidor select");
  campos.forEach(function(campo) {
    campo.addEventListener("input", function() {
      atualizarCorCampo(campo);
      ocultarMensagem();
    });
    campo.addEventListener("change", function() {
      atualizarCorCampo(campo);
      ocultarMensagem();
    });
    atualizarCorCampo(campo);
  });

  if (servidorId) {
    document.title = "Editar Servidor - Vale Transporte";
    document.querySelector(".breadcrumb span:last-child").textContent = "Editar cadastro";
    document.querySelector(".page-header h1").textContent = "Editar Servidor";
    document.querySelector(".page-header p").textContent = "Atualize os dados cadastrais do servidor no sistema.";
    document.querySelector(".card-title").textContent = "Editar dados do servidor";
    document.getElementById("textoBotao").textContent = "Atualizar";
    document.getElementById("iconeSalvar").textContent = "update";

    await carregarDadosServidor(servidorId);
  }
});

async function carregarDadosServidor(id) {
  try {
    const docRef = doc(db, "servidores", id);
    const docSnap = await getDoc(docRef);

    if (docSnap.exists()) {
      const d = docSnap.data();

      document.getElementById("nome").value = d.nome || "";
      document.getElementById("cpf").value = d.cpf || "";
      document.getElementById("email").value = d.email || "";
      document.getElementById("dataNascimento").value = d.dataNascimento || "";
      document.getElementById("telefone").value = d.telefone || "";

      if (d.dataNascimento && document.getElementById("dataNascimento")._flatpickr) {
        document.getElementById("dataNascimento")._flatpickr.setDate(d.dataNascimento);
      }

      document.getElementById("cep").value = d.cep || "";
      document.getElementById("bairro").value = d.bairro || "";
      document.getElementById("logradouro").value = d.logradouro || "";
      document.getElementById("numero").value = d.numero || "";
      document.getElementById("complemento").value = d.complemento || "";
      document.getElementById("cidade").value = d.cidade || "";
      document.getElementById("uf").value = d.uf || "";

      if (d.matricula1) {
        document.getElementById("numeroMatricula1").value = d.matricula1.numeroMatricula || "";
        document.getElementById("cargo1").value = d.matricula1.cargo || "";
        document.getElementById("dataAdmissao1").value = d.matricula1.dataAdmissao || "";
        if (d.matricula1.dataAdmissao && document.getElementById("dataAdmissao1")._flatpickr) {
          document.getElementById("dataAdmissao1")._flatpickr.setDate(d.matricula1.dataAdmissao);
        }
        if (d.matricula1.escola1) {
          document.getElementById("escola1_m1").value = d.matricula1.escola1.nomeEscola || "";
          document.getElementById("empresa1_m1").value = d.matricula1.escola1.empresa || "";
          document.getElementById("qtdPassagens1_m1").value = d.matricula1.escola1.qtdPassagensDiarias || "";
        }
        if (d.matricula1.escola2) {
          toggleEscolaExtra(1);
          document.getElementById("escola2_m1").value = d.matricula1.escola2.nomeEscola || "";
          document.getElementById("empresa_escola2_m1").value = d.matricula1.escola2.empresa || "";
          document.getElementById("qtdPassagens_escola2_m1").value = d.matricula1.escola2.qtdPassagensDiarias || "";
        }
      }

      if (d.matricula2) {
        document.getElementById("possuiSegundoVinculo").checked = true;
        toggleSegundoVinculo();
        document.getElementById("numeroMatricula2").value = d.matricula2.numeroMatricula || "";
        document.getElementById("cargo2").value = d.matricula2.cargo || "";
        document.getElementById("dataAdmissao2").value = d.matricula2.dataAdmissao || "";
        if (d.matricula2.dataAdmissao && document.getElementById("dataAdmissao2")._flatpickr) {
          document.getElementById("dataAdmissao2")._flatpickr.setDate(d.matricula2.dataAdmissao);
        }
        if (d.matricula2.escola1) {
          document.getElementById("escola1_m2").value = d.matricula2.escola1.nomeEscola || "";
          document.getElementById("empresa1_m2").value = d.matricula2.escola1.empresa || "";
          document.getElementById("qtdPassagens1_m2").value = d.matricula2.escola1.qtdPassagensDiarias || "";
        }
        if (d.matricula2.escola2) {
          toggleEscolaExtra(2);
          document.getElementById("escola2_m2").value = d.matricula2.escola2.nomeEscola || "";
          document.getElementById("empresa_escola2_m2").value = d.matricula2.escola2.empresa || "";
          document.getElementById("qtdPassagens_escola2_m2").value = d.matricula2.escola2.qtdPassagensDiarias || "";
        }
      }

      const camposPreenchidos = document.querySelectorAll("#formServidor input, #formServidor select");
      camposPreenchidos.forEach(c => atualizarCorCampo(c));

    } else {
      mostrarMensagem("Servidor não encontrado.", "erro");
    }
  } catch (erro) {
    console.error("Erro ao carregar dados do servidor para edição:", erro);
    mostrarMensagem("Erro ao carregar os dados.", "erro");
  }
}

window.atualizarCorCampo = function(campo) {
  if (campo.value && campo.value.trim() !== "") {
    if (!campo.classList.contains("erro-input")) {
      campo.classList.add("preenchido");
    }
  } else {
    campo.classList.remove("preenchido");
  }
}

window.formatarCPF = function(input) {
  let v = input.value.replace(/\D/g, '');
  if (v.length > 11) v = v.slice(0, 11);
  if (v.length > 9) {
    v = v.replace(/^(\d{3})(\d{3})(\d{3})(\d{2}).*/, '$1.$2.$3-$4');
  } else if (v.length > 6) {
    v = v.replace(/^(\d{3})(\d{3})(\d{1,3}).*/, '$1.$2.$3');
  } else if (v.length > 3) {
    v = v.replace(/^(\d{3})(\d{1,3}).*/, '$1.$2');
  }
  input.value = v;
  atualizarCorCampo(input);
}

window.verificarCpfDuplicado = async function(input) {
  const cpfLimpo = input.value.replace(/\D/g, '');
  if (cpfLimpo.length !== 11) return false;

  try {
    const colRef = collection(db, "servidores");
    const q = query(colRef, where("cpf", "==", cpfLimpo), limit(1));
    const querySnapshot = await getDocs(q);

    if (!querySnapshot.empty) {
      let duplicado = false;
      querySnapshot.forEach((docSnap) => {
        // Se estiver editando, ignora se for o próprio documento
        if (!servidorId || docSnap.id !== servidorId) {
          duplicado = true;
        }
      });

      if (duplicado) {
        input.classList.add("erro-input");
        input.classList.remove("preenchido");
        mostrarMensagem("CPF já existe no banco", "erro");
        return true;
      }
    }

    input.classList.remove("erro-input");
    ocultarMensagem();
    return false;
  } catch (erro) {
    console.error("Erro ao verificar CPF:", erro);
    return false;
  }
}

window.salvarServidor = async function(event) {
  event.preventDefault();

  const cpfInput = document.getElementById("cpf");
  const jaExiste = await verificarCpfDuplicado(cpfInput);
  if (jaExiste) {
    return; // Interrompe o salvamento se o CPF já existir
  }

  // Insira aqui a sua lógica de salvamento / update (addDoc / updateDoc)
  mostrarMensagem("Servidor salvo com sucesso!", "sucesso");
}

window.mostrarMensagem = function(texto, tipo) {
  const msgDiv = document.getElementById("mensagem");
  msgDiv.textContent = texto;
  msgDiv.className = `mensagem ${tipo}`;
}

window.ocultarMensagem = function() {
  const msgDiv = document.getElementById("mensagem");
  msgDiv.className = "mensagem";
  msgDiv.textContent = "";
}

window.toggleSegundoVinculo = function() {
  const bloco = document.getElementById("blocoSegundoVinculo");
  const checkbox = document.getElementById("possuiSegundoVinculo");
  if (checkbox.checked) {
    bloco.classList.add("ativo");
  } else {
    bloco.classList.remove("ativo");
  }
}

window.toggleEscolaExtra = function(num) {
  const escolaExtra = document.getElementById(`escolaExtra${num}`);
  escolaExtra.classList.toggle("ativo");
}

window.cancelar = function() {
  window.history.back();
}

window.importarCSV = function() {
  alert("Função de importação CSV");
}
</script>
