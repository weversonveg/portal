<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet"
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

<link rel="stylesheet"
href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">

<title>Consultar Servidor - Vale Transporte</title>

<style>

:root {
    --primary: #5b2a86;
    --primary-hover: #47206b;

    --green: #2e7d32;
    --green-hover: #1b5e20;
    --green-light: #eaf6ec;
    --green-border: #72b879;

    --red: #c62828;
    --red-hover: #a51f1f;

    --text: #263238;
    --text-secondary: #68737d;

    --border: #d9dee3;
    --background: #f4f6f8;
    --white: #ffffff;

    --shadow: 0 2px 8px rgba(0,0,0,0.06);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    background: var(--background);
    color: var(--text);
}

/* BARRA SUPERIOR */
.topbar {
    width: calc(100% - 64px);
    max-width: 1116px;
    height: 68px;
    margin: 16px auto 0;
    background: var(--white);
    border: 1px solid #e0e4e7;
    border-radius: 8px;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    padding: 0 24px;
}

.topbar-content {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 14px;
}

.logo {
    width: 38px;
    height: 38px;
    object-fit: contain;
    flex-shrink: 0;
}

.system-name {
    font-size: 17px;
    font-weight: 700;
    color: #3d2450;
}

.system-divider {
    width: 1px;
    height: 24px;
    background: #dfe3e6;
    margin: 0 2px;
}

.system-module {
    font-size: 14px;
    color: var(--text-secondary);
    flex-grow: 1;
}

/* INDICADOR DE SINAL DE REDE */
.status-conexao {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 20px;
    background: #f1f3f5;
    border: 1px solid #e2e8f0;
}

.signal-bars {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 12px;
}

.signal-bars .bar {
    width: 3px;
    background-color: #2e7d32;
    border-radius: 1px;
}
.signal-bars .bar-1 { height: 3px; }
.signal-bars .bar-2 { height: 6px; }
.signal-bars .bar-3 { height: 9px; }
.signal-bars .bar-4 { height: 12px; }

.status-conexao.online {
    color: #2e7d32;
    background: #edf7ee;
    border-color: #c8e6c9;
}

/* ÁREA PRINCIPAL */
.main {
    width: calc(100% - 64px);
    max-width: 1116px;
    margin: 0 auto;
    padding: 32px 0;
}

.page-header {
    margin-bottom: 24px;
}

.breadcrumb {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 13px;
    color: #7b858e;
    margin-bottom: 10px;
}

.breadcrumb .material-symbols-outlined {
    font-size: 17px;
}

.page-header h1 {
    font-size: 24px;
    font-weight: 700;
    color: #263238;
    margin-bottom: 6px;
}

.page-header p {
    font-size: 14px;
    color: var(--text-secondary);
}

/* CARD DE BUSCA */
.search-card {
    background: var(--white);
    border: 1px solid #e0e4e7;
    border-radius: 8px;
    box-shadow: var(--shadow);
    padding: 24px;
    margin-bottom: 24px;
    display: flex;
    gap: 16px;
    align-items: flex-end;
}

.search-group {
    display: flex;
    flex-direction: column;
}

.search-group.tipo {
    width: 200px;
}

.search-group.input-container {
    flex-grow: 1;
}

.search-group label {
    font-size: 13px;
    font-weight: 600;
    color: #455a64;
    margin-bottom: 7px;
}

.search-group input,
.search-group select {
    height: 44px;
    padding: 0 13px;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 6px;
    outline: none;
    font-size: 14px;
    color: #263238;
}

.search-group input:focus,
.search-group select:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(91,42,134,.10);
}

.btn-pesquisar {
    height: 44px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 0 24px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.15s;
    flex-shrink: 0;
}

.btn-pesquisar:hover {
    background: var(--primary-hover);
}

/* LISTA DE RESULTADOS */
.results-container {
    display: none;
    flex-direction: column;
    gap: 16px;
}

.results-container.ativo {
    display: flex;
}

.servidor-card {
    background: var(--white);
    border: 1px solid #e0e4e7;
    border-radius: 8px;
    box-shadow: var(--shadow);
    padding: 20px 24px;
}

.servidor-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 1px solid #e5e8eb;
    padding-bottom: 12px;
    margin-bottom: 14px;
}

.servidor-nome {
    font-size: 16px;
    font-weight: 700;
    color: #263238;
}

.servidor-meta {
    font-size: 13px;
    color: var(--text-secondary);
    display: flex;
    gap: 16px;
}

.matricula-box {
    background: #fafbfc;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px;
    margin-top: 10px;
}

.matricula-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 6px;
    display: flex;
    align-items: center;
    gap: 6px;
}

.mensagem {
    display: none;
    padding: 12px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 16px;
}

.mensagem.erro {
    display: block;
    background: #fff0f0;
    border: 1px solid #efc5c5;
    color: #c62828;
}

.mensagem.info {
    display: block;
    background: #eef2f7;
    border: 1px solid #cbd5e1;
    color: #334155;
}

@media (max-width: 700px) {
    .search-card {
        flex-direction: column;
        align-items: stretch;
    }
    .search-group.tipo {
        width: 100%;
    }
    .servidor-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
    }
}

</style>
</head>

<body>

<header class="topbar">
    <div class="topbar-content">
        <img class="logo" src="https://drive.google.com/thumbnail?id=1Epk870R1TRNRFx4ionkXV-HDkgRyrATQ" alt="Logo">
        <span class="system-name">Vale Transporte</span>
        <div class="system-divider"></div>
        <span class="system-module">Semed - Consulta de Servidores</span>
        <div class="status-conexao online">
            <div class="signal-bars">
                <span class="bar bar-1"></span>
                <span class="bar bar-2"></span>
                <span class="bar bar-3"></span>
                <span class="bar bar-4"></span>
            </div>
            <span>Online</span>
        </div>
    </div>
</header>

<main class="main">
    <div class="page-header">
        <div class="breadcrumb">
            <span class="material-symbols-outlined">home</span>
            <span>Servidores</span>
            <span>/</span>
            <span>Consulta</span>
        </div>
        <h1>Consulta de Beneficiário</h1>
        <p>Pesquise por CPF, Nome do Servidor ou Escola de Lotação.</p>
    </div>

    <!-- CARD DE PESQUISA FLEXÍVEL -->
    <section class="search-card">
        <div class="search-group tipo">
            <label for="tipoBusca">Pesquisar por</label>
            <select id="tipoBusca" onchange="mudarTipoBusca()">
                <option value="cpf">CPF</option>
                <option value="nome">Nome</option>
                <option value="escola">Escola</option>
            </select>
        </div>

        <div class="search-group input-container" id="grupoInput">
            <label for="termoBusca" id="labelTermo">Digite o CPF</label>
            <input type="text" id="termoBusca" placeholder="000.000.000-00" maxlength="14" inputmode="numeric" oninput="formatarCampoBusca(this)">
        </div>

        <button type="button" class="btn-pesquisar" onclick="pesquisarServidor()">
            <span class="material-symbols-outlined">search</span>
            Pesquisar
        </button>
    </section>

    <div id="mensagem" class="mensagem"></div>

    <!-- CONTAINER DE RESULTADOS (LISTA DINÂMICA) -->
    <section id="resultsContainer" class="results-container">
        <!-- Os cards dos servidores encontrados entram aqui -->
    </section>
</main>

<script type="module">
    import { db } from "./firebase.js";
    import { collection, getDocs, query, where, limit } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Altera dinamicamente o campo de entrada conforme o tipo de busca selecionado
    window.mudarTipoBusca = function() {
        const tipo = document.getElementById("tipoBusca").value;
        const grupoInput = document.getElementById("grupoInput");
        const label = document.getElementById("labelTermo");

        if (tipo === "cpf") {
            label.textContent = "Digite o CPF";
            grupoInput.innerHTML = `
                <label for="termoBusca" id="labelTermo">Digite o CPF</label>
                <input type="text" id="termoBusca" placeholder="000.000.000-00" maxlength="14" inputmode="numeric" oninput="formatarCampoBusca(this)">
            `;
        } else if (tipo === "nome") {
            label.textContent = "Digite o Nome";
            grupoInput.innerHTML = `
                <label for="termoBusca" id="labelTermo">Digite o Nome</label>
                <input type="text" id="termoBusca" placeholder="Digite parte ou o nome completo" oninput="ocultarMensagem()">
            `;
        } else if (tipo === "escola") {
            grupoInput.innerHTML = `
                <label for="termoBusca" id="labelTermo">Selecione a Escola</label>
                <select id="termoBusca">
                    <option value="">Selecione a escola</option>
                    <option value="CEAE">CEAE</option>
                    <option value="CETEPE">CETEPE</option>
                    <option value="E M SÃO JOSÉ">E M SÃO JOSÉ</option>
                    <option value="E M SÃO GERALDO">E M SÃO GERALDO</option>
                    <option value="CMEI ANÁLIA NOGUEIRA">CMEI ANÁLIA NOGUEIRA</option>
                </select>
            `;
        }
    }

    // Formatação de CPF se o tipo ativo for CPF
    window.formatarCampoBusca = function(input) {
        const tipo = document.getElementById("tipoBusca").value;
        if (tipo === "cpf") {
            let valor = input.value.replace(/\D/g, "");
            valor = valor.substring(0, 11);
            if (valor.length > 9) {
                valor = valor.replace(/^(\d{3})(\d{3})(\d{3})(\d{0,2}).*/, "$1.$2.$3-$4");
            } else if (valor.length > 6) {
                valor = valor.replace(/^(\d{3})(\d{3})(\d{0,3}).*/, "$1.$2.$3");
            } else if (valor.length > 3) {
                valor = valor.replace(/^(\d{3})(\d{0,3}).*/, "$1.$2");
            }
            input.value = valor;
        }
        ocultarMensagem();
    }

    // PESQUISA INTELIGENTE NO FIREBASE
    window.pesquisarServidor = async function() {
        const tipo = document.getElementById("tipoBusca").value;
        const termo = document.getElementById("termoBusca").value.trim();
        const msgDiv = document.getElementById("mensagem");
        const resultsContainer = document.getElementById("resultsContainer");

        msgDiv.className = "mensagem";
        msgDiv.textContent = "";
        resultsContainer.classList.remove("ativo");
        resultsContainer.innerHTML = "";

        if (!termo) {
            mostrarMensagem("Preencha o campo de pesquisa para continuar.", "erro");
            return;
        }

        try {
            let q;
            if (tipo === "cpf") {
                q = query(collection(db, "servidores"), where("cpf", "==", termo), limit(1));
            } else if (tipo === "nome") {
                q = query(collection(db, "servidores"), where("nome", ">=", termo), where("nome", "<=", termo + "\uf8ff"), limit(20));
            } else if (tipo === "escola") {
                q = query(collection(db, "servidores"), where("escolas", "array-contains", termo), limit(100));
            }

            const querySnapshot = await getDocs(q);

            if (querySnapshot.empty) {
                mostrarMensagem("Nenhum registro encontrado com o termo informado.", "info");
                return;
            }

            let htmlCards = "";
            querySnapshot.forEach((doc) => {
                // Passa o termo da escola como filtro caso a busca tenha sido por escola
                const escolaFiltro = (tipo === "escola") ? termo : null;
                htmlCards += montarCardServidor(doc.data(), escolaFiltro);
            });

            resultsContainer.innerHTML = htmlCards;
            resultsContainer.classList.add("ativo");

        } catch (erro) {
            console.error("Erro na consulta:", erro);
            mostrarMensagem("Erro ao realizar a busca no banco de dados. Verifique sua conexão.", "erro");
        }
    }

    // MONTAGEM DO CARD COM FILTRAGEM INTELIGENTE DE ESCOLA
    function montarCardServidor(servidor, escolaFiltro = null) {
        let htmlMatriculas = "";

        // Função auxiliar para verificar se a escola bate com o filtro de pesquisa
        function escolaCombina(escolaObj) {
            if (!escolaObj) return false;
            if (!escolaFiltro) return true; // Se não buscou por escola, mostra tudo
            return escolaObj.nomeEscola === escolaFiltro;
        }

        // --- MATRÍCULA 1 ---
        if (servidor.matricula1) {
            const m1Escola1Match = escolaCombina(servidor.matricula1.escola1);
            const m1Escola2Match = escolaCombina(servidor.matricula1.escola2);

            // Se buscou por escola e nenhuma das lotações da M1 bate, não exibe a M1
            const mostrarM1 = !escolaFiltro || m1Escola1Match || m1Escola2Match;

            if (mostrarM1) {
                htmlMatriculas += `
                    <div class="matricula-box">
                        <div class="matricula-title">
                            <span class="material-symbols-outlined" style="font-size: 16px;">badge</span>
                            Matrícula 1: ${servidor.matricula1.numeroMatricula} (${servidor.matricula1.cargo})
                        </div>
                `;

                if (m1Escola1Match) {
                    htmlMatriculas += `<p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 4px;"><b>Lotação:</b> ${servidor.matricula1.escola1.nomeEscola} — <b>Linha:</b> ${servidor.matricula1.escola1.empresa} (${servidor.matricula1.escola1.qtdPassagensDiarias} passes/dia)</p>`;
                }
                if (m1Escola2Match) {
                    htmlMatriculas += `<p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 4px;"><b>Lotação:</b> ${servidor.matricula1.escola2.nomeEscola} — <b>Linha:</b> ${servidor.matricula1.escola2.empresa} (${servidor.matricula1.escola2.qtdPassagensDiarias} passes/dia)</p>`;
                }

                htmlMatriculas += `</div>`;
            }
        }

        // --- MATRÍCULA 2 ---
        if (servidor.matricula2) {
            const m2Escola1Match = escolaCombina(servidor.matricula2.escola1);
            const m2Escola2Match = escolaCombina(servidor.matricula2.escola2);

            const mostrarM2 = !escolaFiltro || m2Escola1Match || m2Escola2Match;

            if (mostrarM2) {
                htmlMatriculas += `
                    <div class="matricula-box">
                        <div class="matricula-title">
                            <span class="material-symbols-outlined" style="font-size: 16px;">badge</span>
                            Matrícula 2: ${servidor.matricula2.numeroMatricula} (${servidor.matricula2.cargo})
                        </div>
                `;

                if (m2Escola1Match) {
                    htmlMatriculas += `<p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 4px;"><b>Lotação:</b> ${servidor.matricula2.escola1.nomeEscola} — <b>Linha:</b> ${servidor.matricula2.escola1.empresa} (${servidor.matricula2.escola1.qtdPassagensDiarias} passes/dia)</p>`;
                }
                if (m2Escola2Match) {
                    htmlMatriculas += `<p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 4px;"><b>Lotação:</b> ${servidor.matricula2.escola2.nomeEscola} — <b>Linha:</b> ${servidor.matricula2.escola2.empresa} (${servidor.matricula2.escola2.qtdPassagensDiarias} passes/dia)</p>`;
                }

                htmlMatriculas += `</div>`;
            }
        }

        if (!htmlMatriculas) return "";

        return `
            <div class="servidor-card">
                <div class="servidor-header">
                    <span class="servidor-nome">${servidor.nome}</span>
                    <div class="servidor-meta">
                        <span><b>CPF:</b> ${servidor.cpf}</span>
                        <span><b>Tel:</b> ${servidor.telefone}</span>
                    </div>
                </div>
                ${htmlMatriculas}
            </div>
        `;
    }

    function mostrarMensagem(texto, tipo) {
        const msg = document.getElementById("mensagem");
        msg.textContent = texto;
        msg.className = "mensagem " + tipo;
    }

    window.ocultarMensagem = function() {
        const msg = document.getElementById("mensagem");
        if (msg.classList.contains("erro") || msg.classList.contains("info")) {
            msg.className = "mensagem";
            msg.textContent = "";
        }
    }
</script>

</body>
</html>
