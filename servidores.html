<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
<title>Gerenciar Servidores - Vale Transporte</title>
<style>
:root {
  --primary: #5b2a86;
  --primary-hover: #47206b;
  --primary-light: #f1ebf6;
  --green: #2e7d32;
  --green-hover: #1b5e20;
  --green-light: #eaf6ec;
  --green-border: #72b879;
  --red: #c62828;
  --red-hover: #a51f1f;
  --blue: #0277bd;
  --blue-hover: #01579b;
  --orange: #e65100;
  --orange-light: #fff3e0;
  --orange-border: #ffb74d;
  --text: #263238;
  --text-secondary: #68737d;
  --border: #d9dee3;
  --background: #f4f6f8;
  --white: #ffffff;
  --shadow: 0 2px 8px rgba(0,0,0,0.06);
}
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  -webkit-tap-highlight-color: transparent;
}
body {
  min-height: 100vh;
  background: var(--background);
  color: var(--text);
}

/* TOPBAR - PADRÃO DO SISTEMA */
.topbar {
  width: calc(100% - 64px);
  max-width: 1116px;
  height: 68px;
  margin: 16px auto 0;
  background: var(--white);
  border: 1px solid #e0e4e7;
  border-radius: 8px;
  box-shadow: var(--shadow);
  display: flex;
  align-items: center;
  padding: 0 24px;
}
.topbar-content {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 14px;
}
.logo { width: 38px; height: 38px; object-fit: contain; flex-shrink: 0; }
.system-name { font-size: 17px; font-weight: 700; color: #3d2450; }
.system-divider { width: 1px; height: 24px; background: #dfe3e6; margin: 0 2px; }
.system-module { font-size: 14px; color: var(--text-secondary); flex-grow: 1; }

.status-conexao {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 600;
  padding: 6px 12px;
  border-radius: 20px;
  background: #f1f3f5;
  border: 1px solid #e2e8f0;
  transition: all 0.3s ease;
}
.signal-bars { display: flex; align-items: flex-end; gap: 2px; height: 12px; }
.signal-bars .bar {
  width: 3px;
  background-color: #cbd5e1;
  border-radius: 1px;
  transition: background-color 0.3s ease;
}
.signal-bars .bar-1 { height: 3px; }
.signal-bars .bar-2 { height: 6px; }
.signal-bars .bar-3 { height: 9px; }
.signal-bars .bar-4 { height: 12px; }

.status-conexao.online { color: #2e7d32; background: #edf7ee; border-color: #c8e6c9; }
.status-conexao.online .signal-bars .bar { background-color: #2e7d32; }
.status-conexao.instavel { color: #b45309; background: #fef3c7; border-color: #fde68a; }
.status-conexao.instavel .signal-bars .bar-1,
.status-conexao.instavel .signal-bars .bar-2 { background-color: #d97706; }
.status-conexao.offline { color: #c62828; background: #fff0f0; border-color: #efc5c5; }
.status-conexao.offline .signal-bars .bar {
  background-color: #ef4444;
  animation: pulsar-sinal 1.2s infinite ease-in-out;
}
@keyframes pulsar-sinal {
  0%, 100% { opacity: 0.3; }
  50% { opacity: 1; }
}

.main {
  width: calc(100% - 64px);
  max-width: 1116px;
  margin: 0 auto;
  padding: 32px 0;
}

/* BREADCRUMB */
.breadcrumb {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 13px;
  color: #7b858e;
  margin-bottom: 10px;
}
.breadcrumb .material-symbols-outlined { font-size: 17px; }
.breadcrumb a { text-decoration: none; color: inherit; }
.breadcrumb a:hover { color: var(--primary); }

/* PAGE HEADER */
.page-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
  flex-wrap: wrap;
  gap: 16px;
}
.page-header h1 {
  font-size: 24px;
  font-weight: 700;
  color: #263238;
  margin-bottom: 4px;
}
.page-header p { font-size: 14px; color: var(--text-secondary); }
