<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet"
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

<link rel="stylesheet"
href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">

<!-- Estilo moderno do calendário (Flatpickr) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/material_purple.css">

<title>Novo Servidor - Vale Transporte</title>

<style>

:root {
    --primary: #5b2a86;
    --primary-hover: #47206b;

    --green: #2e7d32;
    --green-hover: #1b5e20;
    --green-light: #eaf6ec;
    --green-border: #72b879;

    --red: #c62828;
    --red-hover: #a51f1f;

    --text: #263238;
    --text-secondary: #68737d;

    --border: #d9dee3;
    --background: #f4f6f8;
    --white: #ffffff;

    --shadow: 0 2px 8px rgba(0,0,0,0.06);
}


/* =====================================================
    RESET
===================================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;

    font-family:
        'Inter',
        -apple-system,
        BlinkMacSystemFont,
        'Segoe UI',
        sans-serif;

    -webkit-tap-highlight-color: transparent;
}


html,
body {
    width: 100%;
    min-height: 100%;
}


body {
    min-height: 100vh;

    background: var(--background);

    color: var(--text);
}


/* =====================================================
    BARRA SUPERIOR
===================================================== */

.topbar {
    width: calc(100% - 64px);
    max-width: 1116px;

    height: 68px;

    margin: 16px auto 0;

    background: var(--white);

    border: 1px solid #e0e4e7;

    border-radius: 8px;

    box-shadow: var(--shadow);

    display: flex;

    align-items: center;

    padding: 0 24px;
}


.topbar-content {
    width: 100%;

    display: flex;

    align-items: center;

    gap: 14px;
}


.logo {
    width: 38px;
    height: 38px;

    object-fit: contain;

    flex-shrink: 0;
}


.system-name {
    font-size: 17px;

    font-weight: 700;

    color: #3d2450;
}


.system-divider {
    width: 1px;

    height: 24px;

    background: #dfe3e6;

    margin: 0 2px;
}


.system-module {
    font-size: 14px;

    color: var(--text-secondary);
}


/* =====================================================
    ÁREA PRINCIPAL
===================================================== */

.main {
    width: calc(100% - 64px);

    max-width: 1116px;

    margin: 0 auto;

    padding: 32px 0;
}


/* =====================================================
    CABEÇALHO
===================================================== */

.page-header {
    margin-bottom: 24px;
}


.breadcrumb {
    display: flex;

    align-items: center;

    gap: 7px;

    font-size: 13px;

    color: #7b858e;

    margin-bottom: 10px;
}


.breadcrumb .material-symbols-outlined {
    font-size: 17px;
}


.page-header h1 {
    font-size: 24px;

    font-weight: 700;

    color: #263238;

    margin-bottom: 6px;
}


.page-header p {
    font-size: 14px;

    color: var(--text-secondary);
}


/* =====================================================
    CARD
===================================================== */

.form-card {
    width: 100%;

    background: var(--white);

    border: 1px solid #e0e4e7;

    border-radius: 8px;

    box-shadow: var(--shadow);

    overflow: hidden;
}


/* =====================================================
    CABEÇALHO DO CARD
===================================================== */

.card-header {
    min-height: 68px;

    padding: 18px 24px;

    border-bottom: 1px solid #e5e8eb;

    display: flex;

    align-items: center;

    gap: 13px;
}


.card-icon {
    width: 38px;
    height: 38px;

    border-radius: 7px;

    background: #f1ebf6;

    color: var(--primary);

    display: flex;

    align-items: center;

    justify-content: center;
}


.card-icon .material-symbols-outlined {
    font-size: 22px;
}


.card-title {
    font-size: 16px;

    font-weight: 700;

    color: #37474f;
}


.card-description {
    font-size: 13px;

    color: var(--text-secondary);

    margin-top: 2px;
}


/* =====================================================
    FORMULÁRIO
===================================================== */

.form {
    width: 100%;
}


.form-body {
    padding: 28px 24px;
}


.form-grid {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 22px 24px;
}


.form-group {
    display: flex;

    flex-direction: column;
}


.form-group.full {
    grid-column: 1 / -1;
}


.form-group label {
    font-size: 13px;

    font-weight: 600;

    color: #455a64;

    margin-bottom: 7px;
}


.form-group label span {
    color: #c62828;
}


/* =====================================================
    CAMPOS
===================================================== */

.form-group input {
    width: 100%;

    height: 44px;

    padding: 0 13px;

    background: #ffffff;

    border: 1px solid var(--border);

    border-radius: 6px;

    outline: none;

    font-size: 14px;

    color: #263238;

    transition:
        border-color .15s ease,
        box-shadow .15s ease,
        background-color .15s ease;
}


.form-group input:hover {
    border-color: #b7c0c7;
}


.form-group input:focus {
    border-color: var(--primary);

    box-shadow:
        0 0 0 3px rgba(91,42,134,.10);
}


/* =====================================================
    CAMPOS PREENCHIDOS
===================================================== */

.form-group input.preenchido {
    background: var(--green-light) !important;

    border-color: var(--green-border) !important;

    color: #263238 !important;
}


.form-group input.preenchido:focus {
    border-color: var(--green) !important;

    box-shadow:
        0 0 0 3px rgba(46,125,50,.12) !important;
}


/* =====================================================
    CAMPO COM ERRO (EX: CPF DUPLICADO)
===================================================== */
.form-group input.erro-input {
    background: #fff0f0 !important;
    border-color: #c62828 !important;
    color: #c62828 !important;
}

.form-group input.erro-input:focus {
    border-color: #c62828 !important;
    box-shadow: 0 0 0 3px rgba(198,40,40,.12) !important;
}


/* =====================================================
    PLACEHOLDER
===================================================== */

.form-group input::placeholder {
    color: #9aa3aa;
}


/* =====================================================
    MENSAGEM
===================================================== */

.mensagem {
    display: none;

    margin: 0 24px 24px;

    padding: 12px 14px;

    border-radius: 6px;

    font-size: 13px;

    font-weight: 500;
}


.mensagem.sucesso {
    display: block;

    background: #edf7ee;

    border: 1px solid #c8e6c9;

    color: #2e7d32;
}


.mensagem.erro {
    display: block;

    background: #fff0f0;

    border: 1px solid #efc5c5;

    color: #c62828;
}


/* =====================================================
    RODAPÉ
===================================================== */

.form-footer {
    min-height: 76px;

    padding: 14px 24px;

    background: #fafbfc;

    border-top: 1px solid #e5e8eb;

    display: flex;

    align-items: center;

    justify-content: space-between;
}


.footer-info {
    font-size: 12px;

    color: #7a858d;
}


.footer-buttons {
    display: flex;

    align-items: center;

    gap: 10px;
}


/* =====================================================
    BOTÕES
===================================================== */

button {
    height: 40px;

    border-radius: 6px;

    padding: 0 17px;

    border: none;

    font-size: 13px;

    font-weight: 600;

    cursor: pointer;

    display: flex;

    align-items: center;

    justify-content: center;

    gap: 7px;

    transition:
        background-color .15s ease,
        border-color .15s ease,
        transform .1s ease;
}


button:active {
    transform: translateY(1px);
}


button:disabled {
    opacity: 0.7;
    cursor: not-allowed;
    transform: none !important;
}


button .material-symbols-outlined {
    font-size: 19px;
}


/* =====================================================
    CANCELAR
===================================================== */

.btn-cancelar {
    background: var(--red);

    color: #ffffff;

    border: 1px solid var(--red);
}


.btn-cancelar:hover {
    background: var(--red-hover);

    border-color: var(--red-hover);
}


/* =====================================================
    SALVAR
===================================================== */

.btn-salvar {
    background: var(--green);

    color: #ffffff;

    border: 1px solid var(--green);
}


.btn-salvar:hover {
    background: var(--green-hover);

    border-color: var(--green-hover);
}


/* =====================================================
    IMPORTAR CSV
===================================================== */

.btn-importar {
    background: var(--green);

    color: #ffffff;

    border: 1px solid var(--green);
}


.btn-importar:hover {
    background: var(--green-hover);

    border-color: var(--green-hover);
}


/* =====================================================
    RESPONSIVO
===================================================== */

@media (max-width: 700px) {

    .topbar {
        width: calc(100% - 24px);

        margin-top: 12px;

        padding: 0 16px;
    }


    .system-divider,
    .system-module {
        display: none;
    }


    .main {
        width: calc(100% - 24px);

        padding: 20px 0;
    }


    .form-grid {
        grid-template-columns: 1fr;

        gap: 18px;
    }


    .form-group.full {
        grid-column: auto;
    }


    .form-body {
        padding: 22px 18px;
    }


    .form-footer {
        padding: 16px 18px;

        flex-direction: column;

        align-items: stretch;

        gap: 14px;
    }


    .footer-info {
        text-align: center;
    }


    .footer-buttons {
        display: grid;

        grid-template-columns: 1fr;

        width: 100%;
    }


    .footer-buttons button {
        width: 100%;
    }

}

</style>
</head>


<body>


<!-- =====================================================
     BARRA SUPERIOR
===================================================== -->

<header class="topbar">

    <div class="topbar-content">

        <img
            class="logo"
            src="https://drive.google.com/thumbnail?id=1Epk870R1TRNRFx4ionkXV-HDkgRyrATQ"
            alt="Logo"
        >

        <span class="system-name">
            Vale Transporte
        </span>

        <div class="system-divider"></div>

        <span class="system-module">
           Semed-Recursos Humanos-Gestão de Benefícios
        </span>

    </div>

</header>


<!-- =====================================================
     CONTEÚDO
===================================================== -->

<main class="main">


    <div class="page-header">

        <div class="breadcrumb">

            <span class="material-symbols-outlined">
                home
            </span>

            <span>Servidores</span>

            <span>/</span>

            <span>Novo cadastro</span>

        </div>


        <h1>
            Novo Servidor
        </h1>


        <p>
            Cadastre um novo servidor no sistema de Vale Transporte.
        </p>

    </div>


    <!-- =================================================
         CARD
    ================================================ -->

    <section class="form-card">


        <div class="card-header">

            <div class="card-icon">

                <span class="material-symbols-outlined">
                    person_add
                </span>

            </div>


            <div>

                <div class="card-title">
                    Dados do servidor
                </div>

                <div class="card-description">
                    Informe os dados cadastrais abaixo.
                </div>

            </div>

        </div>


        <!-- =================================================
             FORMULÁRIO
        ================================================ -->

        <form
            class="form"
            id="formServidor"
            onsubmit="salvarServidor(event)"
        >


            <div class="form-body">


                <div class="form-grid">

                    <!-- NOME -->

                    <div class="form-group full">

                        <label for="nome">
                            Nome completo <span>*</span>
                        </label>

                        <input
                            type="text"
                            id="nome"
                            name="nome"
                            placeholder="Digite o nome completo"
                            autocomplete="name"
                            required
                        >

                    </div>


                    <!-- CPF -->

                    <div class="form-group">

                        <label for="cpf">
                            CPF <span>*</span>
                        </label>

                        <input
                            type="text"
                            id="cpf"
                            name="cpf"
                            placeholder="000.000.000-00"
                            maxlength="14"
                            inputmode="numeric"
                            required
                            oninput="formatarCPF(this)"
                            onblur="verificarCpfDuplicado(this)"
                        >

                    </div>


                    <!-- EMAIL -->

                    <div class="form-group">

                        <label for="email">
                            E-mail <span>*</span>
                        </label>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="servidor@exemplo.com"
                            autocomplete="email"
                            required
                        >

                    </div>


                    <!-- DATA NASCIMENTO -->

                    <div class="form-group">

                        <label for="dataNascimento">
                            Data de nascimento <span>*</span>
                        </label>

                        <input
                            type="date"
                            id="dataNascimento"
                            name="dataNascimento"
                            required
                        >

                    </div>


                    <!-- DATA ADMISSÃO -->

                    <div class="form-group">

                        <label for="dataAdmissao">
                            Data de admissão <span>*</span>
                        </label>

                        <input
                            type="date"
                            id="dataAdmissao"
                            name="dataAdmissao"
                            required
                        >

                    </div>


                    <!-- CARGO -->

                    <div class="form-group">

                        <label for="cargo">
                            Cargo <span>*</span>
                        </label>

                        <input
                            type="text"
                            id="cargo"
                            name="cargo"
                            placeholder="Digite o cargo"
                            required
                        >

                    </div>


                    <!-- TELEFONE -->

                    <div class="form-group">

                        <label for="telefone">
                            Telefone para contato <span>*</span>
                        </label>

                        <input
                            type="tel"
                            id="telefone"
                            name="telefone"
                            placeholder="(00) 00000-0000"
                            maxlength="15"
                            inputmode="numeric"
                            autocomplete="tel"
                            required
                            oninput="formatarTelefone(this)"
                        >

                    </div>


                </div>

            </div>


            <!-- =================================================
                 MENSAGEM
            ================================================ -->

            <div
                id="mensagem"
                class="mensagem"
            ></div>


            <!-- =================================================
                 RODAPÉ
            ================================================ -->

            <div class="form-footer">


                <div class="footer-info">

                    <span>*</span>
                    Campos obrigatórios

                </div>


                <div class="footer-buttons">


                    <button
                        type="button"
                        class="btn-importar"
                        onclick="importarCSV()"
                    >

                        <span class="material-symbols-outlined">
                            upload_file
                        </span>

                        Importar CSV

                    </button>
                    

                    <button
                        type="submit"
                        id="btnSalvar"
                        class="btn-salvar"
                    >

                        <span class="material-symbols-outlined" id="iconeSalvar">
                            save
                        </span>

                        <span id="textoBotao">Salvar</span>

                    </button>

                    <button
                        type="button"
                        class="btn-cancelar"
                        onclick="cancelar()"
                    >

                        Cancelar

                    </button>


                </div>

            </div>

        </form>

    </section>

</main>


<!-- Script do Flatpickr (Calendário Moderno) -->
<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/pt.js"></script>

<!-- SCRIPT MODULARIZADO COM FIREBASE -->
<script type="module">
    // Importa a conexão central do nosso firebase.js e os módulos de consulta
    import { db } from "./firebase.js";
    import { collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    /* =====================================================
       CACHE LOCAL DE CPFs (ZERO LEITURAS NA VALIDAÇÃO)
    ===================================================== */
    let cpfsCadastradosCache = new Set();

    async function carregarCacheCPFs() {
        try {
            const querySnapshot = await getDocs(collection(db, "servidores"));
            cpfsCadastradosCache.clear();
            querySnapshot.forEach((doc) => {
                const dados = doc.data();
                if (dados.cpf) {
                    const cpfLimpo = dados.cpf.replace(/\D/g, "");
                    cpfsCadastradosCache.add(cpfLimpo);
                }
            });
        } catch (erro) {
            console.error("Erro ao carregar cache de CPFs:", erro);
        }
    }

    /* =====================================================
        INICIALIZAÇÃO DO CALENDAR FLATPICKR
    ===================================================== */
    document.addEventListener("DOMContentLoaded", function() {
        carregarCacheCPFs();

        flatpickr("input[type='date']", {
            locale: "pt",
            dateFormat: "Y-m-d",
            allowInput: false,
            onChange: function(selectedDates, dateStr, instance) {
                window.atualizarCorCampo(instance.element);
                ocultarMensagem();
            }
        });

        const campos = document.querySelectorAll("#formServidor input");

        campos.forEach(function(campo) {
            campo.addEventListener("input", function() {
                atualizarCorCampo(campo);
                ocultarMensagem();
            });

            atualizarCorCampo(campo);
        });
    });

    /* =====================================================
        CAMPOS PREENCHIDOS
    ===================================================== */
    window.atualizarCorCampo = function(campo) {
        if (campo.value && campo.value.trim() !== "") {
            if (!campo.classList.contains("erro-input")) {
                campo.classList.add("preenchido");
            }
        } else {
            campo.classList.remove("preenchido");
            campo.classList.remove("erro-input");
        }
    }

    /* =====================================================
        CPF
    ===================================================== */
    window.formatarCPF = function(input) {
        let valor = input.value.replace(/\D/g, "");
        valor = valor.substring(0, 11);

        if (valor.length > 9) {
            valor = valor.replace(/^(\d{3})(\d{3})(\d{3})(\d{0,2}).*/, "$1.$2.$3-$4");
        } else if (valor.length > 6) {
            valor = valor.replace(/^(\d{3})(\d{3})(\d{0,3}).*/, "$1.$2.$3");
        } else if (valor.length > 3) {
            valor = valor.replace(/^(\d{3})(\d{0,3}).*/, "$1.$2");
        }

        input.value = valor;
        input.classList.remove("erro-input");
        atualizarCorCampo(input);
    }

    /* =====================================================
        VERIFICAÇÃO DE CPF JÁ CADASTRADO (USANDO CACHE LOCAL)
    ===================================================== */
    window.verificarCpfDuplicado = function(input) {
        const cpf = input.value.trim();
        const cpfNumeros = cpf.replace(/\D/g, "");

        if (cpfNumeros.length === 11) {
            if (cpfsCadastradosCache.has(cpfNumeros)) {
                mostrarMensagem("Atenção: Este CPF já está cadastrado no sistema!", "erro");
                input.classList.remove("preenchido");
                input.classList.add("erro-input");
                input.focus();
            } else {
                input.classList.remove("erro-input");
                atualizarCorCampo(input);
                ocultarMensagem();
            }
        } else {
            input.classList.remove("erro-input");
        }
    }

    /* =====================================================
        TELEFONE
    ===================================================== */
    window.formatarTelefone = function(input) {
        let valor = input.value.replace(/\D/g, "");
        valor = valor.substring(0, 11);

        if (valor.length > 10) {
            valor = valor.replace(/^(\d{2})(\d{5})(\d{0,4}).*/, "($1) $2-$3");
        } else if (valor.length > 6) {
            valor = valor.replace(/^(\d{2})(\d{4})(\d{0,4}).*/, "($1) $2-$3");
        } else if (valor.length > 2) {
            valor = valor.replace(/^(\d{2})(\d{0,5}).*/, "($1) $2");
        } else if (valor.length > 0) {
            valor = valor.replace(/^(\d{0,2})/, "($1");
        }

        input.value = valor;
        atualizarCorCampo(input);
    }

    /* =====================================================
        SALVAR NO FIREBASE COM CACHE DE CPF
    ===================================================== */
    window.salvarServidor = async function(event) {
        event.preventDefault();

        const nome = document.getElementById("nome").value.trim();
        const cpf = document.getElementById("cpf").value.trim();
        const email = document.getElementById("email").value.trim();
        const dataNascimento = document.getElementById("dataNascimento").value;
        const dataAdmissao = document.getElementById("dataAdmissao").value;
        const cargo = document.getElementById("cargo").value.trim();
        const telefone = document.getElementById("telefone").value.trim();

        const cpfNumeros = cpf.replace(/\D/g, "");
        const telefoneNumeros = telefone.replace(/\D/g, "");

        if (!nome || !cpf || !email || !dataNascimento || !dataAdmissao || !cargo || !telefone) {
            mostrarMensagem("Preencha todos os campos obrigatórios.", "erro");
            return;
        }

        if (cpfNumeros.length !== 11) {
            mostrarMensagem("O CPF deve possuir exatamente 11 dígitos.", "erro");
            document.getElementById("cpf").focus();
            return;
        }

        if (telefoneNumeros.length !== 10 && telefoneNumeros.length !== 11) {
            mostrarMensagem("Informe um telefone válido.", "erro");
            document.getElementById("telefone").focus();
            return;
        }

        // Validação imediata usando o cache local (Zero leituras extras)
        if (cpfsCadastradosCache.has(cpfNumeros)) {
            mostrarMensagem("Este CPF já está cadastrado no sistema!", "erro");
            const campoCpf = document.getElementById("cpf");
            campoCpf.classList.remove("preenchido");
            campoCpf.classList.add("erro-input");
            campoCpf.focus();
            return;
        }

        const btnSalvar = document.getElementById("btnSalvar");
        const textoBotao = document.getElementById("textoBotao");
        const iconeSalvar = document.getElementById("iconeSalvar");

        btnSalvar.disabled = true;
        textoBotao.textContent = "Salvando...";
        iconeSalvar.textContent = "sync";

        try {
            await addDoc(collection(db, "servidores"), {
                nome: nome,
                cpf: cpf,
                email: email,
                dataNascimento: dataNascimento,
                dataAdmissao: dataAdmissao,
                cargo: cargo,
                telefone: telefone,
                dataCriacao: new Date().toISOString()
            });

            // Atualiza o cache local adicionando o novo CPF salvo
            cpfsCadastradosCache.add(cpfNumeros);

            document.getElementById("formServidor").reset();
            
            const dateInputs = document.querySelectorAll("input[type='date']");
            dateInputs.forEach(input => {
                if (input._flatpickr) {
                    input._flatpickr.clear();
                }
            });

            const campos = document.querySelectorAll("#formServidor input");
            campos.forEach(function(campo) {
                campo.classList.remove("preenchido");
                campo.classList.remove("erro-input");
            });

            mostrarMensagem("Servidor cadastrado com sucesso!", "sucesso");

        } catch (erro) {
            console.error("Erro ao salvar no Firebase: ", erro);
            mostrarMensagem("Erro de conexão! Não foi possível salvar. Verifique sua internet.", "erro");
        } finally {
            btnSalvar.disabled = false;
            textoBotao.textContent = "Salvar";
            iconeSalvar.textContent = "save";
        }
    }

    /* =====================================================
        IMPORTAR CSV
    ===================================================== */
    window.importarCSV = function() {
        alert("Função de importação CSV será implementada.");
    }

    /* =====================================================
        CANCELAR / LIMPAR
    ===================================================== */
    window.cancelar = function() {
        document.getElementById("formServidor").reset();

        const dateInputs = document.querySelectorAll("input[type='date']");
        dateInputs.forEach(input => {
            if (input._flatpickr) {
                input._flatpickr.clear();
            }
        });

        const campos = document.querySelectorAll("#formServidor input");
        campos.forEach(function(campo) {
            campo.classList.remove("preenchido");
            campo.classList.remove("erro-input");
        });

        ocultarMensagem();
    }

    /* =====================================================
        MENSAGEM
    ===================================================== */
    window.mostrarMensagem = function(texto, tipo) {
        const mensagem = document.getElementById("mensagem");
        mensagem.textContent = texto;
        mensagem.className = "mensagem " + tipo;
    }

    window.ocultarMensagem = function() {
        const mensagem = document.getElementById("mensagem");
        if (mensagem.classList.contains("sucesso") || mensagem.classList.contains("erro")) {
            mensagem.className = "mensagem";
            mensagem.textContent = "";
        }
    }
</script>

</body>
</html>
