<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel da Escola</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: #f5f7fa; color: #1a1a1a; font-size: 16px; }
    .topo { display: flex; justify-content: space-between; align-items: center; background: #1e3a8a; color: #fff; padding: 1rem 1.5rem; flex-wrap: wrap; gap: .5rem; }
    .topo h1 { font-size: 1.1rem; margin: 0; }
    .usuario { font-size: .9rem; display: flex; align-items: center; gap: .6rem; }
    .usuario select { padding: .45rem .6rem; border-radius: 4px; border: none; font-size: .9rem; max-width: 260px; }

    /* Abas */
    .abas { display: flex; background: #fff; border-bottom: 1px solid #e2e8f0; padding: 0 1rem; gap: 1rem; overflow-x: auto; }
    .aba { background: none; border: none; padding: 1rem 0.5rem; font-size: .95rem; font-weight: 500; color: #64748b; cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap; }
    .aba.ativa { color: #1e3a8a; border-bottom-color: #1e3a8a; }

    .tela { max-width: 1000px; margin: 1.5rem auto; padding: 0 1rem; }
    .hidden { display: none; }
    h2 { margin-top: 0; font-size: 1.3rem; color: #1e293b; }
    .subtitulo { color: #555; margin-bottom: 1.2rem; font-size: .92rem; }

    .card-tarefa { background: #fff; border-radius: 8px; padding: 1rem 1.2rem; margin-bottom: 1rem; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .card-tarefa h3 { margin: 0 0 .5rem; font-size: 1rem; }
    .card-tarefa p { margin: .2rem 0; font-size: .88rem; }
    .card-tarefa.evento { border-left: 4px solid #7c3aed; }
    .card-tarefa.evento h3 { color: #6d28d9; }

    .bloco-registro { background: #fff; border-radius: 8px; padding: 1rem 1.2rem; margin-bottom: 1rem; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    .bloco-registro.evento { border-left: 4px solid #7c3aed; }
    .bloco-registro .cabecalho { display: flex; align-items: center; gap: .6rem; margin-bottom: .8rem; flex-wrap: wrap; }
    .bloco-registro h4 { margin: 0; font-size: 1rem; }

    .tag-tipo { display: inline-block; padding: .15rem .55rem; border-radius: 10px; font-size: .7rem; font-weight: 600; text-transform: uppercase; }
    .tag-aluno { background: #dbeafe; color: #1e40af; }
    .tag-escola { background: #dcfce7; color: #166534; }
    .tag-servidor { background: #f3e8ff; color: #6b21a8; }
    .tag-evento { background: #ede9fe; color: #6d28d9; }

    .campo { margin-bottom: .6rem; display: flex; flex-direction: column; }
    .campo label { font-size: .85rem; color: #555; margin-bottom: .2rem; }
    .campo input, .campo select { padding: .55rem .7rem; border: 1px solid #ccc; border-radius: 4px; font-size: .95rem; }
    .campo input:disabled { background: #f1f5f9; color: #94a3b8; cursor: not-allowed; }

    .btn-primario { background: #1e3a8a; color: #fff; border: none; padding: .7rem 1.2rem; border-radius: 4px; cursor: pointer; font-size: .95rem; font-weight: 500; transition: background 0.2s; }
    .btn-primario:hover { background: #16306e; }
    .btn-secundario { background: #fff; color: #1e3a8a; border: 1px solid #cbd5e1; padding: .6rem 1rem; border-radius: 4px; cursor: pointer; font-size: .9rem; font-weight: 500; transition: background 0.2s; }
    .btn-secundario:hover { background: #f8fafc; }
    .btn-perigo { background: #fee2e2; color: #b91c1c; border: none; padding: .6rem 1rem; border-radius: 4px; cursor: pointer; font-size: .9rem; font-weight: 500; transition: background 0.2s; }
    .btn-perigo:hover { background: #fecaca; }
    
    .btn-voltar { background: none; border: none; color: #1e3a8a; cursor: pointer; margin-bottom: 1rem; font-size: .9rem; padding: .3rem 0; }
    .rodape-form { text-align: right; margin-top: 1.5rem; }
    .vazio { color: #888; }

    .barra-confirmar { background: #f3e8ff; border-radius: 8px; padding: .8rem 1rem; margin-bottom: 1rem; display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; border-left: 4px solid #7c3aed; }
    .barra-confirmar .texto { flex: 1; font-size: .9rem; color: #4c1d95; }
    .barra-confirmar button { background: #7c3aed; color: #fff; border: none; padding: .6rem 1rem; border-radius: 4px; cursor: pointer; font-size: .9rem; font-weight: 500; transition: background 0.2s; }
    .barra-confirmar button:hover { background: #6d28d9; }

    /* Tabela de Meus Dados */
    .tabela-wrap { overflow-x: auto; background: #fff; border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
    th { background: #f8fafc; padding: 0.8rem 1rem; color: #64748b; font-weight: 500; border-bottom: 1px solid #e2e8f0; }
    td { padding: 0.8rem 1rem; border-bottom: 1px solid #f1f5f9; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }

    @media (max-width: 768px) {
      .topo { padding: .8rem 1rem; }
      .tela { margin: 1rem auto; padding: 0 .8rem; }
      .rodape-form button { width: 100%; }
      .barra-confirmar { flex-direction: column; align-items: stretch; }
      .topo-acoes { flex-direction: column; align-items: flex-start !important; }
      .topo-acoes button { width: 100%; }
    }
  </style>
</head>
<body>

  <header class="topo">
    <h1>Painel da Escola</h1>
    <div class="usuario">
      <select id="seletorEscola"></select>
    </div>
  </header>

  <div class="abas">
    <button class="aba ativa" data-aba="tarefas" id="tab-tarefas">Solicitações Pendentes</button>
    <button class="aba" data-aba="meus-dados" id="tab-meus-dados">Meus Dados</button>
  </div>

  <!-- TELA: TAREFAS -->
  <section id="tela-tarefas" class="tela">
    <h2>Tarefas Pendentes</h2>
    <p class="subtitulo">Preencha os dados solicitados pelos setores da Secretaria.</p>
    <div id="listaTarefas"></div>
  </section>

  <section id="tela-formulario" class="tela hidden">
    <button id="btnVoltar" class="btn-voltar">← Voltar para tarefas</button>
    <h2 id="tituloTarefa">Tarefa</h2>
    <p id="descricaoTarefa" class="subtitulo"></p>
    <div id="barraConfirmar"></div>
    <div id="listaRegistros"></div>
    <div class="rodape-form">
      <button id="btnSalvarTodos" class="btn-primario">Salvar tudo</button>
    </div>
  </section>

  <!-- TELA: MEUS DADOS -->
  <section id="tela-meus-dados" class="tela hidden">
    <div class="topo-acoes" style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 1rem; flex-wrap:wrap; gap:1rem;">
      <div>
        <h2>Gestão de Dados</h2>
        <p class="subtitulo" style="margin:0;">Mantenha os dados da sua escola sempre atualizados.</p>
      </div>
      <div style="display:flex; gap:8px; flex-wrap:wrap;">
        <button id="btnAddNovo" class="btn-primario" style="background:#16a34a; display:none;">+ Novo</button>
        <button id="btnConfirmarTudoDados" class="btn-primario">✓ Confirmar todos os dados</button>
      </div>
    </div>

    <div class="abas" style="margin-bottom: 1rem; border-radius: 8px;">
      <button class="aba ativa" data-dados="alunos" style="padding: 0.8rem 1rem;">Alunos</button>
      <button class="aba" data-dados="servidores" style="padding: 0.8rem 1rem;">Servidores</button>
      <button class="aba" data-dados="escola" style="padding: 0.8rem 1rem;">Dados da Escola</button>
    </div>

    <div id="listaMeusDados"></div>
  </section>

  <!-- TELA: ADICIONAR / EDITAR -->
  <section id="tela-editar-registro" class="tela hidden">
    <button id="btnVoltarMeusDados" class="btn-voltar">← Voltar</button>
    <h2 id="tituloEdicao">Editar Registro</h2>
    <div id="formEdicaoRegistro" class="bloco-registro" style="max-width: 600px;"></div>
    <div class="rodape-form" style="max-width: 600px;">
      <button id="btnSalvarEdicaoRegistro" class="btn-primario">Salvar</button>
    </div>
  </section>

  <section id="tela-sucesso" class="tela hidden">
    <h2>✅ Dados enviados!</h2>
    <p>As informações foram salvas no banco da rede municipal.</p>
    <button id="btnVoltarTarefas" class="btn-primario">Continuar</button>
  </section>

  <script>
    const DB_KEY = "rede_municipal_db";
    let ESCOLA_ATUAL = null;
    let db = carregarDB();
    let tarefaAtual = null;
    let tipoEdicaoAtual = null;
    let registroEdicaoAtual = null;
    let abaDadosAtiva = "alunos";

    function carregarDB() {
      const raw = localStorage.getItem(DB_KEY);
      if (!raw) {
        const inicial = { escolas: [], alunos: [], servidores: [], tarefas: [], campos: [], eventos: [] };
        localStorage.setItem(DB_KEY, JSON.stringify(inicial));
        return inicial;
      }
      const db = JSON.parse(raw);
      db.escolas = db.escolas || []; db.alunos = db.alunos || []; db.servidores = db.servidores || [];
      db.tarefas = db.tarefas || []; db.campos = db.campos || []; db.eventos = db.eventos || [];
      return db;
    }
    function salvarDB(db) { localStorage.setItem(DB_KEY, JSON.stringify(db)); }

    function getCatalogo() {
      const db = carregarDB();
      const porTipo = { aluno: [], escola: [], servidor: [] };
      (db.campos || []).forEach(c => { if (porTipo[c.tipo]) porTipo[c.tipo].push(c); });
      return porTipo;
    }
    function definicaoDoCampo(tipo, campoId) {
      return (getCatalogo()[tipo] || []).find(x => x.id === campoId) || null;
    }
    function labelDoCampo(tipo, campoId) {
      const def = definicaoDoCampo(tipo, campoId);
      return def ? def.label : campoId;
    }
    function ehCalculado(tipo, campoId) {
      const def = definicaoDoCampo(tipo, campoId);
      return !!(def && def.calculado);
    }
    function gerarSlug(texto) {
      return (texto || "").toString().toLowerCase()
        .normalize("NFD").replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-z0-9\s-]/g, "").trim()
        .replace(/\s+/g, "_").replace(/-+/g, "_")
        .replace(/_+/g, "_").replace(/^_|_$/g, "");
    }
    function gerarIdUnico(nomeBase, tipo, db) {
      let slug = gerarSlug(nomeBase);
      if (!slug) slug = tipo;
      let id = slug;
      let contador = 2;
      const colecao = tipo === "aluno" ? db.alunos : tipo === "escola" ? db.escolas : db.servidores;
      while (colecao.find(x => x.id === id)) { id = `${slug}_${contador}`; contador++; }
      return id;
    }

    function calcularSelo(registro, tipo) {
      const temConfirmacao = !!registro.confirmadoEm;
      const temEdicao = !!registro.atualizadoEm;
      if (!temConfirmacao && !temEdicao) return { texto: "Nunca", cor: "#a1a1aa", bg: "#f4f4f5" };
      const dataRefObj = new Date(registro.confirmadoEm || registro.atualizadoEm);
      const dbAtual = carregarDB();
      
      const camposComPrazo = dbAtual.campos.filter(c => c.tipo === tipo && c.validade === "prazo" && c.prazoMeses && !c.calculado);
      let pior = "atual";
      for (const campo of camposComPrazo) {
        if (!registro[campo.id]) continue;
        const prazoMs = campo.prazoMeses * 30 * 24 * 60 * 60 * 1000;
        const pct = (Date.now() - dataRefObj.getTime()) / prazoMs;
        if (pct > 1) { pior = "desatualizado"; break; }
        else if (pct > 0.8 && pior !== "desatualizado") pior = "atencao";
      }
      if (pior === "desatualizado") return { texto: "Desatualizado", cor: "#991b1b", bg: "#fee2e2" };
      
      const eventos = (dbAtual.eventos || []).filter(e => e.tipo === tipo).sort((a, b) => new Date(b.dataInicio || 0) - new Date(a.dataInicio || 0));
      let seloEv = "atual";
      if (eventos.length > 0) {
        if (!registro.ultimoEvento) {
          const dataEvt = eventos[0].dataInicio ? new Date(eventos[0].dataInicio) : new Date(0);
          if (dataRefObj < dataEvt) {
            const depois = eventos.filter(e => new Date(e.dataInicio || 0) > dataRefObj);
            if (depois.length === 1) seloEv = "atencao";
            else if (depois.length >= 2) seloEv = "desatualizado";
          }
        } else {
          const pos = eventos.findIndex(e => e.id === registro.ultimoEvento);
          if (pos === 1) seloEv = "atencao";
          else if (pos >= 2) seloEv = "desatualizado";
        }
      }
      if (seloEv === "desatualizado") return { texto: "Desatualizado", cor: "#991b1b", bg: "#fee2e2" };
      if (seloEv === "atencao" || pior === "atencao") return { texto: "Atenção", cor: "#92400e", bg: "#fef3c7" };
      return { texto: "Atual", cor: "#166534", bg: "#dcfce7" };
    }

    // ==========================================
    // NOVO: SINCRONIZAÇÃO DE TAREFAS
    // ==========================================
    function sincronizarTarefasPendentes(tipoRegistro, idRegistro) {
      const dbAtual = carregarDB();
      const agora = new Date().toISOString();
      let tarefasAtualizadas = false;

      dbAtual.tarefas.forEach(tarefa => {
        if (tarefa.escolaId !== ESCOLA_ATUAL) return;

        tarefa.registros.forEach(reg => {
          // Se a tarefa é para este registro específico e não está concluída
          if (reg.tipo === tipoRegistro && reg.id === idRegistro && reg.status !== "concluida") {
            
            // Busca os dados atualizados no banco
            const colecao = tipoRegistro === "aluno" ? dbAtual.alunos : tipoRegistro === "escola" ? dbAtual.escolas : dbAtual.servidores;
            const objAtualizado = colecao.find(x => x.id === idRegistro);

            if (objAtualizado) {
              // Remove da lista de faltantes os campos que já foram preenchidos
              const faltandoAtual = (reg.camposFaltando || []).filter(campo => {
                if (ehCalculado(tipoRegistro, campo)) return false;
                // Se o campo ainda está vazio no banco, continua faltando
                return !objAtualizado[campo] || objAtualizado[campo].toString().trim() === "";
              });

              // Atualiza a lista de faltantes
              reg.camposFaltando = faltandoAtual;

              // Se não falta mais nada, conclui o registro
              if (faltandoAtual.length === 0) {
                reg.status = "concluida";
                tarefasAtualizadas = true;
              }
            }
          }
        });

        // Verifica se a tarefa inteira já pode ser concluída
        const aindaPendentes = tarefa.registros.some(r => r.status !== "concluida");
        if (!aindaPendentes && tarefa.status !== "concluida") {
          tarefa.status = "concluida";
          tarefa.atualizadoEm = agora;
          tarefasAtualizadas = true;
          
          // Se for evento, verifica encerramento
          if (tarefa.eventoId) verificarEncerramentoEvento(tarefa.eventoId);
        } else if (aindaPendentes && tarefa.status === "pendente") {
          tarefa.status = "em_andamento";
          tarefa.atualizadoEm = agora;
          tarefasAtualizadas = true;
        }
      });

      if (tarefasAtualizadas) {
        salvarDB(dbAtual);
        console.log("Tarefas sincronizadas com sucesso.");
      }
    }

    const ROTULO_TIPO = { aluno: "Aluno", escola: "Escola", servidor: "Servidor" };

    const telas = {
      tarefas: document.getElementById("tela-tarefas"),
      formulario: document.getElementById("tela-formulario"),
      meusDados: document.getElementById("tela-meus-dados"),
      editarRegistro: document.getElementById("tela-editar-registro"),
      sucesso: document.getElementById("tela-sucesso")
    };
    function mostrarTela(nome) {
      Object.values(telas).forEach(t => t.classList.add("hidden"));
      telas[nome].classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // NAVEGAÇÃO DE ABAS DO TOPO
    document.querySelectorAll(".abas .aba[data-aba]").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".abas .aba[data-aba]").forEach(t => t.classList.remove("ativa"));
        tab.classList.add("ativa");
        if (tab.dataset.aba === "tarefas") {
          mostrarTela("tarefas");
          carregarTarefas();
        } else {
          mostrarTela("meusDados");
          carregarMeusDados();
        }
      });
    });

    function montarSeletorEscola() {
      db = carregarDB();
      const select = document.getElementById("seletorEscola");
      select.innerHTML = "";
      if (db.escolas.length === 0) {
        select.innerHTML = '<option value="">Nenhuma escola cadastrada</option>';
        ESCOLA_ATUAL = null;
        return;
      }
      db.escolas.forEach(e => {
        const opt = document.createElement("option");
        opt.value = e.id;
        opt.textContent = e.nome || e.id;
        select.appendChild(opt);
      });
      if (ESCOLA_ATUAL && db.escolas.find(e => e.id === ESCOLA_ATUAL)) {
        select.value = ESCOLA_ATUAL;
      } else {
        ESCOLA_ATUAL = db.escolas[0].id;
        select.value = ESCOLA_ATUAL;
      }
    }

    document.getElementById("seletorEscola").addEventListener("change", (e) => {
      ESCOLA_ATUAL = e.target.value;
      carregarTarefas();
      if (!telas.meusDados.classList.contains("hidden")) carregarMeusDados();
      else mostrarTela("tarefas");
    });

    // ==========================================
    // FLUXO DE TAREFAS
    // ==========================================
    function carregarTarefas() {
      db = carregarDB();
      const lista = document.getElementById("listaTarefas");
      lista.innerHTML = "";
      if (!ESCOLA_ATUAL) {
        lista.innerHTML = "<p class='vazio'>Nenhuma escola cadastrada. Peça ao administrador.</p>";
        return;
      }
      const pendentes = db.tarefas.filter(t =>
        t.escolaId === ESCOLA_ATUAL &&
        (t.registros || []).some(r => r.status !== "concluida")
      );
      if (pendentes.length === 0) {
        lista.innerHTML = "<p class='vazio'>🎉 Nenhuma tarefa pendente!</p>";
        return;
      }
      pendentes.forEach((t) => {
        const card = document.createElement("div");
        const ehEvento = !!t.eventoId;
        card.className = "card-tarefa" + (ehEvento ? " evento" : "");
        const totalPendentes = (t.registros || []).filter(r => r.status !== "concluida").length;
        const tagEvento = ehEvento ? `<span class="tag-tipo tag-evento">🔄 Evento</span> ` : "";
        card.innerHTML = `
          <h3>${tagEvento}${t.titulo}</h3>
          <p><strong>Setor:</strong> ${t.setorSolicitante}</p>
          <p><strong>Registros a preencher:</strong> ${totalPendentes}</p>
          <button class="btn-primario" style="margin-top:.6rem;">Abrir</button>
        `;
        card.querySelector("button").addEventListener("click", () => abrirTarefa(t.id));
        lista.appendChild(card);
      });
    }

    function abrirTarefa(tarefaId) {
      db = carregarDB();
      tarefaAtual = db.tarefas.find(t => t.id === tarefaId);
      mostrarTela("formulario");
      const ehEvento = !!tarefaAtual.eventoId;
      document.getElementById("tituloTarefa").textContent = (ehEvento ? "🔄 " : "") + tarefaAtual.titulo;

      const camposTexto = Object.entries(tarefaAtual.camposPorTipo || {})
        .filter(([_, v]) => v.length > 0)
        .map(([tipo, campos]) => {
          const visiveis = campos.filter(c => !ehCalculado(tipo, c));
          if (visiveis.length === 0) return null;
          return `${ROTULO_TIPO[tipo]}: ${visiveis.map(c => labelDoCampo(tipo, c)).join(", ")}`;
        }).filter(Boolean).join(" | ");
      document.getElementById("descricaoTarefa").textContent = camposTexto;

      const barra = document.getElementById("barraConfirmar");
      if (ehEvento) {
        barra.innerHTML = `<div class="barra-confirmar"><span class="texto">💡 <strong>Evento:</strong> confirme os dados.</span><button id="btnConfirmarTudo">✓ Confirmar todos</button></div>`;
        document.getElementById("btnConfirmarTudo").addEventListener("click", confirmarTudo);
      } else barra.innerHTML = "";

      const listaRegistros = document.getElementById("listaRegistros");
      listaRegistros.innerHTML = "";
      const pendentes = (tarefaAtual.registros || []).filter(r => r.status !== "concluida");
      
      if (pendentes.length === 0) {
        listaRegistros.innerHTML = "<p class='vazio'>✅ Nada para preencher nesta tarefa.</p>";
        return;
      }
      
      pendentes.forEach((r) => {
        const bloco = document.createElement("div");
        bloco.className = "bloco-registro" + (ehEvento ? " evento" : "");
        const colecao = r.tipo === "aluno" ? db.alunos : r.tipo === "escola" ? db.escolas : db.servidores;
        const objBanco = colecao.find(x => x.id === r.id) || {};

        let html = `<div class="cabecalho"><span class="tag-tipo tag-${r.tipo}">${ROTULO_TIPO[r.tipo]}</span><h4>${r.nome || "(sem nome)"}</h4></div>`;
        
        (r.camposFaltando || []).forEach((campoId) => {
          if (ehCalculado(r.tipo, campoId)) return;
          const def = definicaoDoCampo(r.tipo, campoId);
          html += `<div class="campo"><label>${def ? def.label : campoId}</label>${renderizarInput(def ? def.tipoCampo : "text", campoId, objBanco[campoId] || "", def)}</div>`;
        });

        bloco.innerHTML = html;
        bloco.dataset.registroId = r.id;
        bloco.dataset.tipo = r.tipo;
        listaRegistros.appendChild(bloco);
      });
    }

    function renderizarInput(tipoCampo, campoId, valor, def) {
      const attr = `data-campo="${campoId}"`;
      const val = (valor ?? "").toString().replace(/"/g, "&quot;");
      if (tipoCampo === "escola") {
        const dbAtual = carregarDB();
        let options = '<option value="">Selecione...</option>';
        dbAtual.escolas.forEach(e => { options += `<option value="${e.id}" ${valor === e.id ? "selected" : ""}>${e.nome}</option>`; });
        return `<select ${attr}>${options}</select>`;
      }
      if (tipoCampo === "select") {
        let options = '<option value="">Selecione...</option>';
        (def && def.opcoes ? def.opcoes : []).forEach(o => { options += `<option value="${o}" ${valor === o ? "selected" : ""}>${o}</option>`; });
        return `<select ${attr}>${options}</select>`;
      }
      if (tipoCampo === "date")   return `<input type="date" ${attr} value="${val}">`;
      if (tipoCampo === "number") return `<input type="number" ${attr} value="${val}">`;
      if (tipoCampo === "email")  return `<input type="email" ${attr} value="${val}">`;
      return `<input type="text" ${attr} value="${val}">`;
    }

    function confirmarTudo() {
      const blocos = document.querySelectorAll("#listaRegistros .bloco-registro");
      blocos.forEach((bloco) => {
        bloco.querySelectorAll("[data-campo]").forEach((input) => {
          if (!input.value || input.value.trim() === "") {
            const obj = (bloco.dataset.tipo === "aluno" ? db.alunos : bloco.dataset.tipo === "escola" ? db.escolas : db.servidores).find(x => x.id === bloco.dataset.registroId);
            if (obj && obj[input.dataset.campo]) input.value = obj[input.dataset.campo];
          }
        });
      });
      blocos.forEach(b => b.style.borderLeftColor = "#16a34a");
      document.getElementById("btnSalvarTodos").click();
    }

    document.getElementById("btnSalvarTodos").addEventListener("click", () => {
      db = carregarDB();
      const tarefaDb = db.tarefas.find(t => t.id === tarefaAtual.id);
      const agora = new Date().toISOString();
      const ehEvento = !!tarefaDb.eventoId;

      document.querySelectorAll("#listaRegistros .bloco-registro").forEach((bloco) => {
        const rId = bloco.dataset.registroId;
        const tipo = bloco.dataset.tipo;
        const regTarefa = tarefaDb.registros.find(r => r.id === rId);
        const obj = (tipo === "aluno" ? db.alunos : tipo === "escola" ? db.escolas : db.servidores).find(x => x.id === rId);

        bloco.querySelectorAll("[data-campo]").forEach((input) => {
          const campo = input.dataset.campo;
          if (ehCalculado(tipo, campo)) return;
          const val = input.value.trim();
          if (val !== "") {
            if (obj) { obj[campo] = val; obj.atualizadoEm = agora; obj.atualizadoPor = ESCOLA_ATUAL; }
            regTarefa[campo] = val;
            regTarefa.camposFaltando = (regTarefa.camposFaltando || []).filter(c => c !== campo);
          }
        });

        const faltandoReais = (regTarefa.camposFaltando || []).filter(c => !ehCalculado(tipo, c));
        regTarefa.camposFaltando = faltandoReais;

        if (faltandoReais.length === 0) {
          regTarefa.status = "concluida";
          if (ehEvento && obj) { obj.ultimoEvento = tarefaDb.eventoId; obj.confirmadoEm = agora; obj.atualizadoEm = agora; }
        }
      });

      const aindaPendentes = tarefaDb.registros.some(r => r.status !== "concluida");
      tarefaDb.status = aindaPendentes ? "em_andamento" : "concluida";
      tarefaDb.atualizadoEm = agora;
      salvarDB(db);

      if (ehEvento && !aindaPendentes) verificarEncerramentoEvento(tarefaDb.eventoId);
      mostrarTela("sucesso");
    });

    function verificarEncerramentoEvento(eventoId) {
      const dbAtual = carregarDB();
      const tarefas = dbAtual.tarefas.filter(t => t.eventoId === eventoId);
      if (tarefas.length === 0) return;
      if (!tarefas.every(t => (t.registros || []).every(r => r.status === "concluida"))) return;
      const ev = (dbAtual.eventos || []).find(e => e.id === eventoId);
      if (!ev) return;
      const colecao = ev.tipo === "aluno" ? dbAtual.alunos : dbAtual.servidores;
      if (colecao.every(r => r.ultimoEvento === eventoId && r.confirmadoEm)) {
        ev.ativo = false; ev.concluidoEm = new Date().toISOString(); salvarDB(dbAtual);
      }
    }

    // ==========================================
    // FLUXO DE MEUS DADOS
    // ==========================================
    document.querySelectorAll(".aba[data-dados]").forEach(tab => {
      tab.addEventListener("click", () => {
        document.querySelectorAll(".aba[data-dados]").forEach(t => t.classList.remove("ativa"));
        tab.classList.add("ativa");
        abaDadosAtiva = tab.dataset.dados;
        carregarMeusDados();
      });
    });

    function carregarMeusDados() {
      db = carregarDB();
      const div = document.getElementById("listaMeusDados");
      const btnNovo = document.getElementById("btnAddNovo");
      div.innerHTML = "";
      if (!ESCOLA_ATUAL) return;

      if (abaDadosAtiva === "escola") {
        btnNovo.style.display = "none";
        const escola = db.escolas.find(e => e.id === ESCOLA_ATUAL);
        if (!escola) return;
        const selo = calcularSelo(escola, "escola");
        
        let html = `<div class="card-tarefa" style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem;">
          <div>
            <h3>${escola.nome}</h3>
            <span style="font-size:.8rem; background:${selo.bg}; color:${selo.cor}; padding:4px 8px; border-radius:4px; font-weight:600;">Status: ${selo.texto}</span>
          </div>
          <button class="btn-secundario btn-editar" data-id="${escola.id}">Editar Dados da Escola</button>
        </div>`;
        div.innerHTML = html;

      } else {
        btnNovo.style.display = "inline-block";
        btnNovo.textContent = abaDadosAtiva === "alunos" ? "+ Novo Aluno" : "+ Novo Servidor";
        btnNovo.onclick = () => abrirEdicaoRegistro(abaDadosAtiva === "alunos" ? "aluno" : "servidor", null);

        const colecao = abaDadosAtiva === "alunos" ? db.alunos : db.servidores;
        const registros = colecao.filter(r => r.escolaId === ESCOLA_ATUAL);
        
        if (registros.length === 0) {
          div.innerHTML = `<p class="vazio">Nenhum ${abaDadosAtiva} cadastrado nesta escola. Use o botão "+ Novo" para adicionar.</p>`;
          return;
        }

        let html = `<div class="tabela-wrap"><table>
          <thead><tr><th>Nome</th><th>Status</th><th style="text-align:right;">Ações</th></tr></thead><tbody>`;
        
        registros.sort((a,b) => (a.nome||"").localeCompare(b.nome||"")).forEach(r => {
          const selo = calcularSelo(r, abaDadosAtiva === "alunos" ? "aluno" : "servidor");
          html += `<tr>
            <td><strong>${r.nome || "(Sem nome)"}</strong></td>
            <td><span style="font-size:.8rem; background:${selo.bg}; color:${selo.cor}; padding:4px 8px; border-radius:4px; font-weight:600;">${selo.texto}</span></td>
            <td style="text-align:right;">
              <button class="btn-secundario btn-editar" data-id="${r.id}" data-tipo="${abaDadosAtiva === "alunos" ? "aluno" : "servidor"}">Editar</button>
              <button class="btn-perigo btn-remover" data-id="${r.id}" data-tipo="${abaDadosAtiva === "alunos" ? "aluno" : "servidor"}">Remover</button>
            </td>
          </tr>`;
        });
        html += `</tbody></table></div>`;
        div.innerHTML = html;
      }

      div.querySelectorAll(".btn-editar").forEach(btn => {
        btn.addEventListener("click", () => {
          const tipo = btn.dataset.tipo || "escola";
          abrirEdicaoRegistro(tipo, btn.dataset.id);
        });
      });
      div.querySelectorAll(".btn-remover").forEach(btn => {
        btn.addEventListener("click", () => {
          if (!confirm(`Tem certeza que deseja remover este registro? Esta ação não pode ser desfeita.`)) return;
          const tipo = btn.dataset.tipo;
          const dbAtual = carregarDB();
          if (tipo === "aluno") dbAtual.alunos = dbAtual.alunos.filter(x => x.id !== btn.dataset.id);
          else dbAtual.servidores = dbAtual.servidores.filter(x => x.id !== btn.dataset.id);
          salvarDB(dbAtual);
          carregarMeusDados();
          alert("Registro removido com sucesso.");
        });
      });
    }

    function abrirEdicaoRegistro(tipo, id) {
      db = carregarDB();
      const ehNovo = !id;
      const colecao = tipo === "aluno" ? db.alunos : tipo === "escola" ? db.escolas : db.servidores;
      const obj = ehNovo ? {} : colecao.find(x => x.id === id);
      
      if (!ehNovo && !obj) return;

      tipoEdicaoAtual = tipo;
      registroEdicaoAtual = id;

      document.getElementById("tituloEdicao").textContent = ehNovo 
        ? `Adicionar ${ROTULO_TIPO[tipo]}` 
        : `Editar ${ROTULO_TIPO[tipo]}: ${obj.nome || ""}`;
      
      const container = document.getElementById("formEdicaoRegistro");
      container.innerHTML = "";

      const campos = db.campos.filter(c => c.tipo === tipo);
      campos.forEach(campo => {
        if (campo.calculado) return;
        
        let valor = obj[campo.id] || "";
        if (ehNovo && campo.id === "escolaId") valor = ESCOLA_ATUAL;

        const div = document.createElement("div");
        div.className = "campo";
        div.innerHTML = `<label>${campo.label}${campo.obrigatorio ? " *" : ""}</label>${renderizarInput(campo.tipoCampo, campo.id, valor, campo)}`;
        container.appendChild(div);
      });

      mostrarTela("editarRegistro");
    }

    document.getElementById("btnSalvarEdicaoRegistro").addEventListener("click", () => {
      db = carregarDB();
      const ehNovo = !registroEdicaoAtual;
      const agora = new Date().toISOString();
      
      const colecao = tipoEdicaoAtual === "aluno" ? db.alunos : tipoEdicaoAtual === "escola" ? db.escolas : db.servidores;
      let obj = ehNovo ? null : colecao.find(x => x.id === registroEdicaoAtual);

      const dadosForm = {};
      document.getElementById("formEdicaoRegistro").querySelectorAll("[data-campo]").forEach(input => {
        const campo = input.dataset.campo;
        if (ehCalculado(tipoEdicaoAtual, campo)) return;
        dadosForm[campo] = input.value.trim();
      });

      const campos = db.campos.filter(c => c.tipo === tipoEdicaoAtual);
      for (const c of campos) {
        if (c.calculado) continue;
        if (c.obrigatorio && !dadosForm[c.id]) {
          alert(`O campo "${c.label}" é obrigatório.`);
          return;
        }
      }

      if (ehNovo) {
        const idGerado = gerarIdUnico(dadosForm.nome || tipoEdicaoAtual, tipoEdicaoAtual, db);
        obj = { id: idGerado, criadoEm: agora };
        colecao.push(obj);
      }

      if (tipoEdicaoAtual !== "escola" && !dadosForm.escolaId) {
        dadosForm.escolaId = ESCOLA_ATUAL;
      }

      Object.keys(dadosForm).forEach(campo => {
        if (ehCalculado(tipoEdicaoAtual, campo)) return;
        obj[campo] = dadosForm[campo];
      });

      obj.atualizadoEm = agora;
      obj.atualizadoPor = ESCOLA_ATUAL;
      obj.confirmadoEm = agora; 

      salvarDB(db);
      
      // Sincroniza se havia alguma tarefa pendente para este registro
      sincronizarTarefasPendentes(tipoEdicaoAtual, obj.id);

      carregarMeusDados();
      alert(ehNovo ? "Registro adicionado com sucesso!" : "Dados atualizados com sucesso!");
    });

    document.getElementById("btnConfirmarTudoDados").addEventListener("click", () => {
      if (!confirm("Isso vai carimbar a data de hoje para todos os alunos e servidores desta escola, indicando que os dados estão corretos. Continuar?")) return;
      db = carregarDB();
      const agora = new Date().toISOString();
      
      const eventosAluno = (db.eventos || []).filter(e => e.tipo === "aluno" && e.ativo).sort((a,b) => new Date(b.dataInicio||0) - new Date(a.dataInicio||0));
      const evAlunoId = eventosAluno[0] ? eventosAluno[0].id : null;
      
      const eventosServ = (db.eventos || []).filter(e => e.tipo === "servidor" && e.ativo).sort((a,b) => new Date(b.dataInicio||0) - new Date(a.dataInicio||0));
      const evServId = eventosServ[0] ? eventosServ[0].id : null;

      db.alunos.forEach(a => {
        if (a.escolaId === ESCOLA_ATUAL) {
          a.confirmadoEm = agora;
          a.atualizadoEm = agora;
          if (evAlunoId) a.ultimoEvento = evAlunoId;
        }
      });
      db.servidores.forEach(s => {
        if (s.escolaId === ESCOLA_ATUAL) {
          s.confirmadoEm = agora;
          s.atualizadoEm = agora;
          if (evServId) s.ultimoEvento = evServId;
        }
      });
      const esc = db.escolas.find(e => e.id === ESCOLA_ATUAL);
      if (esc) { esc.confirmadoEm = agora; esc.atualizadoEm = agora; }

      salvarDB(db);
      
      // Sincroniza todas as tarefas pendentes da escola após o "Confirmar Tudo"
      db.alunos.forEach(a => { if (a.escolaId === ESCOLA_ATUAL) sincronizarTarefasPendentes("aluno", a.id); });
      db.servidores.forEach(s => { if (s.escolaId === ESCOLA_ATUAL) sincronizarTarefasPendentes("servidor", s.id); });
      sincronizarTarefasPendentes("escola", ESCOLA_ATUAL);

      carregarMeusDados();
      alert("Todos os dados foram confirmados e as tarefas pendentes foram atualizadas!");
    });

    document.getElementById("btnVoltarMeusDados").addEventListener("click", () => {
      mostrarTela("meusDados");
    });
    document.getElementById("btnVoltar").addEventListener("click", () => { mostrarTela("tarefas"); });
    document.getElementById("btnVoltarTarefas").addEventListener("click", () => {
      if (!telas.meusDados.classList.contains("hidden")) mostrarTela("meusDados");
      else { carregarTarefas(); mostrarTela("tarefas"); }
    });

    montarSeletorEscola();
    carregarTarefas();
  </script>
</body>
</html>
