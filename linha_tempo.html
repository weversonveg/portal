<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Linha do tempo do servidor — Semed. Consulte férias e folgas por período aquisitivo.">
<meta name="theme-color" content="#4a3068">
<title>Linha do Tempo do Servidor — Vale Transporte</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&display=block&text=home,search,error_outline,error,warning,info,table_view,check_circle,event_upcoming,event_available,schedule,cancel,hourglass_top,dark_mode,light_mode,description">

<script>
(function () {
    try {
        var t = localStorage.getItem('tema-vt') || 'light';
        document.documentElement.setAttribute('data-theme', t);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', t === 'dark' ? '#1a1a1c' : '#4a3068');
    } catch (e) {}
})();
</script>

<style>
/* ============================================================
   TOKENS — TEMA CLARO (institucional)
   Paleta: cinza + roxo institucional + cores de status discretas
   ============================================================ */
:root,
:root[data-theme="light"] {
    /* Institucional */
    --brand: #4a3068;               /* roxo escuro sóbrio (marca) */
    --brand-hover: #3a2551;
    --brand-soft: #ece7f2;          /* roxo bem claro, para realce */
    --brand-contrast: #ffffff;

    /* Cinzas — cor dominante do sistema */
    --gray-50:  #fafafa;
    --gray-100: #f4f4f5;
    --gray-150: #ececee;
    --gray-200: #e4e4e7;
    --gray-300: #d4d4d8;
    --gray-400: #a1a1aa;
    --gray-500: #71717a;
    --gray-600: #52525b;
    --gray-700: #3f3f46;
    --gray-800: #27272a;
    --gray-900: #18181b;

    /* Semânticos — discretos (só para texto/borda, não fundo berrante) */
    --ok:      #166534;
    --ok-bg:   #f0f7f2;
    --ok-bd:   #b7cfbf;

    --warn:    #854d0e;
    --warn-bg: #faf6ef;
    --warn-bd: #d9c9a3;

    --danger:  #991b1b;
    --danger-bg: #faf1f1;
    --danger-bd: #d9b5b5;

    --info:    #1e3a8a;
    --info-bg: #f0f4fa;
    --info-bd: #b7c4db;

    /* Aplicação */
    --background: var(--gray-100);
    --surface:    #ffffff;
    --surface-2:  var(--gray-50);
    --surface-3:  var(--gray-150);

    --text:           var(--gray-900);
    --text-secondary: var(--gray-600);
    --text-muted:     var(--gray-500);

    --border:         var(--gray-200);
    --border-strong:  var(--gray-300);

    --shadow-sm: 0 1px 2px rgba(24,24,27,.04);
    --shadow:    0 1px 3px rgba(24,24,27,.06), 0 1px 2px rgba(24,24,27,.03);
    --shadow-md: 0 4px 12px rgba(24,24,27,.07);
    --shadow-lg: 0 20px 50px rgba(24,24,27,.16);

    --focus-ring: 0 0 0 3px rgba(74,48,104,.16);
    --focus-border: #4a3068;

    --overlay:       rgba(24,24,27,.28);
    --overlay-modal: rgba(24,24,27,.5);
}

/* ============================================================
   TEMA ESCURO
   ============================================================ */
:root[data-theme="dark"] {
    --brand: #b8a3d1;
    --brand-hover: #cbb9df;
    --brand-soft: #2a2334;
    --brand-contrast: #1a1a1c;

    --gray-50:  #18181b;
    --gray-100: #1c1c1f;
    --gray-150: #232327;
    --gray-200: #2a2a2e;
    --gray-300: #3f3f46;
    --gray-400: #52525b;
    --gray-500: #71717a;
    --gray-600: #a1a1aa;
    --gray-700: #d4d4d8;
    --gray-800: #e4e4e7;
    --gray-900: #f4f4f5;

    --ok:      #86c79a;
    --ok-bg:   #16281d;
    --ok-bd:   #2f5c3f;

    --warn:    #e4c56c;
    --warn-bg: #2a2416;
    --warn-bd: #5c4d2a;

    --danger:  #f0a1a1;
    --danger-bg: #2a1919;
    --danger-bd: #5c3434;

    --info:    #a3b8dd;
    --info-bg: #171e2e;
    --info-bd: #33405a;

    --background: #141416;
    --surface:    #1c1c1f;
    --surface-2:  #232327;
    --surface-3:  #2a2a2e;

    --text:           var(--gray-900);
    --text-secondary: var(--gray-600);
    --text-muted:     var(--gray-500);

    --border:         var(--gray-200);
    --border-strong:  var(--gray-300);

    --shadow-sm: 0 1px 2px rgba(0,0,0,.5);
    --shadow:    0 1px 3px rgba(0,0,0,.5);
    --shadow-md: 0 4px 12px rgba(0,0,0,.5);
    --shadow-lg: 0 20px 50px rgba(0,0,0,.6);

    --focus-ring: 0 0 0 3px rgba(184,163,209,.22);
    --focus-border: #b8a3d1;

    --overlay:       rgba(0,0,0,.5);
    --overlay-modal: rgba(0,0,0,.65);
}

:root {
    --radius-sm: 3px;
    --radius:    5px;
    --radius-md: 6px;
    --radius-lg: 8px;
    --radius-full: 999px;

    --space-1: 4px;
    --space-2: 8px;
    --space-3: 12px;
    --space-4: 16px;
    --space-5: 24px;
    --space-6: 32px;

    --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}

/* ============================================================
   RESET / BASE
   ============================================================ */
*, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: var(--font);
}
html, body { width: 100%; min-height: 100%; }

body {
    min-height: 100vh;
    min-height: 100dvh;
    background: var(--background);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    transition: background-color .2s ease, color .2s ease;
}

button, input, select, textarea { font: inherit; color: inherit; }

:focus-visible {
    outline: 2px solid var(--focus-border);
    outline-offset: 2px;
    border-radius: var(--radius-sm);
}

.skip-link {
    position: absolute;
    left: var(--space-4);
    top: -100px;
    z-index: 10000;
    padding: 10px 16px;
    background: var(--brand);
    color: var(--brand-contrast);
    border-radius: var(--radius);
    text-decoration: none;
    font-weight: 600;
    font-size: 13px;
    transition: top .2s ease;
}
.skip-link:focus { top: var(--space-4); }

.hidden { display: none !important; }
.visually-hidden {
    position: absolute !important;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0);
    white-space: nowrap; border: 0;
}

/* ============================================================
   TOPBAR
   ============================================================ */
.topbar {
    width: 100%;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    box-shadow: var(--shadow-sm);
}
.topbar-content {
    max-width: 1200px;
    margin: 0 auto;
    height: 56px;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 24px;
}
.logo { width: 28px; height: 28px; object-fit: contain; flex-shrink: 0; }
.system-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -.005em;
}
.system-divider { width: 1px; height: 18px; background: var(--border-strong); margin: 0 4px; }
.system-module { font-size: 13px; color: var(--text-muted); flex-grow: 1; }

.status-conexao {
    display: flex; align-items: center; gap: 7px;
    font-size: 11.5px; font-weight: 600;
    padding: 4px 10px;
    border-radius: var(--radius-full);
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    white-space: nowrap;
    text-transform: uppercase;
    letter-spacing: .3px;
}
.status-conexao::before {
    content: "";
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: currentColor;
    flex-shrink: 0;
}
.status-conexao.online  { color: var(--ok);     background: var(--ok-bg);     border-color: var(--ok-bd); }
.status-conexao.offline { color: var(--danger); background: var(--danger-bg); border-color: var(--danger-bd); }
.status-conexao.offline::before { animation: pulsar 1.2s infinite ease-in-out; }
@keyframes pulsar { 0%,100%{opacity:.35;} 50%{opacity:1;} }

.btn-tema {
    width: 34px; height: 34px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text-secondary);
    cursor: pointer;
    flex-shrink: 0;
    transition: background-color .15s ease, color .15s ease, border-color .15s ease;
}
.btn-tema:hover {
    background: var(--surface-2);
    color: var(--text);
    border-color: var(--border-strong);
}
.btn-tema .material-symbols-outlined { font-size: 18px; }
.btn-tema .icon-dark  { display: none; }
.btn-tema .icon-light { display: inline-flex; }
:root[data-theme="dark"] .btn-tema .icon-dark  { display: inline-flex; }
:root[data-theme="dark"] .btn-tema .icon-light { display: none; }

/* ============================================================
   MAIN / PAGE HEADER
   ============================================================ */
.main { width: 100%; max-width: 1200px; margin: 0 auto; padding: 24px; }

.page-header { margin-bottom: 20px; }
.breadcrumb {
    display: flex; align-items: center; gap: 6px;
    font-size: 12px; color: var(--text-muted);
    margin-bottom: 8px;
}
.breadcrumb .material-symbols-outlined { font-size: 14px; }
.breadcrumb a { text-decoration: none; color: inherit; border-radius: var(--radius-sm); }
.breadcrumb a:hover { color: var(--brand); }
.page-header h1 {
    font-size: 20px;
    font-weight: 600;
    color: var(--text);
    letter-spacing: -.01em;
    margin-bottom: 4px;
}
.page-header p { font-size: 13px; color: var(--text-secondary); }

/* ============================================================
   CARDS
   ============================================================ */
.form-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 20px 24px;
    margin-bottom: 16px;
    transition: background-color .2s ease, border-color .2s ease;
}
.card-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 8px;
    text-transform: uppercase;
    letter-spacing: .4px;
}
.card-title .material-symbols-outlined { color: var(--text-muted); font-size: 18px; }

.form-group { display: flex; flex-direction: column; }
.form-group label {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-secondary);
    margin-bottom: 6px;
}
.form-group label span { color: var(--danger); }

.form-card.busca-compacta { padding: 16px 24px; margin-bottom: 16px; }
.busca-linha { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; }
.busca-linha .form-group { flex: 1; min-width: 220px; margin-bottom: 0; }

.search-input {
    height: 38px;
    padding: 0 12px;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    outline: none;
    font-size: 13.5px;
    color: var(--text);
    width: 100%;
    transition: border-color .15s ease, box-shadow .15s ease;
}
.search-input::placeholder { color: var(--text-muted); }
.search-input:hover { border-color: var(--gray-400); }
.search-input:focus { border-color: var(--brand); box-shadow: var(--focus-ring); }

.btn-buscar {
    height: 38px;
    padding: 0 20px;
    background: var(--brand);
    color: var(--brand-contrast);
    border: none;
    border-radius: var(--radius);
    font-weight: 500;
    font-size: 13.5px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    flex-shrink: 0;
    transition: background-color .15s ease;
}
.btn-buscar:hover { background: var(--brand-hover); }
.btn-buscar:disabled { opacity: .6; cursor: not-allowed; }
.btn-buscar .material-symbols-outlined { font-size: 16px; }

/* Cabeçalho do servidor */
.cabecalho-compacto {
    display: flex;
    align-items: center;
    gap: 24px;
    flex-wrap: wrap;
    padding: 16px 24px;
}
.cab-item { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.cab-label {
    font-size: 10.5px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: .6px;
}
.cab-item strong {
    font-size: 13.5px;
    color: var(--text);
    font-weight: 500;
    overflow-wrap: anywhere;
}
.cab-div { width: 1px; height: 28px; background: var(--border); }

/* ============================================================
   RESUMO EXECUTIVO
   ============================================================ */
.resumo-executivo { display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px; }
.resumo-matricula {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
    padding: 16px 24px;
    transition: background-color .2s ease, border-color .2s ease;
}
.resumo-matricula-header {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 14px;
    padding-bottom: 12px;
    border-bottom: 1px solid var(--border);
}
.resumo-matricula-badge {
    font-size: 11px;
    font-weight: 600;
    color: var(--brand);
    background: var(--brand-soft);
    padding: 3px 10px;
    border-radius: var(--radius-sm);
    letter-spacing: .3px;
    text-transform: uppercase;
}
.resumo-matricula-nome {
    font-size: 12.5px;
    color: var(--text-secondary);
    font-weight: 500;
}
.resumo-cards-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
}
.resumo-bloco {
    border-left: 2px solid var(--border);
    padding-left: 16px;
}
.resumo-bloco-titulo {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 10px;
    text-transform: uppercase;
    letter-spacing: .6px;
}
.resumo-chips {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px 16px;
}
.chip {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    font-size: 12.5px;
    color: var(--text-secondary);
    padding: 2px 0;
}
.chip .num {
    font-weight: 600;
    color: var(--text);
    font-variant-numeric: tabular-nums;
}
/* Cor discreta só no número, e só para status que importam */
.chip-verde    .num { color: var(--ok); }
.chip-vermelho .num { color: var(--danger); }
.chip-amarelo  .num { color: var(--warn); }

/* ============================================================
   FILTROS
   ============================================================ */
.filtros-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 16px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
}
.filtro-group { display: flex; flex-direction: column; min-width: 140px; flex: 1; max-width: 200px; }
.filtro-group label {
    font-size: 10.5px;
    font-weight: 600;
    color: var(--text-muted);
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: .5px;
}
.filtro-select {
    height: 34px;
    padding: 0 10px;
    border: 1px solid var(--border-strong);
    border-radius: var(--radius);
    font-size: 12.5px;
    background: var(--surface);
    color: var(--text);
    outline: none;
    transition: border-color .15s ease, box-shadow .15s ease;
}
.filtro-select:hover { border-color: var(--gray-400); }
.filtro-select:focus { border-color: var(--brand); box-shadow: var(--focus-ring); }

/* ============================================================
   TABELA
   ============================================================ */
.tabela-wrapper {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    border: 1px solid var(--border);
    border-radius: var(--radius-md);
}
.periodos-table { width: 100%; border-collapse: collapse; font-size: 13px; }
.periodos-table th {
    background: var(--surface-2);
    padding: 10px 12px;
    text-align: left;
    font-weight: 600;
    color: var(--text-secondary);
    border-bottom: 1px solid var(--border);
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: .5px;
    white-space: nowrap;
}
.periodos-table td {
    padding: 10px 12px;
    border-bottom: 1px solid var(--border);
    vertical-align: middle;
    color: var(--text);
}
.periodos-table tbody tr:last-child td { border-bottom: none; }
.periodos-table tbody tr:hover { background: var(--surface-2); }
.periodos-table time { font-variant-numeric: tabular-nums; }

/* Linhas por status — agora apenas um filete colorido à esquerda */
.periodos-table tbody tr {
    border-left: 3px solid transparent;
    transition: background-color .15s ease;
}
.periodos-table tbody tr.linha-gozado,
.periodos-table tbody tr.linha-disponivel { border-left-color: var(--ok); }
.periodos-table tbody tr.linha-programado  { border-left-color: var(--info); }
.periodos-table tbody tr.linha-atual       { border-left-color: var(--brand); }
.periodos-table tbody tr.linha-pendente    { border-left-color: var(--warn); }
.periodos-table tbody tr.linha-vencido,
.periodos-table tbody tr.linha-perdido     { border-left-color: var(--danger); }

/* Badges — só borda + texto colorido. Fundo neutro sempre. */
.badge-status {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 2px 8px;
    border-radius: var(--radius-sm);
    font-size: 11px;
    font-weight: 500;
    white-space: nowrap;
    background: transparent;
    border: 1px solid var(--border-strong);
    color: var(--text-secondary);
    letter-spacing: .1px;
}
.badge-status .material-symbols-outlined { font-size: 12px; }
.badge-gozado,
.badge-disponivel { color: var(--ok);     border-color: var(--ok-bd); }
.badge-pendente   { color: var(--warn);   border-color: var(--warn-bd); }
.badge-vencido,
.badge-perdido    { color: var(--danger); border-color: var(--danger-bd); }
.badge-atual      { color: var(--brand);  border-color: var(--brand-soft); }
.badge-programado { color: var(--info);   border-color: var(--info-bd); }

.tipo-badge {
    display: inline-block;
    font-size: 11px;
    font-weight: 500;
    padding: 2px 7px;
    border-radius: var(--radius-sm);
    white-space: nowrap;
    background: var(--surface-3);
    color: var(--text-secondary);
    border: 1px solid var(--border);
    letter-spacing: .1px;
}

.tabela-vazia {
    text-align: center;
    color: var(--text-muted);
    padding: 40px 16px !important;
    font-size: 13px;
}

/* ============================================================
   MENSAGEM DE ERRO
   ============================================================ */
.mensagem-erro {
    background: var(--danger-bg);
    border: 1px solid var(--danger-bd);
    color: var(--danger);
    padding: 12px 16px;
    border-radius: var(--radius);
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 16px;
    display: none;
    align-items: center;
    gap: 10px;
}
.mensagem-erro.ativo { display: flex; }
.mensagem-erro .material-symbols-outlined { font-size: 18px; }

/* ============================================================
   LOADING
   ============================================================ */
.loading-overlay {
    position: fixed;
    inset: 0;
    background: var(--overlay);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 9998;
}
.loading-overlay.ativo { display: flex; }
.loading-box {
    background: var(--surface);
    padding: 18px 24px;
    border-radius: var(--radius-md);
    box-shadow: var(--shadow-lg);
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    border: 1px solid var(--border);
}
.spinner {
    width: 18px; height: 18px;
    border: 2px solid var(--border-strong);
    border-top-color: var(--brand);
    border-radius: 50%;
    animation: spin .7s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ============================================================
   MODAL
   ============================================================ */
.modal-alerta-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: var(--overlay-modal);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    padding: 20px;
}
.modal-alerta-overlay.ativo { display: flex; animation: fadeIn .18s ease; }
@keyframes fadeIn { from{opacity:0;} to{opacity:1;} }
@keyframes slideDown { from{transform:translateY(-8px);opacity:0;} to{transform:translateY(0);opacity:1;} }

.modal-alerta {
    background: var(--surface);
    border-radius: var(--radius-md);
    max-width: 420px;
    width: 100%;
    overflow: hidden;
    box-shadow: var(--shadow-lg);
    animation: slideDown .2s ease;
    border: 1px solid var(--border);
}
.modal-alerta-header { padding: 24px 24px 16px; text-align: center; }
.modal-alerta-icon {
    width: 48px; height: 48px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 16px;
    background: var(--surface-2);
    border: 1px solid var(--border);

}
.modal-alerta-icon.info  { color: var(--info);   border-color: var(--info-bd); }

}
.modal-alerta-mensagem {

}
.modal-alerta-footer {

.modal-alerta-btn {
