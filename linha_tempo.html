<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linha do Tempo do Servidor - SEMED v1.4.3</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen text-gray-800">

    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-6">
        <!-- Cabeçalho Responsivo -->
        <div class="bg-white shadow-sm rounded-xl p-5 sm:p-6 mb-6 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border border-gray-100">
            <div>
                <h1 class="text-xl sm:text-2xl font-bold text-gray-900">Linha do Tempo do Servidor</h1>
                <p class="text-xs sm:text-sm text-gray-500">Controle de Férias e Folga Aniversário (Versão 1.4.3)</p>
            </div>
            <a href="index.html" class="text-sm text-blue-600 hover:text-blue-800 font-medium transition flex items-center gap-1">← Voltar ao Painel</a>
        </div>

        <!-- Formulário de Busca -->
        <div class="bg-white shadow-sm rounded-xl p-5 sm:p-6 mb-6 border border-gray-100">
            <label for="termoBusca" class="block text-sm font-semibold text-gray-700 mb-2">Digite o CPF ou a Matrícula do Servidor</label>
            <div class="flex flex-col sm:flex-row gap-3">
                <input type="text" id="termoBusca" maxlength="20" placeholder="Ex: 000.000.000-00 ou Matrícula" class="flex-1 border border-gray-300 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500">
                <button onclick="buscarServidor()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2.5 rounded-lg text-sm font-medium transition shadow-sm">Buscar</button>
            </div>
        </div>

        <!-- Container de Resultados -->
        <div id="resultadoContainer" class="hidden space-y-6">
            
            <!-- Card de Dados do Servidor -->
            <div class="bg-white shadow-sm rounded-xl p-5 sm:p-6 border border-gray-100">
                <h2 class="text-base sm:text-lg font-bold text-gray-800 mb-4 border-b pb-2">Dados Cadastrais</h2>
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-4 text-sm">
                    <div><span class="text-gray-500 block text-xs uppercase tracking-wider">Nome:</span> <strong id="nomeServidor" class="text-gray-900 text-base">-</strong></div>
                    <div><span class="text-gray-500 block text-xs uppercase tracking-wider">Matrícula(s):</span> <strong id="matriculaServidor" class="text-gray-900 text-base">-</strong></div>
                    <div><span class="text-gray-500 block text-xs uppercase tracking-wider">Data(s) de Admissão:</span> <strong id="admissaoServidor" class="text-gray-900 text-base">-</strong></div>
                    <div><span class="text-gray-500 block text-xs uppercase tracking-wider">Data de Nascimento:</span> <strong id="nascimentoServidor" class="text-gray-900 text-base">-</strong></div>
                </div>
            </div>

            <!-- Alerta de Limite de Férias -->
            <div id="alertaLimite" class="p-4 rounded-xl border text-sm font-medium"></div>

            <!-- Resumo Rápido -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 sm:gap-6">
                <div class="bg-white shadow-sm rounded-xl p-5 sm:p-6 border-l-4 border-blue-500 border border-gray-100">
                    <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Situação de Férias</h3>
                    <div class="mt-2 flex justify-between items-baseline">
                        <span class="text-3xl font-extrabold text-gray-900" id="feriasPendentesCount">0</span>
                        <span class="text-sm text-gray-600">Períodos a gozar</span>
                    </div>
                </div>
                <div class="bg-white shadow-sm rounded-xl p-5 sm:p-6 border-l-4 border-green-500 border border-gray-100">
                    <h3 class="text-xs font-semibold text-gray-500 uppercase tracking-wider">Folga Aniversário (Ano Atual)</h3>
                    <div class="mt-2 flex justify-between items-baseline">
                        <span class="text-lg sm:text-xl font-bold text-gray-900" id="statusFolgaAniversario">-</span>
                    </div>
                </div>
            </div>

            <!-- Linha do Tempo Visual -->
            <div class="bg-white shadow-sm rounded-xl p-5 sm:p-6 border border-gray-100">
                <h2 class="text-base sm:text-lg font-bold text-gray-800 mb-6 border-b pb-2">Histórico Cronológico</h2>
                <div id="timelineHistorico" class="space-y-6 border-l-2 border-blue-200 pl-4 ml-2">
                    <!-- Preenchido via JavaScript -->
                </div>
            </div>

        </div>
    </div>

    <!-- Script Modular do Firebase v10 -->
    <script type="module">
        import { db } from "./firebase.js";
        import { collection, getDocs, query, where, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        document.getElementById('termoBusca').addEventListener('input', function(e) {
            let value = e.target.value;
            if (/^[0-9.\-]*$/.test(value) && value.replace(/\D/g, '').length <= 11) {
                let nums = value.replace(/\D/g, '');
                if (nums.length > 11) nums = nums.slice(0, 11);
                if (nums.length > 9) {
                    value = nums.replace(/^(\d{3})(\d{3})(\d{3})(\d{2}).*/, '$1.$2.$3-$4');
                } else if (nums.length > 6) {
                    value = nums.replace(/^(\d{3})(\d{3})(\d{1,3}).*/, '$1.$2.$3');
                } else if (nums.length > 3) {
                    value = nums.replace(/^(\d{3})(\d{1,3}).*/, '$1.$2');
                } else {
                    value = nums;
                }
                e.target.value = value;
            }
        });

        function formatarData(dataStr) {
            if (!dataStr) return '';
            if (typeof dataStr.toDate === 'function') {
                dataStr = dataStr.toDate().toISOString().split('T')[0];
            }
            dataStr = dataStr.toString().trim();
            if (dataStr.includes('-') && dataStr.length >= 10) {
                const partes = dataStr.substring(0, 10).split('-');
                if (partes.length === 3) {
                    return `${partes[2]}/${partes[1]}/${partes[0]}`;
                }
            }
            return dataStr;
        }

        function parseDataParaDate(dataStr) {
            if (!dataStr) return null;
            if (typeof dataStr.toDate === 'function') {
                return dataStr.toDate();
            }
            dataStr = dataStr.toString().trim();
            if (dataStr.includes('/')) {
                const partes = dataStr.split('/');
                if (partes.length === 3) {
                    return new Date(parseInt(partes[2]), parseInt(partes[1]) - 1, parseInt(partes[0]));
                }
            } else if (dataStr.includes('-')) {
                const partes = dataStr.substring(0, 10).split('-');
                if (partes.length === 3) {
                    if (partes[0].length === 4) {
                        return new Date(parseInt(partes[0]), parseInt(partes[1]) - 1, parseInt(partes[2]));
                    } else {
                        return new Date(parseInt(partes[2]), parseInt(partes[1]) - 1, parseInt(partes[0]));
                    }
                }
            }
            return null;
        }

        function formatarAnoReferencia(anoRef, tipoReg = '') {
            if (!anoRef) return 'N/A';
            let str = anoRef.toString().trim();
            const isFerias = tipoReg.toLowerCase().includes('ferias') || tipoReg.toLowerCase().includes('férias');
            if (isFerias && /^\d{4}$/.test(str)) {
                let anoNum = parseInt(str);
                return `${anoNum}/${anoNum + 1}`;
            }
            return str;
        }

        function obterDataFolgaAniversario(dataNascStr, ano) {
            if (!dataNascStr) return null;
            if (typeof dataNascStr.toDate === 'function') {
                dataNascStr = dataNascStr.toDate().toISOString().split('T')[0];
            }
            dataNascStr = dataNascStr.toString().trim();
            
            let dia = 0, mes = 0;
            if (dataNascStr.includes('/')) {
                const partes = dataNascStr.split('/');
                dia = parseInt(partes[0]);
                mes = parseInt(partes[1]);
            } else if (dataNascStr.includes('-')) {
                const partes = dataNascStr.split('-');
                if (partes[0].length === 4) {
                    mes = parseInt(partes[1]);
                    dia = parseInt(partes[2]);
                } else {
                    dia = parseInt(partes[0]);
                    mes = parseInt(partes[1]);
                }
            }
            
            if (!dia || !mes) return null;
            
            let dataFolga = new Date(ano, mes - 1, dia + 1);
            dataFolga.setHours(0, 0, 0, 0);
            return dataFolga;
        }

        window.buscarServidor = async function() {
            let termoInput = document.getElementById('termoBusca').value.trim();
            if (!termoInput) {
                alert('Por favor, digite um CPF ou Matrícula.');
                return;
            }

            const termoLimpo = termoInput.replace(/\D/g, '');

            try {
                const colRef = collection(db, 'servidores');
                let mapIds = new Map();

                let docSnap = await getDoc(doc(db, 'servidores', termoInput));
                if (docSnap.exists()) mapIds.set(docSnap.id, docSnap);

                if (termoLimpo) {
                    let docSnapLimpo = await getDoc(doc(db, 'servidores', termoLimpo));
                    if (docSnapLimpo.exists()) mapIds.set(docSnapLimpo.id, docSnapLimpo);
                }

                const queries = [
                    getDocs(query(colRef, where('cpf', '==', termoInput))),
                    getDocs(query(colRef, where('cpf', '==', termoLimpo))),
                    getDocs(query(colRef, where('CPF', '==', termoInput))),
                    getDocs(query(colRef, where('CPF', '==', termoLimpo))),
                    getDocs(query(colRef, where('matricula', '==', termoInput))),
                    getDocs(query(colRef, where('Matricula', '==', termoInput))),
                    getDocs(query(colRef, where('matricula', '==', termoLimpo ? Number(termoLimpo) : null))),
                    getDocs(query(colRef, where('matricula_servidor', '==', termoInput)))
                ];

                const resultados = await Promise.all(queries.map(q => q.catch(() => ({ empty: true }))));
                resultados.forEach(snap => {
                    if (!snap.empty) {
                        snap.forEach(d => mapIds.set(d.id, d));
                    }
                });

                if (mapIds.size === 0) {
                    const todosSnap = await getDocs(colRef);
                    todosSnap.forEach(d => {
                        const data = d.data();
                        const c = (data.cpf || data.CPF || '').toString().replace(/\D/g, '');
                        const m1 = (data.matricula || data.Matricula || data.matricula_servidor || data.n_matricula || (data.matricula1 && data.matricula1.numeroMatricula) || '').toString().toLowerCase();
                        const m2 = (data.matricula2 && data.matricula2.numeroMatricula || '').toString().toLowerCase();
                        if (c === termoLimpo || c === termoInput || m1 === termoInput.toLowerCase() || m2 === termoInput.toLowerCase() || d.id === termoInput) {
                            mapIds.set(d.id, d);
                        }
                    });
                }

                const servidoresEncontrados = Array.from(mapIds.values());

                if (servidoresEncontrados.length === 0) {
                    alert('Nenhum servidor encontrado com este CPF ou Matrícula.');
                    document.getElementById('resultadoContainer').classList.add('hidden');
                    return;
                }

                await processarServidoresUnificados(servidoresEncontrados, termoLimpo || termoInput);

            } catch (error) {
                console.error("Erro detalhado do Firebase:", error);
                alert('Erro ao consultar o banco de dados. Verifique o console.');
            }
        };

        function adicionarVinculo(map, mat, adm) {
            if (!mat) return;
            const matStr = mat.toString();
            let anoAdm = new Date().getFullYear();
            if (adm) {
                const admStr = adm.toString();
                if (admStr.includes('/')) {
                    anoAdm = parseInt(admStr.split('/')[2] || admStr.split('/')[0]);
                } else if (admStr.includes('-')) {
                    anoAdm = parseInt(admStr.split('-')[0] || admStr.split('-')[2]);
                }
            }
            map.set(matStr, {
                matricula: matStr,
                dataAdmissao: adm || '',
                anoAdmissao: isNaN(anoAdm) ? new Date().getFullYear() : anoAdm
            });
        }

        async function processarServidoresUnificados(servidoresDocs, termoBusca) {
            const primeiroData = servidoresDocs[0].data();
            const nomeServidor = primeiroData.nome || primeiroData.Nome || 'Não informado';
            const nascimentoServidor = primeiroData.data_nascimento || primeiroData.dataNascimento;
            
            const vinculosMap = new Map();
            let cpfsSet = new Set();
            const servidorIds = [];

            servidoresDocs.forEach(d => {
                servidorIds.push(d.id);
                const data = d.data();
                
                const mat1 = data.matricula || data.Matricula || data.matricula_servidor || data.n_matricula || data.codigo || (data.matricula1 && data.matricula1.numeroMatricula);
                const adm1 = data.data_admissao || data.dataAdmissao || data.data_admissão || (data.matricula1 && data.matricula1.dataAdmissao);
                if (mat1) {
                    adicionarVinculo(vinculosMap, mat1, adm1);
                }

                const mat2 = data.matricula2 && data.matricula2.numeroMatricula;
                const adm2 = data.matricula2 && data.matricula2.dataAdmissao;
                if (mat2) {
                    adicionarVinculo(vinculosMap, mat2, adm2);
                }
                
                const cpfDoc = (data.cpf || data.CPF || '').toString().replace(/\D/g, '');
                if (cpfDoc) cpfsSet.add(cpfDoc);
            });

            const vinculos = Array.from(vinculosMap.values());
            if (vinculos.length === 0) {
                vinculos.push({
                    matricula: 'Não informada',
                    dataAdmissao: '',
                    anoAdmissao: new Date().getFullYear()
                });
            }

            const cpfEfetivo = cpfsSet.size > 0 ? Array.from(cpfsSet)[0] : termoBusca;

            const snapshotHistorico = await getDocs(collection(db, 'registro_ferias_folgas'));
            const registros = [];

            snapshotHistorico.forEach(docSnap => {
                const regData = docSnap.data();
                const regCpf = (regData.cpf || regData.CPF || regData.servidor_cpf || '').toString().replace(/\D/g, '');
                const regMat = (regData.matricula || regData.Matricula || regData.servidor_matricula || '').toString();
                const regServId = regData.servidorId || regData.servidor_id || '';

                const matchCpf = cpfEfetivo && regCpf === cpfEfetivo;
                const matchId = servidorIds.includes(regServId);
                const matchMat = vinculos.some(v => v.matricula === regMat);

                if (matchCpf || matchId || matchMat) {
                    registros.push(regData);
                    if (regMat && !vinculosMap.has(regMat)) {
                        adicionarVinculo(vinculosMap, regMat, '');
                    }
                }
            });

            const listaMatriculasFinal = Array.from(vinculosMap.keys());
            const matriculaExibicao = listaMatriculasFinal.length > 0 ? listaMatriculasFinal.join(' / ') : 'Não informada';
            const admissaoExibicao = Array.from(vinculosMap.values()).map(v => `Mat ${v.matricula}: ${formatarData(v.dataAdmissao) || 'Não informada'}`).join(' | ');

            document.getElementById('nomeServidor').innerText = nomeServidor;
            document.getElementById('matriculaServidor').innerText = matriculaExibicao;
            document.getElementById('admissaoServidor').innerText = admissaoExibicao;
            document.getElementById('nascimentoServidor').innerText = formatarData(nascimentoServidor) || 'Não informado';

            processarLinhaDoTempo(Array.from(vinculosMap.values()), nascimentoServidor, registros);

            document.getElementById('resultadoContainer').classList.remove('hidden');
        }

        function processarLinhaDoTempo(vinculos, dataNascimento, registros) {
            const timelineEl = document.getElementById('timelineHistorico');
            timelineEl.innerHTML = '';

            const anoAtual = new Date().getFullYear();
            const hoje = new Date();
            hoje.setHours(0, 0, 0, 0);

            const feriasTiradas = registros.filter(r => {
                const t = (r.tipo || r.tipo_registro || r.categoria || '').toString().toLowerCase();
                return t.includes('ferias') || t.includes('férias');
            });

            const folgasAniversario = registros.filter(r => {
                const t = (r.tipo || r.tipo_registro || r.categoria || '').toString().toLowerCase();
                return t.includes('aniversario') || t.includes('aniversário') || t.includes('folga');
            });

            let totalPendentes = 0;

            vinculos.forEach(v => {
                let totalPeriodosDireitoVinc = 0;
                const dtAdmissaoObj = parseDataParaDate(v.dataAdmissao);

                if (dtAdmissaoObj) {
                    let i = 1;
                    while (true) {
                        let dataFimAno = new Date(dtAdmissaoObj);
                        dataFimAno.setFullYear(dataFimAno.getFullYear() + i);
                        if (dataFimAno <= hoje) {
                            totalPeriodosDireitoVinc++;
                            i++;
                        } else {
                            break;
                        }
                    }
                } else {
                    if (v.anoAdmissao && v.anoAdmissao < anoAtual) {
                        totalPeriodosDireitoVinc = anoAtual - v.anoAdmissao;
                    } else {
                        totalPeriodosDireitoVinc = 0;
                    }
                }

                const feriasVinc = feriasTiradas.filter(r => {
                    const regMat = (r.matricula || r.Matricula || r.servidor_matricula || '').toString();
                    if (regMat === v.matricula) return true;
                    if (!regMat && vinculos.length === 1) return true;
                    return false;
                });

                const feriasGozadasVinc = feriasVinc.filter(r => {
                    const dtTerminoObj = parseDataParaDate(r.data_termino || r.dataTermino || r.termino || r.fim || r.data_fim || r.dataFim);
                    const dtInicioObj = parseDataParaDate(r.data_inicio || r.dataInicio || r.inicio || r.data);
                    const dataComp = dtTerminoObj || dtInicioObj;
                    if (!dataComp) return true;
                    dataComp.setHours(0, 0, 0, 0);
                    return dataComp <= hoje;
                });

                const gozadasVinc = feriasGozadasVinc.length;
                const pendentesVinc = Math.max(0, totalPeriodosDireitoVinc - gozadasVinc);
                totalPendentes += pendentesVinc;
            });

            document.getElementById('feriasPendentesCount').innerText = totalPendentes;

            const alertaEl = document.getElementById('alertaLimite');
            alertaEl.className = 'p-4 rounded-xl border text-sm font-medium';

            if (totalPendentes >= 3) {
                alertaEl.classList.add('bg-red-50', 'border-red-200', 'text-red-700');
                alertaEl.innerHTML = `<strong>⚠️ ALERTA CRÍTICO:</strong> O servidor atingiu ou ultrapassou o limite de 3 períodos de férias acumulados. Ação imediata necessária conforme a legislação.`;
            } else if (totalPendentes === 2) {
                alertaEl.classList.add('bg-yellow-50', 'border-yellow-200', 'text-yellow-700');
                alertaEl.innerHTML = `<strong>⚠️ ATENÇÃO:</strong> O servidor possui 2 períodos acumulados, correndo risco de atingir o limite legal.`;
            } else {
                alertaEl.classList.add('bg-green-50', 'border-green-200', 'text-green-700');
                alertaEl.innerHTML = `<strong>✓ Regular:</strong> O saldo de férias está dentro dos conformes legais.`;
            }

            const folgaAnoAtualRealizada = folgasAniversario.find(f => {
                const anoRef = f.ano_referencia || f.ano || f.anoReferencia;
                const dataUsoRaw = f.data || f.data_gozo || f.data_inicio || f.dataInicio;
                const dtObj = parseDataParaDate(dataUsoRaw);
                
                let matchAno = anoRef == anoAtual || (dataUsoRaw && dataUsoRaw.toString().includes(anoAtual));
                if (!matchAno && dtObj) {
                    matchAno = dtObj.getFullYear() === anoAtual;
                }
                if (!matchAno) return false;

                if (dtObj) {
                    const d = new Date(dtObj);
                    d.setHours(0, 0, 0, 0);
                    return d <= hoje;
                }
                return true;
            });

            const folgaAnoAtualProgramada = folgasAniversario.find(f => {
                const anoRef = f.ano_referencia || f.ano || f.anoReferencia;
                const dataUsoRaw = f.data || f.data_gozo || f.data_inicio || f.dataInicio;
                const dtObj = parseDataParaDate(dataUsoRaw);
                
                let matchAno = anoRef == anoAtual || (dataUsoRaw && dataUsoRaw.toString().includes(anoAtual));
                if (!matchAno && dtObj) {
                    matchAno = dtObj.getFullYear() === anoAtual;
                }
                if (!matchAno) return false;

                if (dtObj) {
                    const d = new Date(dtObj);
                    d.setHours(0, 0, 0, 0);
                    return d > hoje;
                }
                return false;
            });

            const statusFolgaEl = document.getElementById('statusFolgaAniversario');
            const dataFolgaAniv = obterDataFolgaAniversario(dataNascimento, anoAtual);

            if (folgaAnoAtualRealizada) {
                const dataUsoRaw = folgaAnoAtualRealizada.data || folgaAnoAtualRealizada.data_gozo || folgaAnoAtualRealizada.data_inicio || folgaAnoAtualRealizada.dataInicio || 'Registrada';
                const dataUsoFormatada = formatarData(dataUsoRaw);
                statusFolgaEl.innerHTML = `<span class="text-green-600 font-semibold">Usufruída em ${dataUsoFormatada}</span>`;
            } else if (folgaAnoAtualProgramada) {
                const dataUsoRaw = folgaAnoAtualProgramada.data || folgaAnoAtualProgramada.data_gozo || folgaAnoAtualProgramada.data_inicio || folgaAnoAtualProgramada.dataInicio;
                const dataUsoFormatada = formatarData(dataUsoRaw);
                statusFolgaEl.innerHTML = `<span class="text-amber-600 font-semibold">Programada para ${dataUsoFormatada}</span>`;
            } else if (dataFolgaAniv && hoje < dataFolgaAniv) {
                const dataFormatada = dataFolgaAniv.toLocaleDateString('pt-BR');
                statusFolgaEl.innerHTML = `<span class="text-amber-600 font-semibold">Disponível a partir de ${dataFormatada}</span>`;
            } else {
                statusFolgaEl.innerHTML = `<span class="text-blue-600 font-semibold">Disponível para gozo</span>`;
            }

            registros.forEach(reg => {
                const tipoReg = (reg.tipo || reg.tipo_registro || 'Registro').toString();
                const isFerias = tipoReg.toLowerCase().includes('ferias') || tipoReg.toLowerCase().includes('férias');

                const dtInicio = formatarData(reg.data_inicio || reg.dataInicio || reg.inicio || reg.data);
                const dtTermino = formatarData(reg.data_termino || reg.dataTermino || reg.termino || reg.fim || reg.data_fim || reg.dataFim);
                const matRegistro = reg.matricula || reg.Matricula || reg.servidor_matricula;

                let textoDetalhe = '';
                if (isFerias) {
                    const dtTerminoObj = parseDataParaDate(reg.data_termino || reg.dataTermino || reg.termino || reg.fim || reg.data_fim || reg.dataFim);
                    const dtInicioObj = parseDataParaDate(reg.data_inicio || reg.dataInicio || reg.inicio || reg.data);
                    const dataComp = dtTerminoObj || dtInicioObj;
                    let jaPassou = true;
                    if (dataComp) {
                        const d = new Date(dataComp);
                        d.setHours(0, 0, 0, 0);
                        jaPassou = d <= hoje;
                    }

                    if (dtInicio && dtTermino) {
                        if (jaPassou) {
                            textoDetalhe = `Período gozado de ${dtInicio} até ${dtTermino}`;
                        } else {
                            textoDetalhe = `Férias programadas (A gozar) de ${dtInicio} até ${dtTermino}`;
                        }
                    } else if (dtInicio) {
                        if (jaPassou) {
                            textoDetalhe = `Período gozado em ${dtInicio}`;
                        } else {
                            textoDetalhe = `Férias programadas (A gozar) para ${dtInicio}`;
                        }
                    } else {
                        textoDetalhe = reg.descricao || (jaPassou ? 'Férias gozadas' : 'Férias programadas');
                    }
                } else {
                    const dtGozoRaw = reg.data_gozo || reg.dataGozo || reg.data || reg.data_inicio || reg.dataInicio;
                    const dtGozo = formatarData(dtGozoRaw);
                    const dtObj = parseDataParaDate(dtGozoRaw);
                    let jaPassou = true;
                    if (dtObj) {
                        const d = new Date(dtObj);
                        d.setHours(0, 0, 0, 0);
                        jaPassou = d <= hoje;
                    }

                    if (dtGozo) {
                        if (jaPassou) {
                            textoDetalhe = `Usufruída em ${dtGozo}`;
                        } else {
                            textoDetalhe = `Folga programada para ${dtGozo}`;
                        }
                    } else {
                        textoDetalhe = reg.descricao || 'Folga aniversário registrada';
                    }
                }

                if (matRegistro) {
                    textoDetalhe += ` <span class="text-xs font-semibold text-gray-500">(Matrícula: ${matRegistro})</span>`;
                }

                const anoRefBruto = reg.ano_referencia || reg.ano || reg.anoReferencia || 'N/A';
                const anoRefFormatado = formatarAnoReferencia(anoRefBruto, tipoReg);

                const itemDiv = document.createElement('div');
                itemDiv.className = "relative pl-6";
                itemDiv.innerHTML = `
                    <div class="absolute -left-[9px] top-1.5 w-4 h-4 rounded-full ${isFerias ? 'bg-blue-600' : 'bg-green-600'} border-2 border-white shadow-sm"></div>
                    <span class="text-xs text-gray-400 font-semibold uppercase tracking-wider">${tipoReg}</span>
                    <p class="text-sm font-medium text-gray-800 mt-0.5">${textoDetalhe}</p>
                    <span class="text-xs text-gray-500">Ano Referência: ${anoRefFormatado}</span>
                `;
                timelineEl.appendChild(itemDiv);
            });

            if (registros.length === 0) {
                timelineEl.innerHTML = `<p class="text-sm text-gray-500 italic">Nenhum registro de férias ou folga encontrado para este servidor.</p>`;
            }
        }
    </script>
</body>
</html>
