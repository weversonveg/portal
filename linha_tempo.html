<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linha do Tempo do Servidor - SEMED v1.4</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase App SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <!-- Firebase Firestore SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-100 font-sans min-h-screen">

    <div class="max-w-5xl mx-auto p-6">
        <!-- Cabeçalho -->
        <div class="bg-white shadow rounded-lg p-6 mb-6 flex justify-between items-center">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">Linha do Tempo do Servidor</h1>
                <p class="text-sm text-gray-500">Controle de Férias e Folga Aniversário (Versão 1.4)</p>
            </div>
            <a href="index.html" class="text-sm text-blue-600 hover:underline font-medium">← Voltar ao Painel</a>
        </div>

        <!-- Formulário de Busca -->
        <div class="bg-white shadow rounded-lg p-6 mb-6">
            <label for="cpfBusca" class="block text-sm font-medium text-gray-700 mb-2">Digite o CPF do Servidor</label>
            <div class="flex gap-4">
                <input type="text" id="cpfBusca" placeholder="Ex: 000.000.000-00 ou apenas números" class="flex-1 border border-gray-300 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button onclick="buscarServidor()" class="bg-blue-600 text-white px-6 py-2 rounded-lg font-medium hover:bg-blue-700 transition">Buscar</button>
            </div>
        </div>

        <!-- Container de Resultados -->
        <div id="resultadoContainer" class="hidden space-y-6">
            
            <!-- Card de Dados do Servidor -->
            <div class="bg-white shadow rounded-lg p-6">
                <h2 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2">Dados Cadastrais</h2>
                <div class="grid grid-cols-1 md:grid-cols-3 gap-4 text-sm">
                    <div><span class="text-gray-500 block">Nome:</span> <strong id="nomeServidor" class="text-gray-800 text-base">-</strong></div>
                    <div><span class="text-gray-500 block">Data de Admissão:</span> <strong id="admissaoServidor" class="text-gray-800 text-base">-</strong></div>
                    <div><span class="text-gray-500 block">Data de Nascimento:</span> <strong id="nascimentoServidor" class="text-gray-800 text-base">-</strong></div>
                </div>
            </div>

            <!-- Alerta de Limite de Férias -->
            <div id="alertaLimite" class="hidden p-4 rounded-lg border text-sm font-medium"></div>

            <!-- Resumo Rápido -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div class="bg-white shadow rounded-lg p-6 border-l-4 border-blue-500">
                    <h3 class="text-sm font-semibold text-gray-500 uppercase tracking-wider">Situação de Férias</h3>
                    <div class="mt-2 flex justify-between items-baseline">
                        <span class="text-3xl font-extrabold text-gray-900" id="feriasPendentesCount">0</span>
                        <span class="text-sm text-gray-600">Períodos a gozar</span>
                    </div>
                </div>
                <div class="bg-white shadow rounded-lg p-6 border-l-4 border-green-500">
                    <h3 class="text-sm font-semibold text-gray-500 uppercase tracking-wider">Folga Aniversário (Ano Atual)</h3>
                    <div class="mt-2 flex justify-between items-baseline">
                        <span class="text-xl font-bold text-gray-900" id="statusFolgaAniversario">-</span>
                    </div>
                </div>
            </div>

            <!-- Linha do Tempo Visual -->
            <div class="bg-white shadow rounded-lg p-6">
                <h2 class="text-lg font-bold text-gray-800 mb-6 border-b pb-2">Histórico Cronológico</h2>
                <div id="timelineHistorico" class="space-y-6 border-l-2 border-blue-200 pl-4 ml-2">
                    <!-- Preenchido via JavaScript -->
                </div>
            </div>

        </div>
    </div>

    <!-- Script de Inicialização e Lógica -->
    <script>
        // Configuração do Firebase da SEMED (Substitua pelas credenciais reais do seu projeto)
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "SEU_AUTH_DOMAIN",
            projectId: "SEU_PROJECT_ID",
            storageBucket: "SEU_STORAGE_BUCKET",
            messagingSenderId: "SEU_MESSAGING_SENDER_ID",
            appId: "SEU_APP_ID"
        };

        // Inicializa o Firebase de forma segura
        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.firestore();

        async function buscarServidor() {
            let cpfInput = document.getElementById('cpfBusca').value.trim();
            if (!cpfInput) {
                alert('Por favor, digite um CPF.');
                return;
            }

            const cpfLimpo = cpfInput.replace(/\D/g, '');

            try {
                // Busca na coleção 'servidores' (tratando variações de máscara e maiúsculas)
                let servidorSnapshot = await db.collection('servidores').where('cpf', '==', cpfLimpo).get();
                
                if (servidorSnapshot.empty) {
                    servidorSnapshot = await db.collection('servidores').where('cpf', '==', cpfInput).get();
                }
                if (servidorSnapshot.empty) {
                    servidorSnapshot = await db.collection('servidores').where('CPF', '==', cpfLimpo).get();
                }

                if (servidorSnapshot.empty) {
                    alert('Servidor não encontrado na coleção "servidores". Verifique o CPF digitado.');
                    document.getElementById('resultadoContainer').classList.add('hidden');
                    return;
                }

                const servidorDoc = servidorSnapshot.docs[0];
                const servidor = servidorDoc.data();
                const cpfBuscaEfetivo = servidor.cpf || servidor.CPF || cpfLimpo;

                // Preenche dados cadastrais
                document.getElementById('nomeServidor').innerText = servidor.nome || servidor.Nome || 'Não informado';
                document.getElementById('admissaoServidor').innerText = servidor.data_admissao || servidor.dataAdmissao || 'Não informado';
                document.getElementById('nascimentoServidor').innerText = servidor.data_nascimento || servidor.dataNascimento || 'Não informado';

                // Busca na coleção 'registro_ferias_folgas'
                let historicoSnapshot = await db.collection('registro_ferias_folgas').where('cpf', '==', cpfBuscaEfetivo).get();
                
                if (historicoSnapshot.empty) {
                    historicoSnapshot = await db.collection('registro_ferias_folgas').where('CPF', '==', cpfBuscaEfetivo).get();
                }

                const registros = [];
                historicoSnapshot.forEach(doc => {
                    registros.push(doc.data());
                });

                processarLinhaDoTempo(servidor, registros);
                document.getElementById('resultadoContainer').classList.remove('hidden');

            } catch (error) {
                console.error("Erro ao buscar dados:", error);
                alert('Erro ao consultar o banco de dados. Verifique o console para detalhes técnicos.');
            }
        }

        function processarLinhaDoTempo(servidor, registros) {
            const timelineEl = document.getElementById('timelineHistorico');
            timelineEl.innerHTML = '';

            const dataAdmissaoStr = servidor.data_admissao || servidor.dataAdmissao;
            if (!dataAdmissaoStr) return;

            const partesAdmissao = dataAdmissaoStr.split('/');
            const anoAdmissao = parseInt(partesAdmissao[2] || partesAdmissao[0]);
            const anoAtual = new Date().getFullYear();

            let totalPeriodosDireito = 0;
            for (let ano = anoAdmissao; ano <= anoAtual; ano++) {
                totalPeriodosDireito++;
            }

            const feriasTiradas = registros.filter(r => r.tipo === 'ferias');
            const folgasAniversario = registros.filter(r => r.tipo === 'folga_aniversario');

            const periodosGozadosCount = feriasTiradas.length;
            const periodosPendentes = Math.max(0, totalPeriodosDireito - periodosGozadosCount);

            document.getElementById('feriasPendentesCount').innerText = periodosPendentes;

            // Alerta de Limite (Regra dos 3 períodos)
            const alertaEl = document.getElementById('alertaLimite');
            alertaEl.className = 'p-4 rounded-lg border text-sm font-medium';

            if (periodosPendentes >= 3) {
                alertaEl.classList.add('bg-red-50', 'border-red-200', 'text-red-700');
                alertaEl.innerHTML = `<strong>⚠️ ALERTA CRÍTICO:</strong> O servidor atingiu ou ultrapassou o limite de 3 períodos de férias acumulados. Ação imediata necessária conforme a legislação.`;
            } else if (periodosPendentes === 2) {
                alertaEl.classList.add('bg-yellow-50', 'border-yellow-200', 'text-yellow-700');
                alertaEl.innerHTML = `<strong>⚠️ ATENÇÃO:</strong> O servidor possui 2 períodos acumulados, correndo risco de atingir o limite legal.`;
            } else {
                alertaEl.classList.add('bg-green-50', 'border-green-200', 'text-green-700');
                alertaEl.innerHTML = `<strong>✓ Regular:</strong> O saldo de férias está dentro dos conformes legais.`;
            }

            // Status da Folga Aniversário do Ano Atual
            const folgaAnoAtual = folgasAniversario.find(f => f.ano_referencia == anoAtual || (f.data && f.data.includes(anoAtual)));
            const statusFolgaEl = document.getElementById('statusFolgaAniversario');
            if (folgaAnoAtual) {
                statusFolgaEl.innerHTML = `<span class="text-green-600 font-semibold">Usufruída em ${folgaAnoAtual.data || folgaAnoAtual.data_gozo || 'Data não especificada'}</span>`;
            } else {
                statusFolgaEl.innerHTML = `<span class="text-blue-600 font-semibold">Disponível para gozo</span>`;
            }

            // Montagem do Histórico Cronológico
            registros.forEach(reg => {
                const itemDiv = document.createElement('div');
                itemDiv.className = "relative pl-6";
                itemDiv.innerHTML = `
                    <div class="absolute -left-[9px] top-1.5 w-4 h-4 rounded-full bg-blue-600 border-2 border-white"></div>
                    <span class="text-xs text-gray-400 font-semibold uppercase">${reg.tipo === 'ferias' ? 'Férias' : 'Folga Aniversário'}</span>
                    <p class="text-sm font-medium text-gray-800">${reg.descricao || (reg.tipo === 'ferias' ? `Período de ${reg.data_inicio} até ${reg.data_termino}` : `Utilizada em ${reg.data || reg.data_gozo}`)}</p>
                    <span class="text-xs text-gray-500">Ano Referência: ${reg.ano_referencia || 'N/A'}</span>
                `;
                timelineEl.appendChild(itemDiv);
            });

            if (registros.length === 0) {
                timelineEl.innerHTML = `<p class="text-sm text-gray-500">Nenhum registro de férias ou folga encontrado para este CPF na coleção registro_ferias_folgas.</p>`;
            }
        }
    </script>
</body>
</html>
