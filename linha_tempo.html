<script type="module">
import { db, auth } from "./firebase.js";
import { collection, getDocs, query, where, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

let usuarioLogado = null;
let acessoAutorizado = false;
let linhasUnificadas = [];
let nomeServidorAtual = '';
let ultimoTermoBuscado = '';
let servidorAtualRef = null;

const DIAS_PADRAO = 30;

function obterDiasPorPeriodo(servidor, vinculo) {
    if (vinculo && vinculo.diasFerias) return Number(vinculo.diasFerias);
    if (servidor && servidor.diasFerias) return Number(servidor.diasFerias);
    return DIAS_PADRAO;
}

function calcularDiasRegistro(reg) {
    // Tenta todos os nomes possíveis de campos
    const ini = parseDataParaDate(reg.dataInicio || reg.data_inicio || reg.data || reg.inicio);
    const fim = parseDataParaDate(reg.dataFim || reg.data_fim || reg.dataTermino || reg.data_termino || reg.termino || reg.fim);
    
    if (!ini) {
        console.warn('[DEBUG] Registro sem data de início:', reg);
        return 0;
    }
    
    const dataFim = fim || ini; // Se não tem data fim, usa data início (folga de 1 dia)
    const d = Math.round((dataFim - ini) / 86400000) + 1;
    
    // 👇 DEBUG: mostra o que foi calculado
    console.log('[DEBUG] calcularDiasRegistro:', {
        dataInicio: reg.dataInicio || reg.data_inicio,
        dataFim: reg.dataFim || reg.data_fim,
        diasCalculados: d > 0 ? d : 0
    });
    
    return d > 0 ? d : 0;
}

function atualizarStatusConexao() {
    const statusDiv = document.getElementById("statusConexao");
    const statusTexto = document.getElementById("statusTexto");
    if (!statusDiv) return;
    if (!navigator.onLine) { statusDiv.className = "status-conexao offline"; statusTexto.textContent = "Sem Conexão"; }
    else { statusDiv.className = "status-conexao online"; statusTexto.textContent = "Online"; }
}
window.addEventListener('online', atualizarStatusConexao);
window.addEventListener('offline', atualizarStatusConexao);
atualizarStatusConexao();

function mostrarLoading(texto = 'Carregando...') {
    document.getElementById('loadingTexto').textContent = texto;
    document.getElementById('loadingOverlay').classList.add('ativo');
    const btn = document.getElementById('btnBuscar');
    const input = document.getElementById('termoBusca');
    if (btn) btn.disabled = true;
    if (input) input.disabled = true;
}
function ocultarLoading() {
    document.getElementById('loadingOverlay').classList.remove('ativo');
    const btn = document.getElementById('btnBuscar');
    const input = document.getElementById('termoBusca');
    if (btn) btn.disabled = false;
    if (input) input.disabled = false;
}

function mostrarAlerta(mensagem, tipo = 'info', titulo = 'Aviso') {
    const modal = document.getElementById('modalAlerta');
    const icon = document.getElementById('modalAlertaIcon');
    const icones = { info:'info', erro:'error', aviso:'warning' };
    icon.innerHTML = `<span class="material-symbols-outlined">${icones[tipo]||'info'}</span>`;
    document.getElementById('modalAlertaTitulo').textContent = titulo;
    document.getElementById('modalAlertaMensagem').textContent = mensagem;
    modal.classList.add('ativo');
    requestAnimationFrame(() => document.getElementById('btnFecharModalAlerta').focus());
}
function fecharModalAlerta() {
    document.getElementById('modalAlerta').classList.remove('ativo');
}
document.getElementById('btnFecharModalAlerta').addEventListener('click', fecharModalAlerta);
document.getElementById('modalAlerta').addEventListener('click', function(e){ if(e.target===this) fecharModalAlerta(); });
document.addEventListener('keydown', e => { if(e.key==='Escape') fecharModalAlerta(); });

onAuthStateChanged(auth, async function(user) {
    const formBusca = document.getElementById('formBuscaCard');
    const resultadoContainer = document.getElementById('resultadoContainer');
    if (!user) {
        mostrarErro("Sua sessão expirou. Faça login novamente.");
        formBusca.style.display='none'; resultadoContainer.classList.add('hidden');
        acessoAutorizado=false; return;
    }
    usuarioLogado = user;
    try {
        const snap = await getDoc(doc(db,"usuarios",user.uid));
        if (snap.exists()) {
            const perfil = (snap.data().perfil||"").toUpperCase();
            if (["ADMIN","ADMINISTRADOR","SEMED","RH","GESTOR","MASTER","DIRETOR"].includes(perfil)) {
                acessoAutorizado=true; formBusca.style.display='block'; ocultarErro();
            } else {
                acessoAutorizado=false;
                mostrarErro(`Acesso restrito: perfil "${snap.data().perfil}" não permitido.`);
                formBusca.style.display='none'; resultadoContainer.classList.add('hidden');
            }
        } else {
            acessoAutorizado=false; mostrarErro("Usuário não encontrado no sistema.");
            formBusca.style.display='none'; resultadoContainer.classList.add('hidden');
        }
    } catch(e){ acessoAutorizado=false; mostrarErro("Erro ao verificar permissões."); formBusca.style.display='none'; }
});

document.getElementById('termoBusca').addEventListener('input', function(e){
    let v=e.target.value.replace(/\D/g,''); if(v.length>11)v=v.slice(0,11);
    if(v.length>9)v=v.replace(/^(\d{3})(\d{3})(\d{3})(\d{2})$/,'$1.$2.$3-$4');
    else if(v.length>6)v=v.replace(/^(\d{3})(\d{3})(\d{1,3})$/,'$1.$2.$3');
    else if(v.length>3)v=v.replace(/^(\d{3})(\d{1,3})$/,'$1.$2');
    e.target.value=v;
});
document.getElementById('termoBusca').addEventListener('keypress', e=>{ if(e.key==='Enter'){e.preventDefault();buscarServidor();} });
document.getElementById('btnBuscar').addEventListener('click', buscarServidor);

function formatarData(s){
    if(!s)return '';
    if(typeof s==='object'&&s.toDate)s=s.toDate().toISOString().split('T')[0];
    s=s.toString().trim();
    if(s.includes('-')&&s.length>=10){const p=s.substring(0,10).split('-');return `${p[2]}/${p[1]}/${p[0]}`;}
    return s;
}
function parseDataParaDate(s){
    if(!s)return null;
    if(typeof s==='object'&&s.toDate)return s.toDate();
    s=s.toString().trim();
    if(s.includes('/')){const p=s.split('/');return new Date(+p[2],+p[1]-1,+p[0]);}
    if(s.includes('-')){const p=s.substring(0,10).split('-');return p[0].length===4?new Date(+p[0],+p[1]-1,+p[2]):new Date(+p[2],+p[1]-1,+p[0]);}
    return null;
}
function verificarSeJaGozado(reg, hoje){
    const dt=parseDataParaDate(reg.dataInicio||reg.data_inicio||reg.data||reg.data_gozo);
    if(!dt)return false;
    return dt<=hoje;
}

function verificarExtemporaneo(status, gozoStr, dataLimite) {
    if (status !== 'gozado' || !gozoStr || !dataLimite) return false;
    if (/\d+\/\d+\s*dias/i.test(gozoStr)) return false;
    const dg = parseDataParaDate(gozoStr);
    return dg ? dg > dataLimite : false;
}

function identificarPeriodoFolgaAniversario(dataGozo, dataNascimento, dataAdmissao){
    const dtGozo=parseDataParaDate(dataGozo), dtNasc=parseDataParaDate(dataNascimento), dtAdm=parseDataParaDate(dataAdmissao);
    if(!dtGozo||!dtNasc||!dtAdm)return null;
    const mes=dtNasc.getMonth(), dia=dtNasc.getDate();
    let ini=new Date(dtAdm);
    for(let i=0;i<40;i++){
        const fim=new Date(ini); fim.setFullYear(fim.getFullYear()+1); fim.setDate(fim.getDate()-1);
        let aniv=null;
        for(let a=ini.getFullYear();a<=fim.getFullYear();a++){
            const c=new Date(a,mes,dia);
            if(c>=ini&&c<=fim){aniv=c;break;}
        }
        const limite=aniv||fim;
        if(dtGozo<=limite&&dtGozo>=ini)return `${ini.getFullYear()}/${fim.getFullYear()}`;
        if(dtGozo>limite&&dtGozo<=fim){
            const pi=new Date(fim); pi.setDate(pi.getDate()+1);
            const pf=new Date(pi); pf.setFullYear(pf.getFullYear()+1); pf.setDate(pf.getDate()-1);
            return `${pi.getFullYear()}/${pf.getFullYear()}`;
        }
        ini=new Date(fim); ini.setDate(ini.getDate()+1);
    }
    return null;
}

function calcularDireitoFerias(dataAdmissao, ref=new Date(), diasDireito = DIAS_PADRAO){
    const adm=parseDataParaDate(dataAdmissao); if(!adm)return null;
    ref.setHours(0,0,0,0);
    const totalDireito = diasDireito || DIAS_PADRAO;
    let completos=0, det=[], ini=new Date(adm);
    while(completos<40){
        const fim=new Date(ini);
        fim.setFullYear(fim.getFullYear()+1);
        fim.setDate(fim.getDate()-1);

        const prazoGozo = new Date(fim);
        prazoGozo.setFullYear(prazoGozo.getFullYear() + 1);

        const p={numero:completos+1,inicio:new Date(ini),fim:new Date(fim),
            anoReferencia:`${ini.getFullYear()}/${fim.getFullYear()}`,
            dataLimiteGozo:prazoGozo,status:'pendente',
            totalDireito: totalDireito};
        if(fim<=ref){completos++;det.push(p);ini=new Date(fim);ini.setDate(ini.getDate()+1);}
        else{p.status='atual';det.push(p);break;}
    }
    return {periodosCompletos:completos,diasDireito:completos*totalDireito,periodosDetalhados:det};
}

function calcularDireitoFolgaAniversario(dataNascimento, dataAdmissao, ref=new Date()){
    const nasc=parseDataParaDate(dataNascimento), adm=parseDataParaDate(dataAdmissao);
    if(!nasc||!adm)return null;
    ref.setHours(0,0,0,0);
    const mes=nasc.getMonth(), dia=nasc.getDate();
    let adquiridas=0, disponiveis=0, perdidas=0, proxima=null, det=[], ini=new Date(adm);
    for(let i=0;i<40;i++){
        const fim=new Date(ini); fim.setFullYear(fim.getFullYear()+1); fim.setDate(fim.getDate()-1);
        let aniv=null;
        for(let a=ini.getFullYear();a<=fim.getFullYear();a++){
            const c=new Date(a,mes,dia);
            if(c>=ini&&c<=fim){aniv=c;break;}
        }
        const limite=aniv?new Date(aniv):new Date(fim);

        const prazoGozo = new Date(limite);
        prazoGozo.setFullYear(prazoGozo.getFullYear() + 1);

        const p={numero:i+1,inicio:new Date(ini),fim:new Date(fim),
            anoReferencia:`${ini.getFullYear()}/${fim.getFullYear()}`,
            aniversarioNoPeriodo:aniv,dataLimiteGozo:prazoGozo,status:'pendente'};
        if(fim<=ref){
            adquiridas++;
            if(prazoGozo<ref){p.status='perdido';perdidas++;}
            else{p.status='disponivel';disponiveis++;}
            det.push(p); ini=new Date(fim); ini.setDate(ini.getDate()+1);
        } else {
            p.status='disponivel'; disponiveis++; det.push(p); break;
        }
    }
    const anoBase=ref.getFullYear();
    for(let a=anoBase;a<=anoBase+2;a++){
        const c=new Date(a,mes,dia);
        if(c>ref){proxima=c;break;}
    }
    return {folgasAdquiridas:adquiridas,folgasDisponiveis:disponiveis,folgasPerdidas:perdidas,proximaAquisicao:proxima,periodosDetalhados:det};
}

function filtrarRegistrosPorMatricula(registros, vinculo){
    const m=vinculo.matricula.toString().trim().replace(/^0+/,'');
    return registros.filter(r=>{
        const rm=(r.matricula||r.Matricula||r.servidor_matricula||'').toString().trim().replace(/^0+/,'');
        return !rm||rm===m||rm===vinculo.matricula.toString().trim();
    });
}

function construirLinhasUnificadas(vinculos, dataNascimento, registros, hoje){
    const linhas=[];

    // 👇 DEBUG: mostra todos os registros carregados
    console.log('[DEBUG] Total de registros carregados:', registros.length);
    console.log('[DEBUG] Exemplo de registro:', registros[0]);

    vinculos.forEach(vinculo=>{
        if(!vinculo.dataAdmissao)return;
        const regsMat=filtrarRegistrosPorMatricula(registros,vinculo);
        
        // 👇 DEBUG: mostra registros filtrados por matrícula
        console.log(`[DEBUG] Matrícula ${vinculo.matricula}: ${regsMat.length} registros`);

        const diasDireito = obterDiasPorPeriodo(servidorAtualRef, vinculo);
        const dirF=calcularDireitoFerias(vinculo.dataAdmissao,hoje, diasDireito);
        if(dirF){
            const feriasLanc=regsMat.filter(r=>{const t=(r.tipo||'').toLowerCase();return t.includes('ferias')||t.includes('férias');});
            
            // 👇 DEBUG: mostra lançamentos de férias
            console.log(`[DEBUG] Lançamentos de férias para matrícula ${vinculo.matricula}:`, feriasLanc.length);
            
            dirF.periodosDetalhados.forEach(p=>{
                // 👇 CORREÇÃO: busca lançamentos por ano_referencia OU por sobreposição de datas
                const lancs = feriasLanc.filter(r => {
                    const anoRef = (r.ano_referencia || r.ano || '');
                    if (anoRef === p.anoReferencia) return true;
                    
                    // Fallback: se não tem ano_referencia, tenta por sobreposição de datas
                    if (!anoRef) {
                        const regIni = parseDataParaDate(r.dataInicio || r.data_inicio || r.data);
                        const regFim = parseDataParaDate(r.dataFim || r.data_fim || regIni);
                        if (regIni && regFim) {
                            // Verifica se há sobreposição com o período
                            return !(regFim < p.inicio || regIni > p.fim);
                        }
                    }
                    return false;
                });
                
                // 👇 DEBUG: mostra lançamentos encontrados para este período
                if (lancs.length > 0) {
                    console.log(`[DEBUG] Período ${p.anoReferencia}: ${lancs.length} lançamento(s) encontrado(s)`);
                    lancs.forEach((l, i) => {
                        const dias = calcularDiasRegistro(l);
                        console.log(`  - Lançamento ${i+1}:`, {
                            ano_referencia: l.ano_referencia,
                            dataInicio: l.dataInicio || l.data_inicio,
                            dataFim: l.dataFim || l.data_fim,
                            dias: dias
                        });
                    });
                }
                
                const diasConsumidos = lancs.reduce((acc, r) => acc + calcularDiasRegistro(r), 0);
                const totalDireito = p.totalDireito || diasDireito;

                let status, gozo;

                if (diasConsumidos >= totalDireito) {
                    const primeiro = lancs[0];
                    gozo = formatarData(primeiro.dataInicio || primeiro.data_inicio || primeiro.data);
                    status = verificarSeJaGozado(primeiro, hoje) ? 'gozado' : 'programado';
                } else if (diasConsumidos > 0) {
                    const primeiro = lancs[0];
                    gozo = `${diasConsumidos}/${totalDireito} dias`;
                    status = verificarSeJaGozado(primeiro, hoje) ? 'parcial' : 'programado';
                    
                    // 👇 DEBUG: mostra quando status parcial é aplicado
                    console.log(`[DEBUG] Status PARCIAL aplicado:`, {
                        periodo: p.anoReferencia,
                        diasConsumidos,
                        totalDireito,
                        gozo
                    });
                } else {
                    gozo = '';
                    if(p.status==='atual') status='atual';
                    else if(p.dataLimiteGozo<hoje) status='vencido';
                    else status='pendente';
                }

                linhas.push({servidor:nomeServidorAtual,matricula:vinculo.matricula,tipo:'Férias',tipoKey:'ferias',
                    periodo:p.anoReferencia,
                    ciclo:`${formatarData(p.inicio.toISOString().split('T')[0])} a ${formatarData(p.fim.toISOString().split('T')[0])}`,
                    prazo:formatarData(p.dataLimiteGozo.toISOString().split('T')[0]),
                    status,gozo:gozo||'—',ordem:p.inicio.getTime(),
                    extemporaneo: verificarExtemporaneo(status, gozo, p.dataLimiteGozo)});
            });
        }

        const dirG=dataNascimento?calcularDireitoFolgaAniversario(dataNascimento,vinculo.dataAdmissao,hoje):null;
        if(dirG){
            const folgasLanc=regsMat.filter(r=>{const t=(r.tipo||'').toLowerCase();return t.includes('aniversario')||t.includes('aniversário')||t.includes('folga');});
            dirG.periodosDetalhados.forEach(p=>{
                const lanc=folgasLanc.find(r=>{
                    const raw=r.data||r.data_gozo||r.dataInicio||r.data_inicio;
                    const per=identificarPeriodoFolgaAniversario(raw,dataNascimento,vinculo.dataAdmissao);
                    return (per||r.ano_referencia||r.ano||'')===p.anoReferencia;
                });
                let status=p.status, gozo='';
                if(lanc){
                    const raw=lanc.data||lanc.data_gozo||lanc.dataInicio||lanc.data_inicio;
                    gozo=formatarData(raw);
                    status=verificarSeJaGozado(lanc,hoje)?'gozado':'programado';
                }
                linhas.push({servidor:nomeServidorAtual,matricula:vinculo.matricula,tipo:'Folga Aniv.',tipoKey:'folga',
                    periodo:p.anoReferencia,
                    ciclo:`${formatarData(p.inicio.toISOString().split('T')[0])} a ${formatarData(p.fim.toISOString().split('T')[0])}`,
                    prazo:formatarData(p.dataLimiteGozo.toISOString().split('T')[0]),
                    status,gozo:gozo||'—',ordem:p.inicio.getTime(),
                    extemporaneo: verificarExtemporaneo(status, gozo, p.dataLimiteGozo)});
            });
        }
    });

    linhas.sort((a,b)=>b.ordem-a.ordem);
    return linhas;
}

function badgeStatus(s){
    const m={
        gozado:['badge-gozado','check_circle','Gozado'],
        parcial:['badge-parcial','hourglass_bottom','Parcial'],
        programado:['badge-programado','event_upcoming','Programado'],
        disponivel:['badge-disponivel','event_available','Disponível'],
        pendente:['badge-pendente','schedule','Pendente'],
        vencido:['badge-vencido','error','Vencido'],
        perdido:['badge-perdido','cancel','Perdido'],
        atual:['badge-atual','hourglass_top','Em andamento']
    };
    const x=m[s]; if(!x)return '-';
    return `<span class="badge-status ${x[0]}"><span class="material-symbols-outlined">${x[1]}</span> ${x[2]}</span>`;
}
function badgeTipo(k){
    return k==='ferias'?'<span class="tipo-badge">Férias</span>':'<span class="tipo-badge">Folga Aniv.</span>';
}

function popularFiltroMatricula(){
    const sel=document.getElementById('filtroMatricula');
    const mats=[...new Set(linhasUnificadas.map(l=>l.matricula))];
    sel.innerHTML='<option value="">Todas</option>'+mats.map(m=>`<option value="${m}">${m}</option>`).join('');
}

function aplicarFiltros(){
    const fm=document.getElementById('filtroMatricula').value;
    const ft=document.getElementById('filtroTipo').value;
    const fs=document.getElementById('filtroStatus').value;
    let linhas=linhasUnificadas;
    if(fm)linhas=linhas.filter(l=>l.matricula===fm);
    if(ft)linhas=linhas.filter(l=>l.tipoKey===ft);
    if(fs)linhas=linhas.filter(l=>l.status===fs);
    renderizarTabelaUnica(linhas);
}

document.getElementById('filtroMatricula').addEventListener('change', aplicarFiltros);
document.getElementById('filtroTipo').addEventListener('change', aplicarFiltros);
document.getElementById('filtroStatus').addEventListener('change', aplicarFiltros);

function renderizarTabelaUnica(linhas){
    const tbody=document.getElementById('tabelaUnica');
    if(linhas.length===0){
        tbody.innerHTML='<tr><td colspan="8" style="text-align:center;color:var(--text-muted);padding:22px;">Nenhum período encontrado com os filtros selecionados.</td></tr>';
        return;
    }
    tbody.innerHTML=linhas.map(l=>`
        <tr>
            <td><strong>${l.servidor}</strong></td>
            <td>${l.matricula}</td>
            <td>${badgeTipo(l.tipoKey)}</td>
            <td>${l.periodo}</td>
            <td>${l.ciclo}</td>
            <td>${l.prazo}</td>
            <td>${badgeStatus(l.status)}${l.extemporaneo ? ' <span class="badge-status badge-extemporaneo"><span class="material-symbols-outlined">warning</span> Fora do prazo</span>' : ''}</td>
            <td>${l.gozo}</td>
        </tr>
    `).join('');
}

async function buscarServidor(){
    if(!acessoAutorizado){mostrarErro("Acesso negado.");return;}
    const termo=document.getElementById('termoBusca').value.trim();
    if(!termo){mostrarAlerta('Por favor, digite um CPF ou Matrícula.','aviso','Campo obrigatório');return;}

    if(termo === ultimoTermoBuscado && !document.getElementById('resultadoContainer').classList.contains('hidden')){
        return;
    }

    mostrarLoading('Buscando servidor...');

    const termoLimpo=termo.replace(/\D/g,'');
    const colRef=collection(db,'servidores');
    const encontrados=new Map();
    try{
        const s1=await getDoc(doc(db,'servidores',termo)); if(s1.exists())encontrados.set(s1.id,s1);
        const s2=await getDoc(doc(db,'servidores',termoLimpo)); if(s2.exists())encontrados.set(s2.id,s2);
        const qs=[where('cpf','==',termo),where('cpf','==',termoLimpo),where('CPF','==',termo),where('CPF','==',termoLimpo),
                  where('matricula','==',termo),where('matricula','==',termoLimpo),where('matricula_servidor','==',termo)];
        for(const q of qs){try{const sn=await getDocs(query(colRef,q));sn.forEach(d=>encontrados.set(d.id,d));}catch(e){}}
        if(encontrados.size===0&&/^\d+$/.test(termoLimpo)){
            const all=await getDocs(colRef);
            all.forEach(d=>{
                const dt=d.data();
                const m1=(dt.matricula1&&dt.matricula1.numeroMatricula)?String(dt.matricula1.numeroMatricula).replace(/^0+/,''):'';
                const m2=(dt.matricula2&&dt.matricula2.numeroMatricula)?String(dt.matricula2.numeroMatricula).replace(/^0+/,''):'';
                const bus=termoLimpo.replace(/^0+/,'');
                if(m1===bus||m2===bus)encontrados.set(d.id,d);
            });
        }
        if(encontrados.size===0){
            ocultarLoading();
            mostrarAlerta('CPF não localizado no sistema.','erro','Servidor não encontrado');
            document.getElementById('resultadoContainer').classList.add('hidden');
            return;
        }
        await processarServidores(Array.from(encontrados.values()));
        ultimoTermoBuscado = termo;
    }catch(e){
        console.error(e);
        mostrarErro("Erro ao consultar o banco.");
    }finally{
        ocultarLoading();
    }
}

async function processarServidores(docs){
    const d0=docs[0].data();
    const nome=d0.nome||d0.Nome||'Não informado';
    nomeServidorAtual = nome;
    servidorAtualRef = d0;
    const cpfLimpo=(d0.cpf||d0.CPF||'').toString().replace(/\D/g,'');
    const cpfFmt=(d0.cpf||d0.CPF||'').toString();
    const nascimento=d0.data_nascimento||d0.dataNascimento;

    const vinculosMap=new Map();
    const servidorIds=docs.map(d=>d.id);
    docs.forEach(d=>{
        const dt=d.data();
        const add=(mat,adm,diasFerias)=>{
            if(!mat)return;
            const ms=mat.toString().trim();
            if(vinculosMap.has(ms))return;
            vinculosMap.set(ms,{
                matricula:ms,
                dataAdmissao:adm||'',
                diasFerias: diasFerias ? Number(diasFerias) : null
            });
        };
        add(
            dt.matricula||dt.Matricula||dt.matricula_servidor||(dt.matricula1&&dt.matricula1.numeroMatricula),
            dt.data_admissao||dt.dataAdmissao||(dt.matricula1&&dt.matricula1.dataAdmissao),
            dt.diasFerias
        );
        if (dt.matricula1 && dt.matricula1.numeroMatricula) {
            const ms = dt.matricula1.numeroMatricula.toString().trim();
            if (vinculosMap.has(ms)) {
                vinculosMap.get(ms).diasFerias = dt.matricula1.diasFerias ? Number(dt.matricula1.diasFerias) : vinculosMap.get(ms).diasFerias;
            }
        }
        if (dt.matricula2 && dt.matricula2.numeroMatricula) {
            const ms = dt.matricula2.numeroMatricula.toString().trim();
            if (!vinculosMap.has(ms)) {
                vinculosMap.set(ms, {
                    matricula: ms,
                    dataAdmissao: (dt.matricula2.dataAdmissao || dt.matricula2.data_admissao || ''),
                    diasFerias: dt.matricula2.diasFerias ? Number(dt.matricula2.diasFerias) : null
                });
            }
        }
    });
    const vinculos=Array.from(vinculosMap.values());
    if(vinculos.length===0)vinculos.push({matricula:'Não informada',dataAdmissao:'',diasFerias:null});

    let registros=[];const ids=new Set();
    try{
        if(cpfLimpo){const sn=await getDocs(query(collection(db,'registro_ferias_folgas'),where('cpf','==',cpfLimpo)));
            sn.forEach(x=>{if(!ids.has(x.id)){registros.push({id:x.id,...x.data()});ids.add(x.id);}});}
        if(cpfFmt&&cpfFmt!==cpfLimpo){const sn=await getDocs(query(collection(db,'registro_ferias_folgas'),where('cpf','==',cpfFmt)));
            sn.forEach(x=>{if(!ids.has(x.id)){registros.push({id:x.id,...x.data()});ids.add(x.id);}});}
        for(const sid of servidorIds){try{const sn=await getDocs(query(collection(db,'registro_ferias_folgas'),where('servidorId','==',sid)));
            sn.forEach(x=>{if(!ids.has(x.id)){registros.push({id:x.id,...x.data()});ids.add(x.id);}});}catch(e){}}
        if(registros.length===0){
            const all=await getDocs(collection(db,'registro_ferias_folgas'));
            all.forEach(x=>{
                const dt=x.data();
                const rc=(dt.cpf||dt.CPF||'').toString().replace(/\D/g,'');
                const rm=(dt.matricula||'').toString().trim().replace(/^0+/,'');
                if(rc===cpfLimpo){if(!ids.has(x.id)){registros.push({id:x.id,...dt});ids.add(x.id);}return;}
                for(const v of vinculos){
                    const cm=v.matricula.toString().trim().replace(/^0+/,'');
                    if(rm&&(rm===cm||rm===v.matricula.toString().trim())){if(!ids.has(x.id)){registros.push({id:x.id,...dt});ids.add(x.id);}return;}
                }
            });
        }
    }catch(e){console.error(e);}

    document.getElementById('nomeServidor').textContent=nome;
    document.getElementById('cpfServidor').textContent=cpfLimpo?cpfLimpo.replace(/(\d{3})(\d{3})(\d{3})(\d{2})/,'$1.$2.$3-$4'):'—';
    document.getElementById('nascimentoServidor').textContent=formatarData(nascimento)||'—';
    document.getElementById('matriculasServidor').textContent=vinculos.map(v=>{
        const dias = v.diasFerias ? ` • ${v.diasFerias}d/per` : ' • 30d/per';
        return `${v.matricula} (Adm ${formatarData(v.dataAdmissao)||'—'}${dias})`;
    }).join('  ·  ');

    const hoje=new Date();hoje.setHours(0,0,0,0);
    linhasUnificadas=construirLinhasUnificadas(vinculos,nascimento,registros,hoje);

    renderizarResumoExecutivo();
    popularFiltroMatricula();
    document.getElementById('filtroTipo').value='';
    document.getElementById('filtroStatus').value='';
    renderizarTabelaUnica(linhasUnificadas);

    document.getElementById('resultadoContainer').classList.remove('hidden');
}

function mostrarErro(t){
    const el=document.getElementById('mensagemErro');
    document.getElementById('textoErro').textContent=t;
    el.classList.add('ativo');
    document.getElementById('resultadoContainer').classList.add('hidden');
}
function ocultarErro(){document.getElementById('mensagemErro').classList.remove('ativo');}

window.buscarServidor = buscarServidor;
</script>
