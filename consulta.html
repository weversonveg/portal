<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet"
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

<link rel="stylesheet"
href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">

<title>Consultar Servidor - Vale Transporte</title>

<style>

:root {
    --primary: #5b2a86;
    --primary-hover: #47206b;

    --green: #2e7d32;
    --green-hover: #1b5e20;
    --green-light: #eaf6ec;
    --green-border: #72b879;

    --red: #c62828;
    --red-hover: #a51f1f;

    --text: #263238;
    --text-secondary: #68737d;

    --border: #d9dee3;
    --background: #f4f6f8;
    --white: #ffffff;

    --shadow: 0 2px 8px rgba(0,0,0,0.06);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    background: var(--background);
    color: var(--text);
}

/* BARRA SUPERIOR */
.topbar {
    width: calc(100% - 64px);
    max-width: 1116px;
    height: 68px;
    margin: 16px auto 0;
    background: var(--white);
    border: 1px solid #e0e4e7;
    border-radius: 8px;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    padding: 0 24px;
}

.topbar-content {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 14px;
}

.logo {
    width: 38px;
    height: 38px;
    object-fit: contain;
    flex-shrink: 0;
}

.system-name {
    font-size: 17px;
    font-weight: 700;
    color: #3d2450;
}

.system-divider {
    width: 1px;
    height: 24px;
    background: #dfe3e6;
    margin: 0 2px;
}

.system-module {
    font-size: 14px;
    color: var(--text-secondary);
    flex-grow: 1;
}

/* INDICADOR DE SINAL DE REDE */
.status-conexao {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 20px;
    background: #f1f3f5;
    border: 1px solid #e2e8f0;
}

.signal-bars {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 12px;
}

.signal-bars .bar {
    width: 3px;
    background-color: #2e7d32;
    border-radius: 1px;
}
.signal-bars .bar-1 { height: 3px; }
.signal-bars .bar-2 { height: 6px; }
.signal-bars .bar-3 { height: 9px; }
.signal-bars .bar-4 { height: 12px; }

.status-conexao.online {
    color: #2e7d32;
    background: #edf7ee;
    border-color: #c8e6c9;
}

/* ÁREA PRINCIPAL */
.main {
    width: calc(100% - 64px);
    max-width: 1116px;
    margin: 0 auto;
    padding: 32px 0;
}

.page-header {
    margin-bottom: 24px;
}

.breadcrumb {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 13px;
    color: #7b858e;
    margin-bottom: 10px;
}

.breadcrumb .material-symbols-outlined {
    font-size: 17px;
}

.page-header h1 {
    font-size: 24px;
    font-weight: 700;
    color: #263238;
    margin-bottom: 6px;
}

.page-header p {
    font-size: 14px;
    color: var(--text-secondary);
}

/* CARD DE BUSCA */
.search-card {
    background: var(--white);
    border: 1px solid #e0e4e7;
    border-radius: 8px;
    box-shadow: var(--shadow);
    padding: 24px;
    margin-bottom: 24px;
    display: flex;
    gap: 16px;
    align-items: flex-end;
}

.search-group {
    flex-grow: 1;
    display: flex;
    flex-direction: column;
}

.search-group label {
    font-size: 13px;
    font-weight: 600;
    color: #455a64;
    margin-bottom: 7px;
}

.search-group input {
    height: 44px;
    padding: 0 13px;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 6px;
    outline: none;
    font-size: 14px;
    color: #263238;
}

.search-group input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(91,42,134,.10);
}

.btn-pesquisar {
    height: 44px;
    background: var(--primary);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 0 24px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: background 0.15s;
}

.btn-pesquisar:hover {
    background: var(--primary-hover);
}

/* RESULTADO DA PESQUISA */
.result-card {
    background: var(--white);
    border: 1px solid #e0e4e7;
    border-radius: 8px;
    box-shadow: var(--shadow);
    padding: 24px;
    display: none;
}

.result-card.ativo {
    display: block;
}

.servidor-info-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid #e5e8eb;
}

.info-item label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
    text-transform: uppercase;
}

.info-item p {
    font-size: 14px;
    font-weight: 600;
    color: #263238;
    margin-top: 4px;
}

.matricula-box {
    background: #fafbfc;
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px;
    margin-top: 14px;
}

.matricula-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--primary);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
}

.mensagem {
    display: none;
    padding: 12px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
    margin-bottom: 16px;
}

.mensagem.erro {
    display: block;
    background: #fff0f0;
    border: 1px solid #efc5c5;
    color: #c62828;
}

@media (max-width: 700px) {
    .search-card {
        flex-direction: column;
        align-items: stretch;
    }
    .servidor-info-grid {
        grid-template-columns: 1fr;
    }
}

</style>
</head>

<body>

<header class="topbar">
    <div class="topbar-content">
        <img class="logo" src="https://drive.google.com/thumbnail?id=1Epk870R1TRNRFx4ionkXV-HDkgRyrATQ" alt="Logo">
        <span class="system-name">Vale Transporte</span>
        <div class="system-divider"></div>
        <span class="system-module">Semed - Consulta de Servidores</span>
        <div class="status-conexao online">
            <div class="signal-bars">
                <span class="bar bar-1"></span>
                <span class="bar bar-2"></span>
                <span class="bar bar-3"></span>
                <span class="bar bar-4"></span>
            </div>
            <span>Online</span>
        </div>
    </div>
</header>

<main class="main">
    <div class="page-header">
        <div class="breadcrumb">
            <span class="material-symbols-outlined">home</span>
            <span>Servidores</span>
            <span>/</span>
            <span>Consulta</span>
        </div>
        <h1>Consulta de Beneficiário</h1>
        <p>Pesquise pelo CPF do servidor para visualizar vínculos, escolas e linhas de transporte.</p>
    </div>

    <!-- CARD DE PESQUISA (CUSTA APENAS 1 LEITURA POR BUSCA) -->
    <section class="search-card">
        <div class="search-group">
            <label for="filtroCpf">Digite o CPF do Servidor</label>
            <input type="text" id="filtroCpf" placeholder="000.000.000-00" maxlength="14" inputmode="numeric" oninput="formatarCPF(this)">
        </div>
        <button type="button" class="btn-pesquisar" onclick="pesquisarServidor()">
            <span class="material-symbols-outlined">search</span>
            Pesquisar
        </button>
    </section>

    <div id="mensagem" class="mensagem"></div>

    <!-- CARD DE RESULTADO -->
    <section id="resultCard" class="result-card">
        <div class="servidor-info-grid">
            <div class="info-item">
                <label>Nome Completo</label>
                <p id="resNome">-</p>
            </div>
            <div class="info-item">
                <label>CPF</label>
                <p id="resCpf">-</p>
            </div>
            <div class="info-item">
                <label>Telefone</label>
                <p id="resTelefone">-</p>
            </div>
        </div>

        <div id="detalhesMatriculas">
            <!-- Os blocos de matrículas serão injetados aqui via JS -->
        </div>
    </section>
</main>

<script type="module">
    import { db } from "./firebase.js";
    import { collection, getDocs, query, where, limit } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Formatação de CPF enquanto digita
    window.formatarCPF = function(input) {
        let valor = input.value.replace(/\D/g, "");
        valor = valor.substring(0, 11);
        if (valor.length > 9) {
            valor = valor.replace(/^(\d{3})(\d{3})(\d{3})(\d{0,2}).*/, "$1.$2.$3-$4");
        } else if (valor.length > 6) {
            valor = valor.replace(/^(\d{3})(\d{3})(\d{0,3}).*/, "$1.$2.$3");
        } else if (valor.length > 3) {
            valor = valor.replace(/^(\d{3})(\d{0,3}).*/, "$1.$2");
        }
        input.value = valor;
    }

    // PESQUISA DIRECIONADA NO FIREBASE (CUSTO: EXATAMENTE 1 LEITURA)
    window.pesquisarServidor = async function() {
        const cpfInput = document.getElementById("filtroCpf").value.trim();
        const msgDiv = document.getElementById("mensagem");
        const resultCard = document.getElementById("resultCard");

        msgDiv.className = "mensagem";
        msgDiv.textContent = "";
        resultCard.classList.remove("ativo");

        if (!cpfInput) {
            mostrarMensagem("Informe um CPF para realizar a pesquisa.", "erro");
            return;
        }

        try {
            // Executa consulta exata filtrada por CPF no Firestore com limit(1)
            const q = query(collection(db, "servidores"), where("cpf", "==", cpfInput), limit(1));
            const querySnapshot = await getDocs(q);

            if (querySnapshot.empty) {
                mostrarMensagem("Nenhum servidor encontrado com o CPF informado.", "erro");
                return;
            }

            // Pega o primeiro documento retornado
            const docData = querySnapshot.docs[0].data();
            exibirResultados(docData);

        } catch (erro) {
            console.error("Erro ao consultar servidor:", erro);
            mostrarMensagem("Erro ao consultar o banco de dados. Verifique sua conexão.", "erro");
        }
    }

    function exibirResultados(servidor) {
        document.getElementById("resNome").textContent = servidor.nome || "-";
        document.getElementById("resCpf").textContent = servidor.cpf || "-";
        document.getElementById("resTelefone").textContent = servidor.telefone || "-";

        let htmlMatriculas = "";

        // Renderiza Matrícula 1
        if (servidor.matricula1) {
            htmlMatriculas += `
                <div class="matricula-box">
                    <div class="matricula-title">
                        <span class="material-symbols-outlined" style="font-size: 18px;">badge</span>
                        Matrícula 1: ${servidor.matricula1.numeroMatricula} (${servidor.matricula1.cargo})
                    </div>
                    <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 6px;"><b>Lotação 1:</b> ${servidor.matricula1.escola1.nomeEscola} — <b>Linha:</b> ${servidor.matricula1.escola1.empresa} (${servidor.matricula1.escola1.qtdPassagensDiarias} passes/dia)</p>
            `;
            if (servidor.matricula1.escola2) {
                htmlMatriculas += `
                    <p style="font-size: 13px; color: var(--text-secondary);"><b>Lotação 2:</b> ${servidor.matricula1.escola2.nomeEscola} — <b>Linha:</b> ${servidor.matricula1.escola2.empresa} (${servidor.matricula1.escola2.qtdPassagensDiarias} passes/dia)</p>
                `;
            }
            htmlMatriculas += `</div>`;
        }

        // Renderiza Matrícula 2 (se houver)
        if (servidor.matricula2) {
            htmlMatriculas += `
                <div class="matricula-box">
                    <div class="matricula-title">
                        <span class="material-symbols-outlined" style="font-size: 18px;">badge</span>
                        Matrícula 2: ${servidor.matricula2.numeroMatricula} (${servidor.matricula2.cargo})
                    </div>
                    <p style="font-size: 13px; color: var(--text-secondary); margin-bottom: 6px;"><b>Lotação 1:</b> ${servidor.matricula2.escola1.nomeEscola} — <b>Linha:</b> ${servidor.matricula2.escola1.empresa} (${servidor.matricula2.escola1.qtdPassagensDiarias} passes/dia)</p>
            `;
            if (servidor.matricula2.escola2) {
                htmlMatriculas += `
                    <p style="font-size: 13px; color: var(--text-secondary);"><b>Lotação 2:</b> ${servidor.matricula2.escola2.nomeEscola} — <b>Linha:</b> ${servidor.matricula2.escola2.empresa} (${servidor.matricula2.escola2.qtdPassagensDiarias} passes/dia)</p>
                `;
            }
            htmlMatriculas += `</div>`;
        }

        document.getElementById("detalhesMatriculas").innerHTML = htmlMatriculas;
        document.getElementById("resultCard").classList.add("ativo");
    }

    function mostrarMensagem(texto, tipo) {
        const msg = document.getElementById("mensagem");
        msg.textContent = texto;
        msg.className = "mensagem " + tipo;
    }
</script>

</body>
</html>
