<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
<title>Login - Vale Transporte</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI', Arial, sans-serif;
}


body{

    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;

    background:#eee8f5;

}


/* Caixa principal */

.login{

    width:380px;
    padding:35px;

    background:rgba(255,255,255,0.95);

    border-radius:20px;

    box-shadow:
    0 15px 35px rgba(0,0,0,0.25);

}


/* Logo */

.logo{

    display:block;

    width:110px;
    height:110px;

    margin:0 auto 20px;

    object-fit:contain;

}



/* Títulos */

h2{

    text-align:center;

    color:#4a235a;

    margin-bottom:8px;

}


h3{

    text-align:center;

    color:#7b5a8e;

    font-weight:normal;

    margin-bottom:30px;

}



/* Campos */


label{

    color:#555;

    font-size:14px;

}



input{

    width:100%;

    height:45px;

    margin-top:8px;

    margin-bottom:20px;

    padding:0 15px;

    border-radius:25px;

    border:1px solid #ccc;

    outline:none;

    font-size:15px;

}


input:focus{

    border-color:#7b3fa1;

    box-shadow:0 0 5px #b57edc;

}



/* Campo senha */

.senha-container{

    position:relative;

}


.senha-container input{

    padding-right:45px;

}


.olho{

    position:absolute;

    right:15px;

    top:10px;

    cursor:pointer;

    font-size:22px;

}



/* Botão */


button{

    width:100%;

    height:45px;

    border:none;

    border-radius:25px;

    background:#6a1b9a;

    color:white;

    font-size:16px;

    cursor:pointer;

    transition:.3s;

}


button:hover{

    background:#4a126b;

    transform:scale(1.03);

}



/* Link */

p{

    text-align:center;

    margin-top:20px;

}


a{

    color:#6a1b9a;

    text-decoration:none;

    font-size:14px;

}



/* Alerta moderno */

      .fundo-alerta{
    display:none;
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.45);
    justify-content:center;
    align-items:center;
    backdrop-filter:blur(4px);
}

.caixa-alerta{
    width:420px;
    background:#fff;
    border-radius:16px;
    overflow:hidden;
    box-shadow:0 20px 45px rgba(0,0,0,.25);
    animation:abrir .25s;
}

.cabecalho-alerta{
    display:flex;
    align-items:center;
    gap:12px;
    padding:20px 25px;
    border-bottom:1px solid #eee;
}

.icone-alerta{
    font-size:34px;
    color:#6a1b9a;
}

.cabecalho-alerta h2{
    margin:0;
    font-size:22px;
    color:#333;
}

.conteudo-alerta{
    padding:25px;
    color:#555;
    line-height:1.6;
}

.info-suporte{
    margin-top:20px;
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px;
    background:#f7f4fb;
    border-radius:10px;
    color:#6a1b9a;
    font-weight:600;
}

.rodape-alerta{
    padding:18px 25px;
    border-top:1px solid #eee;
    text-align:right;
}

.rodape-alerta button{
    width:110px;
    height:42px;
    border:none;
    border-radius:8px;
    background:#6a1b9a;
    color:#fff;
    font-size:15px;
    cursor:pointer;
}

.rodape-alerta button:hover{
    background:#53137a;
}
</style>


</head>


<body>


<div class="login">


<img class="logo"
src="https://drive.google.com/thumbnail?id=1Epk870R1TRNRFx4ionkXV-HDkgRyrATQ"
alt="Logo">

<h2>Sistema Controle</h2>

<h2>Vale Transporte</h2>



<label>Usuário</label>



<input 
type="text"
id="usuario"
placeholder="Digite seu usuário">


<label>Senha</label>


<div class="senha-container">

<input 
type="password"
id="senha"
placeholder="Digite sua senha">


<span class="olho" id="iconeOlho" onclick="mostrarSenha()">
    <span class="material-symbols-outlined">visibility_off</span>
</span>


</div>




<button onclick="login()">
Entrar
</button>


<p>
<a href="#" onclick="abrirAlerta()">Esqueci minha senha</a>
</p>

</div>



<script>




</script>


<!-- Alerta de senha -->

    <div id="alerta" class="fundo-alerta">

    <div class="caixa-alerta">

        <div class="cabecalho-alerta">
            <span class="material-symbols-outlined icone-alerta">
                lock_reset
            </span>

            <h2>Recuperação de senha</h2>
        </div>

        <div class="conteudo-alerta">

            <p>
                Para redefinir sua senha, entre em contato com o suporte técnico da SEMED.
            </p>

            <div class="info-suporte">

                <span class="material-symbols-outlined">
                    call
                </span>

                <span>
                 3229-9729

                </span>

            </div>

        </div>

        <div class="rodape-alerta">

            <button onclick="fecharAlerta()">
                Fechar
            </button>

        </div>

    </div>

</div>


<script>

function abrirAlerta(){

    document.getElementById("alerta").style.display="flex";

}


function fecharAlerta(){

    document.getElementById("alerta").style.display="none";

}


     function login(){

    let usuario = document.getElementById("usuario").value;
    let senha = document.getElementById("senha").value;

    google.script.run
    .withSuccessHandler(function(res){

        if(res.sucesso){
            
            // Em vez de window.location.href, buscamos a URL oficial do App
            google.script.run
            .withSuccessHandler(function(urlWebapp){
                window.top.location.href = urlWebapp + "?pagina=funcionarios";
            })
            .obterUrl();

        }else{

            alert(res.mensagem);

        }

    })
    .verificarLogin(usuario, senha);

}


function mostrarSenha(){

    let campo = document.getElementById("senha");
    let icone = document.getElementById("iconeOlho").firstElementChild;

    if(campo.type === "password"){
        campo.type = "text";
        icone.textContent = "visibility";
    }else{
        campo.type = "password";
        icone.textContent = "visibility_off";
    }

}


</script>




</body>
</html>
