<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Servidores - Vales</title>
</head>
<body>

    <h2>Cadastro de Servidores</h2>

    <!-- Caixas de texto e botão -->
    <div style="margin-bottom: 10px;">
        <input type="text" id="campoNome" placeholder="Digite o nome...">
    </div>
    <div style="margin-bottom: 10px;">
        <input type="text" id="campoCpf" placeholder="Digite o CPF...">
    </div>
    
    <button id="btnSalvar">Salvar no Firebase</button>

    <!-- O Script que importa a conexão pronta do firebase.js -->
    <script type="module">
        // Puxa o 'db' pronto do nosso arquivo centralizador
        import { db } from "./firebase.js"; 
        import { collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Quando o botão for clicado...
        document.getElementById('btnSalvar').addEventListener('click', async () => {
            const nomeDigitado = document.getElementById('campoNome').value;
            const cpfDigitado = document.getElementById('campoCpf').value;

            if (!nomeDigitado.trim() || !cpfDigitado.trim()) {
                alert("Preencha todos os campos!");
                return;
            }

            try {
                // Salva na gaveta "servidores" usando a conexão importada
                await addDoc(collection(db, "servidores"), {
                    nome: nomeDigitado,
                    cpf: cpfDigitado,
                    dataCriacao: new Date().toISOString()
                });

                alert("Salvo com sucesso!");
                
                // Limpa os campos
                document.getElementById('campoNome').value = "";
                document.getElementById('campoCpf').value = "";
                
            } catch (erro) {
                console.error("Erro ao salvar: ", erro);
                alert("Erro ao salvar. Verifique o console (F12).");
            }
        });
    </script>

</body>
</html>
