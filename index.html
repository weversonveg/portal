<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Salvar no Firebase</title>
</head>
<body>

    <!-- 1. O campo de texto e o botão -->
    <input type="text" id="campoNome" placeholder="Digite o nome...">
    <button id="btnSalvar">Salvar no Firebase</button>

    <!-- 2. O Script com o código mínimo -->
    <script type="module">
        // Importa as ferramentas do Firebase (versão web 10)
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Cole aqui a configuração que o Firebase te dá quando você cria o projeto
        const firebaseConfig = {
            apiKey: "SUA_API_KEY",
            authDomain: "SEU_PROJETO.firebaseapp.com",
            projectId: "SEU_PROJETO_ID",
            // ... outros dados que o Firebase te fornece
        };

        // Inicializa o Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Quando o botão for clicado...
        document.getElementById('btnSalvar').addEventListener('click', async () => {
            // Pega o que foi digitado na caixinha do HTML
            const nomeDigitado = document.getElementById('campoNome').value;

            try {
                // SALVA NA COLEÇÃO "servidores" (O Firebase cria o documento sozinho!)
                await addDoc(collection(db, "servidores"), {
                    nome: nomeDigitado
                });

                alert("Salvo com sucesso!");
            } catch (erro) {
                console.error("Erro ao salvar: ", erro);
            }
        });
    </script>

</body>
</html>
