<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Configuração de dias úteis letivos por mês — SEMED.">
<meta name="theme-color" content="#1f3a5f">
<title>Configurações — Vale Transporte</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@600&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20,400,0,0&display=block&text=dashboard,badge,calendar_month,edit_note,event_note,calculate,description,account_circle,dark_mode,light_mode,arrow_forward,check_circle,history,bar_chart,event,warning,error,info,schedule,logout,notifications,chevron_right,menu,close,help_outline,domain,refresh,person_add,edit,delete_outline,school,cached,expand_more,search_off,person_off,confirmation_number,home,delete,date_range,lock_open,lock,hourglass_top,sync,save,autorenew,settings,lock_open_right,check,block">

<script>
(function () {
    try {
        var t = localStorage.getItem('tema-vt') || 'light';
        document.documentElement.setAttribute('data-theme', t);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', t === 'dark' ? '#16181c' : '#1f3a5f');

        var menuFechado = localStorage.getItem('menu-vt-fechado');
        if (menuFechado === '1') {
            document.documentElement.classList.add('menu-inicial-fechado');
        }
    } catch (e) {}
})();
</script>

<style>
/* ============================================================
   LAYOUT — TOKENS
   ============================================================ */
:root,
:root[data-theme="light"] {
    --brand: #1f3a5f;
    --brand-hover: #2c4d77;
    --brand-soft: #e8eef5;

    --gray-50:  #fafafa;
    --gray-100: #f5f5f6;
    --gray-150: #ececee;
    --gray-200: #e4e4e7;
    --gray-300: #d4d4d8;
    --gray-400: #a1a1aa;
    --gray-500: #71717a;
    --gray-600: #52525b;
    --gray-700: #3f3f46;
    --gray-800: #27272a;
    --gray-900: #18181b;

    --ok: #1a6a38;
    --ok-bg: #f1f8f3;
    --ok-bd: #bfdcc6;
    --warn: #8a5610;
    --warn-bg: #fbf7ef;
    --warn-bd: #e6d3ac;
    --danger: #9a1e1e;
    --danger-bg: #fbf3f3;
    --danger-bd: #e0c2c2;
    --info: #1a4d8f;
    --info-bg: #f0f5fb;
    --info-bd: #c3d5e9;

    --background: #eef0f3;
    --surface: #ffffff;
    --surface-2: #f7f8fa;
    --surface-3: #eef0f3;

    --text: #1a1d21;
    --text-secondary: #4d5560;
    --text-muted: #7b8490;

    --border: #d8dce0;
    --border-strong: #b8bfc7;

    --shadow-sm: 0 1px 2px rgba(20,25,35,.05);
    --shadow-md: 0 2px 6px rgba(20,25,35,.08);
    --shadow-lg: 0 20px 50px rgba(20,25,35,.16);

    --sidebar-width: 268px;
    --topbar-height: 56px;

    --focus-ring: 0 0 0 3px rgba(31,58,95,.16);
    --focus-border: #1f3a5f;
    --overlay: rgba(20,25,35,.5);

    --font: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    --font-serif: 'Source Serif 4', Georgia, 'Times New Roman', serif;

    --brand-contrast: #ffffff;
}

:root[data-theme="dark"] {
    --brand: #7ba3cd;
    --brand-hover: #96b8db;
    --brand-soft: #1a2634;

    --gray-50:  #1a1c20;
    --gray-100: #1e2024;
    --gray-150: #232327;
    --gray-200: #2a2d31;
    --gray-300: #3a3d42;
    --gray-400: #52555b;
    --gray-500: #71757c;
    --gray-600: #a1a5ab;
    --gray-700: #d4d7db;
    --gray-800: #e4e6e9;
    --gray-900: #f4f5f7;

    --ok: #86c79a;
    --ok-bg: #13251a;
    --ok-bd: #2f5c3f;
    --warn: #e4c56c;
    --warn-bg: #26200f;
    --warn-bd: #5c4d2a;
    --danger: #f0a1a1;
    --danger-bg: #241515;
    --danger-bd: #5c3434;
    --info: #a3b8dd;
    --info-bg: #141b28;
    --info-bd: #33405a;

    --background: #0f1114;
    --surface: #171a1e;
    --surface-2: #1c1f23;
    --surface-3: #23262b;

    --text: #eceef1;
    --text-secondary: #a1a5ab;
    --text-muted: #71757c;

    --border: #2a2d32;
    --border-strong: #3a3d42;

    --shadow-sm: 0 1px 2px rgba(0,0,0,.4);
    --shadow-md: 0 2px 6px rgba(0,0,0,.5);
    --shadow-lg: 0 20px 50px rgba(0,0,0,.6);

    --focus-ring: 0 0 0 3px rgba(123,163,205,.22);
    --focus-border: #7ba3cd;
    --overlay: rgba(0,0,0,.65);

    --brand-contrast: #1a1a1c;
}

/* ============================================================
   RESET / BASE
   ============================================================ */
*, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: var(--font);
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    height: 100%;
    background: var(--background);
    color: var(--text);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
}

body { overflow: hidden; }
button { font: inherit; color: inherit; cursor: pointer; }

:focus-visible {
    outline: 2px solid var(--focus-border);
    outline-offset: 2px;
    border-radius: 3px;
}

.visually-hidden {
    position: absolute !important;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0,0,0,0);
    white-space: nowrap; border: 0;
}

/* ============================================================
   LAYOUT GERAL
   ============================================================ */
.layout {
    display: flex;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
}

/* ============================================================
   SIDEBAR
   ============================================================ */
.sidebar {
    width: var(--sidebar-width);
    min-width: var(--sidebar-width);
    height: 100%;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    transition: width .25s ease, min-width .25s ease, transform .25s ease;
    overflow: hidden;
    z-index: 100;
}
.sidebar.fechado { width: 0; min-width: 0; border-right: none; }
:root.menu-inicial-fechado .sidebar { width: 0; min-width: 0; border-right: none; }

.sidebar-inner {
    width: var(--sidebar-width);
    height: 100%;
    display: flex;
    flex-direction: column;
}

.sidebar-header {
    height: var(--topbar-height);
    padding: 0 12px 0 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
    background: var(--surface);
}

.sidebar-logo { width: 28px; height: 28px; object-fit: contain; flex-shrink: 0; }
.sidebar-brand { display: flex; flex-direction: column; gap: 0; min-width: 0; flex: 1; }
.sidebar-brand strong { font-size: 13px; font-weight: 600; color: var(--text); line-height: 1.2; }
.sidebar-brand span {
    font-size: 10.5px; color: var(--text-muted);
    text-transform: uppercase; letter-spacing: .4px;
    line-height: 1.2; margin-top: 1px;
}

.btn-fechar-sidebar {
    display: none; width: 32px; height: 32px;
    background: transparent; border: 1px solid transparent;
    border-radius: 4px; color: var(--text-secondary);
    align-items: center; justify-content: center; flex-shrink: 0;
}
.btn-fechar-sidebar .material-symbols-outlined { font-size: 20px; }
@media (max-width: 900px) {
    .sidebar.aberta-mobile .btn-fechar-sidebar { display: inline-flex; }
}

.sidebar-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; overflow-x: hidden; }

.menu-section { padding: 16px 0 8px; }
.menu-section-title {
    padding: 0 20px; font-size: 10.5px; font-weight: 600;
    color: var(--text-muted); text-transform: uppercase;
    letter-spacing: .7px; margin-bottom: 6px;
}
.menu { list-style: none; padding: 0 10px; display: flex; flex-direction: column; gap: 1px; }
.menu-item a {
    display: flex; align-items: center; gap: 11px;
    padding: 9px 12px; border-radius: 4px;
    text-decoration: none; color: var(--text-secondary);
    font-size: 13.5px; font-weight: 500;
    position: relative; white-space: nowrap;
}
.menu-item a:hover { background: var(--surface-2); color: var(--text); }
.menu-item.ativo > a { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
.menu-item.ativo > a::before {
    content: ""; position: absolute; left: -10px; top: 50%;
    transform: translateY(-50%); width: 3px; height: 20px;
    background: var(--brand); border-radius: 0 3px 3px 0;
}
.menu-item .material-symbols-outlined { font-size: 18px; flex-shrink: 0; opacity: .75; }
.menu-item.ativo > a .material-symbols-outlined { opacity: 1; }

.menu-item .menu-badge {
    margin-left: auto; font-size: 10.5px; font-weight: 600;
    color: var(--warn); background: var(--warn-bg);
    border: 1px solid var(--warn-bd);
    padding: 1px 7px; border-radius: 999px; line-height: 1.4;
}

.menu-section-sair {
    margin-top: 8px; padding-top: 16px;
    border-top: 1px solid var(--border); padding-bottom: 8px;
}
.menu-item-sair button {
    display: flex; align-items: center; gap: 11px;
    width: 100%; padding: 9px 12px; border-radius: 4px;
    background: transparent; border: none;
    color: var(--text-secondary); font-size: 13.5px;
    font-weight: 500; text-align: left; white-space: nowrap;
}
.menu-item-sair button:hover { background: var(--danger-bg); color: var(--danger); }
.menu-item-sair button .material-symbols-outlined { font-size: 18px; flex-shrink: 0; opacity: .75; }

.sidebar-info { padding: 16px 22px 22px; font-size: 10.5px; color: var(--text-muted); line-height: 1.5; }
.sidebar-info strong { color: var(--text-secondary); font-weight: 600; display: block; font-size: 11px; margin-bottom: 2px; }

.sidebar-backdrop {
    display: none; position: fixed; inset: 0;
    background: rgba(20, 25, 35, .45);
    z-index: 150; opacity: 0; transition: opacity .2s ease;
}
.sidebar-backdrop.ativo { display: block; opacity: 1; }
@media (min-width: 901px) { .sidebar-backdrop { display: none !important; } }

/* ============================================================
   SUBMENU DE ÂNCORAS NA SIDEBAR
   ============================================================ */
.submenu {
    list-style: none;
    margin: 4px 0 6px 20px;
    padding: 0 0 0 12px;
    display: flex;
    flex-direction: column;
    gap: 1px;
    border-left: 1px solid var(--border);
}
.submenu-item a {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    border-radius: 4px;
    text-decoration: none;
    color: var(--text-muted);
    font-size: 12.5px;
    font-weight: 500;
    white-space: nowrap;
    transition: background-color .12s ease, color .12s ease;
}
.submenu-item a:hover {
    background: var(--surface-2);
    color: var(--text);
}
.submenu-item a .material-symbols-outlined {
    font-size: 15px;
    opacity: .7;
    flex-shrink: 0;
}
.submenu-item.ativo a {
    background: var(--brand-soft);
    color: var(--brand);
    font-weight: 600;
}
.submenu-item.ativo a .material-symbols-outlined { opacity: 1; }

/* ============================================================
   MAIN
   ============================================================ */
.main {
    flex: 1 1 auto; min-width: 0; min-height: 0;
    display: flex; flex-direction: column; height: 100%;
    overflow: hidden; background: var(--background);
}

/* ============================================================
   TOPBAR
   ============================================================ */
.topbar {
    height: var(--topbar-height);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px; gap: 16px; flex-shrink: 0; z-index: 50;
}
.topbar-left { display: flex; align-items: center; gap: 14px; min-width: 0; flex: 1 1 auto; }
.btn-menu {
    width: 34px; height: 34px; flex-shrink: 0;
    background: transparent; border: 1px solid var(--border);
    border-radius: 4px; color: var(--text-secondary);
    display: inline-flex; align-items: center; justify-content: center;
}
.btn-menu:hover { background: var(--surface-2); color: var(--text); }
.btn-menu .material-symbols-outlined { font-size: 20px; }

.topbar-title { display: flex; flex-direction: column; gap: 0; min-width: 0; }
.topbar-title strong {
    font-size: 13.5px; font-weight: 600; color: var(--text);
    line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.topbar-title span {
    font-size: 11px; color: var(--text-muted); line-height: 1.2;
    margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.topbar-right { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
.topbar-btn {
    height: 34px; padding: 0 12px;
    background: transparent; border: 1px solid transparent;
    border-radius: 4px; color: var(--text-secondary);
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 12.5px; font-weight: 500;
}
.topbar-btn:hover { background: var(--surface-2); color: var(--text); }
.topbar-btn .material-symbols-outlined { font-size: 18px; }
.topbar-btn.carregando .material-symbols-outlined { animation: girar 1s linear infinite; }
@keyframes girar { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

.topbar-user-group { display: flex; align-items: center; gap: 4px; }
.topbar-user {
    display: flex; align-items: center; gap: 10px;
    padding: 4px 10px 4px 4px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--surface-2);
    max-width: 220px; min-width: 0;
}
.user-avatar {
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--brand); color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 600; flex-shrink: 0;
}
.user-info { display: flex; flex-direction: column; gap: 0; min-width: 0; line-height: 1.15; }
.user-info strong {
    font-size: 12px; font-weight: 600; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.user-info span {
    font-size: 10.5px; color: var(--text-muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.topbar-sair {
    width: 34px; height: 34px; padding: 0;
    background: transparent; border: none; border-radius: 4px;
    color: var(--text-secondary);
    display: inline-flex; align-items: center; justify-content: center;
    transition: background-color .12s ease, color .12s ease;
}
.topbar-sair:hover { background: var(--danger-bg); color: var(--danger); }
.topbar-sair .material-symbols-outlined { font-size: 20px; }

.btn-tema .icon-dark  { display: none; }
.btn-tema .icon-light { display: inline-flex; }
:root[data-theme="dark"] .btn-tema .icon-dark  { display: inline-flex; }
:root[data-theme="dark"] .btn-tema .icon-light { display: none; }

/* ============================================================
   INDICADOR DE REDE (topbar — só barrinhas + texto)
   ============================================================ */
.rede-indicador {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    height: 34px;
    padding: 0 8px;
    background: transparent;
    border: none;
    font-size: 11.5px;
    color: var(--text-muted);
    user-select: none;
    white-space: nowrap;
    flex-shrink: 0;
    cursor: default;
}

.rede-barras {
    display: inline-flex;
    align-items: flex-end;
    gap: 2px;
    height: 14px;
    flex-shrink: 0;
}
.rede-barras span {
    display: inline-block;
    width: 3px;
    background: var(--gray-300);
    border-radius: 1px;
    transition: background-color .25s ease, opacity .25s ease;
}
.rede-barras span:nth-child(1) { height: 4px; }
.rede-barras span:nth-child(2) { height: 7px; }
.rede-barras span:nth-child(3) { height: 10px; }
.rede-barras span:nth-child(4) { height: 14px; }

.rede-indicador.online .rede-barras span { background: var(--ok); }

.rede-indicador.estavel .rede-barras span:nth-child(1),
.rede-indicador.estavel .rede-barras span:nth-child(2) { background: var(--warn); }
.rede-indicador.estavel .rede-barras span:nth-child(3),
.rede-indicador.estavel .rede-barras span:nth-child(4) { background: var(--gray-300); }

.rede-indicador.offline .rede-barras span { background: var(--gray-300); opacity: .35; }
.rede-indicador.offline .rede-barras span:nth-child(1) { background: var(--danger); opacity: 1; }

.rede-indicador.verificando .rede-barras span {
    background: var(--gray-400);
    animation: pulsoRede 1s ease-in-out infinite;
}
@keyframes pulsoRede {
    0%, 100% { opacity: .35; }
    50%      { opacity: 1; }
}

.rede-texto {
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 180px;
}

.rede-indicador.online    .rede-texto { color: var(--ok); }
.rede-indicador.estavel   .rede-texto { color: var(--warn); }
.rede-indicador.offline   .rede-texto { color: var(--danger); }
.rede-indicador.verificando .rede-texto { color: var(--text-muted); }

/* ============================================================
   MODAL DE SAIR
   ============================================================ */
.modal-sair-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(20, 25, 35, .55);
    z-index: 9999; align-items: center; justify-content: center;
    padding: 20px; opacity: 0; transition: opacity .18s ease;
}
.modal-sair-overlay.ativo { display: flex; opacity: 1; }
.modal-sair {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 8px; max-width: 400px; width: 100%;
    padding: 28px 28px 22px;
    box-shadow: 0 20px 50px rgba(20, 25, 35, .28);
    text-align: center; animation: modalSairEntrar .22s ease;
}
@keyframes modalSairEntrar {
    from { transform: translateY(-12px); opacity: 0; }
    to   { transform: translateY(0); opacity: 1; }
}
.modal-sair-icone {
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--danger-bg); color: var(--danger);
    display: inline-flex; align-items: center; justify-content: center;
    margin-bottom: 16px; border: 1px solid var(--danger-bd);
}
.modal-sair-icone .material-symbols-outlined { font-size: 28px; }
.modal-sair-titulo {
    font-size: 17px; font-weight: 600; color: var(--text);
    letter-spacing: -.01em; margin-bottom: 22px; line-height: 1.25;
}
.modal-sair-acoes { display: flex; gap: 10px; justify-content: center; }
.modal-sair-btn {
    height: 38px; padding: 0 18px; border-radius: 5px;
    border: 1px solid transparent; font-size: 13.5px; font-weight: 500;
    display: inline-flex; align-items: center; justify-content: center;
    gap: 6px; white-space: nowrap; min-width: 110px;
}
.modal-sair-btn .material-symbols-outlined { font-size: 17px; }
.modal-sair-btn-cancelar {
    background: var(--surface); color: var(--text);
    border-color: var(--border-strong); order: 1;
}
.modal-sair-btn-cancelar:hover { background: var(--surface-2); border-color: var(--gray-400); }
.modal-sair-btn-confirmar {
    background: var(--danger); color: #fff;
    border-color: var(--danger); order: 2;
}
.modal-sair-btn-confirmar:hover { background: #7d1717; border-color: #7d1717; }
.modal-sair-btn:disabled { opacity: .65; cursor: not-allowed; }

@media (max-width: 480px) {
    .modal-sair-overlay { padding: 0; align-items: flex-end; }
    .modal-sair {
        padding: 24px 20px 18px; border-radius: 12px 12px 0 0;
        max-width: 100%; align-self: flex-end; margin: 0;
    }
    .modal-sair-acoes { flex-direction: column-reverse; width: 100%; }
    .modal-sair-btn { width: 100%; min-width: 0; }
}

/* ============================================================
   CONTENT PAGE
   ============================================================ */
.content-page {
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 24px 28px 32px;
    scroll-behavior: smooth;
}

.breadcrumb {
    display: flex; align-items: center; gap: 7px;
    font-size: 13px; color: var(--text-muted);
    margin-bottom: 12px;
}
.breadcrumb .material-symbols-outlined { font-size: 17px; }
.breadcrumb a { text-decoration: none; color: inherit; }
.breadcrumb a:hover { color: var(--brand); }
.breadcrumb .sep { opacity: .5; }

.page-header-page {
    display: flex; justify-content: space-between; align-items: flex-end;
    margin-bottom: 20px; flex-wrap: wrap; gap: 16px;
}
.page-header-page h1 {
    font-family: var(--font-serif);
    font-size: 24px; font-weight: 600; color: var(--text);
    margin-bottom: 4px;
}
.page-header-page p { font-size: 13px; color: var(--text-secondary); }

/* ============================================================
   CARDS / BLOCOS / SEÇÕES
   ============================================================ */
.form-card,
.table-card {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    box-shadow: var(--shadow-sm);
    overflow: hidden;
    margin-bottom: 20px;
}

.secao {
    scroll-margin-top: 16px;
    transition: box-shadow .25s ease, border-color .25s ease;
}
.secao.destacada {
    border-color: var(--brand);
    box-shadow: 0 0 0 3px var(--brand-soft);
}

.bloco {
    padding: 20px 24px;
    border-bottom: 1px solid var(--border);
}
.bloco:last-of-type { border-bottom: none; }

.bloco-cabecalho {
    display: flex; align-items: flex-start; gap: 12px; margin-bottom: 18px;
}
.bloco-numero {
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--brand-soft); color: var(--brand);
    font-size: 12px; font-weight: 700;
    display: inline-flex; align-items: center; justify-content: center;
    flex-shrink: 0; margin-top: 1px;
}
.bloco-titulo-grupo { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
.bloco-titulo {
    font-size: 14.5px; font-weight: 600; color: var(--text);
    letter-spacing: -.005em; line-height: 1.3;
}
.bloco-subtitulo {
    font-size: 12.5px; color: var(--text-secondary); line-height: 1.5;
}

.campos-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 16px;
}
.form-group { display: flex; flex-direction: column; min-width: 0; }
.form-group.full { grid-column: 1 / -1; }
.form-group label {
    font-size: 12.5px; font-weight: 600;
    color: var(--text-secondary); margin-bottom: 6px; display: block;
}
.form-group label span { color: var(--danger); }
.form-group .ajuda {
    font-size: 11.5px; color: var(--text-muted);
    margin-top: 4px; line-height: 1.45;
}
.form-group input,
.form-group select {
    width: 100%; height: 40px; padding: 0 12px;
    background: var(--surface);
    border: 1px solid var(--border-strong);
    border-radius: 5px; outline: none;
    font-size: 13.5px; color: var(--text);
    transition: border-color .15s ease, box-shadow .15s ease;
}
.form-group input:hover { border-color: var(--gray-400); }
.form-group input:focus,
.form-group select:focus {
    border-color: var(--brand);
    box-shadow: var(--focus-ring);
}
.form-group input.preenchido,
.form-group select.preenchido {
    background: var(--ok-bg) !important;
    border-color: var(--ok-bd) !important;
}

.caixa-info {
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 12px 14px;
    display: flex; align-items: flex-start; gap: 10px;
    font-size: 12.5px; color: var(--text-secondary);
    line-height: 1.55; margin-bottom: 16px;
}
.caixa-info .material-symbols-outlined {
    font-size: 16px; color: var(--text-muted);
    flex-shrink: 0; margin-top: 1px;
}
.caixa-info strong { color: var(--text); font-weight: 600; }

.bloco-acoes {
    display: flex; gap: 10px; flex-wrap: wrap; margin-top: 16px;
}

/* ============================================================
   BOTÕES
   ============================================================ */
button {
    height: 38px; padding: 0 16px;
    border-radius: 5px; border: 1px solid transparent;
    font-size: 13px; font-weight: 500; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    gap: 6px;
    transition: background-color .15s ease, border-color .15s ease;
    white-space: nowrap;
}
button:disabled { opacity: .65; cursor: not-allowed; }

.btn-primario {
    background: var(--brand); color: var(--brand-contrast);
    border-color: var(--brand);
}
.btn-primario:hover { background: var(--brand-hover); border-color: var(--brand-hover); }

.btn-secundario {
    background: var(--surface); color: var(--text);
    border-color: var(--border-strong);
}
.btn-secundario:hover { background: var(--surface-2); border-color: var(--gray-400); }
.btn-secundario .material-symbols-outlined { font-size: 16px; }

.btn-perigo {
    background: var(--surface); color: var(--danger);
    border-color: var(--danger-bd);
}
.btn-perigo:hover { background: var(--danger-bg); border-color: var(--danger); }

.btn-perigo-solido {
    background: var(--danger); color: #fff;
    border-color: var(--danger);
}
.btn-perigo-solido:hover { background: #7f1616; border-color: #7f1616; }

.btn-pequeno {
    height: 32px; padding: 0 12px; font-size: 12.5px;
}

/* ============================================================
   STATUS CALCULADO
   ============================================================ */
.status-calculado {
    padding: 14px 18px; border-radius: 6px;
    display: flex; align-items: center; gap: 12px;
    border: 1px solid; margin-top: 16px;
}
.status-calculado .material-symbols-outlined { font-size: 24px; flex-shrink: 0; }
.status-calculado .status-info { flex: 1; min-width: 0; }
.status-calculado .status-label {
    font-size: 10.5px; font-weight: 600;
    text-transform: uppercase; letter-spacing: .5px; opacity: .85;
}
.status-calculado .status-valor {
    font-size: 14px; font-weight: 600; margin-top: 2px;
}
