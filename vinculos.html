<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Vínculos - Vale Transporte</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,300..700,0..1,-50..200"
        rel="stylesheet">

    <style>
        :root {
            --primary: #5b2a86;
            --primary-dark: #452066;
            --primary-light: #f5f2f8;
            --green: #2e7d32;
            --green-dark: #256628;
            --green-light: #eaf6ec;
            --background: #f4f6f8;
            --white: #ffffff;
            --border: #d9dee5;
            --text: #263238;
            --text-secondary: #68737d;
            --muted: #6b7280;
            --danger: #c62828;
            --danger-light: #ffebee;
            --shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            min-height: 100%;
            background: var(--background);
            color: var(--text);
        }

        body { min-height: 100vh; }

        .topbar {
            width: calc(100% - 64px);
            max-width: 1116px;
            height: 68px;
            margin: 16px auto 0;
            background: var(--white);
            border: 1px solid #e0e4e7;
            border-radius: 8px;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            padding: 0 24px;
        }

        .topbar-content {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .logo { width: 38px; height: 38px; object-fit: contain; flex-shrink: 0; }
        .system-name { font-size: 17px; font-weight: 700; color: #3d2450; }
        .system-divider { width: 1px; height: 24px; background: #dfe3e6; margin: 0 2px; }
        .system-module { font-size: 14px; color: var(--text-secondary); flex-grow: 1; }

        .status-conexao {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            font-weight: 600;
            padding: 6px 12px;
            border-radius: 20px;
            background: #f1f3f5;
            border: 1px solid #e2e8f0;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        .signal-bars { display: flex; align-items: flex-end; gap: 2px; height: 12px; }
        .signal-bars .bar {
            width: 3px;
            background-color: #cbd5e1;
            border-radius: 1px;
            transition: background-color 0.3s ease;
        }
        .signal-bars .bar-1 { height: 3px; }
        .signal-bars .bar-2 { height: 6px; }
        .signal-bars .bar-3 { height: 9px; }
        .signal-bars .bar-4 { height: 12px; }

        .status-conexao.online { color: #2e7d32; background: #edf7ee; border-color: #c8e6c9; }
        .status-conexao.online .signal-bars .bar { background-color: #2e7d32; }
        .status-conexao.instavel { color: #b45309; background: #fef3c7; border-color: #fde68a; }
        .status-conexao.instavel .signal-bars .bar-1,
        .status-conexao.instavel .signal-bars .bar-2 { background-color: #d97706; }
        .status-conexao.offline { color: #c62828; background: #fff0f0; border-color: #efc5c5; }
        .status-conexao.offline .signal-bars .bar {
            background-color: #ef4444;
            animation: pulsar-sinal 1.2s infinite ease-in-out;
        }
        @keyframes pulsar-sinal {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }

        .container {
            width: calc(100% - 64px);
            max-width: 1116px;
            margin: 0 auto;
            padding: 32px 0 50px;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 13px;
            color: #7b858e;
            margin-bottom: 10px;
        }
        .breadcrumb .material-symbols-outlined { font-size: 17px; }
        .breadcrumb a { text-decoration: none; color: inherit; }
        .breadcrumb a:hover { color: var(--primary); }

        .page-header { margin-bottom: 24px; }

        .page-header h1 {
            font-size: 24px;
            font-weight: 700;
            color: #263238;
            margin-bottom: 6px;
        }

        .page-header p { font-size: 14px; color: var(--text-secondary); }

        .card {
            background: var(--white);
            border: 1px solid #e0e4e7;
            border-radius: 8px;
            box-shadow: var(--shadow);
            padding: 22px;
            margin-bottom: 20px;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 9px;
            color: var(--primary);
            font-size: 17px;
            font-weight: 700;
            margin: 0 0 20px;
        }

        .section-title .material-symbols-outlined { font-size: 23px; }

        .busca-box {
            background: #faf9fc;
            border: 1px solid #e5dff0;
            border-radius: 10px;
            padding: 18px;
        }

        .busca-label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 8px;
        }

        .busca-row { display: flex; gap: 10px; align-items: stretch; }
        .busca-input { flex: 1; min-width: 0; }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(12, 1fr);
            gap: 16px;
        }

        .field { grid-column: span 12; }
        .field-6 { grid-column: span 6; }
        .field-4 { grid-column: span 4; }
        .field-3 { grid-column: span 3; }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 13px;
            font-weight: 600;
            color: #455a64;
        }

        input:not([type="date"]), select {
            width: 100%;
            height: 44px;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0 13px;
            background: #fff;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color 0.15s ease, box-shadow 0.15s ease;
        }

        input[type="date"] {
            width: 100%;
            height: 44px;
            border: 1px solid var(--border);
            border-radius: 6px;
            padding: 0 13px;
            background: #ffffff;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            outline: none;
            transition: 0.15s ease;
        }

        input:not([type="date"]):hover, select:hover { border-color: #b7c0c7; }

        input:not([type="date"]):focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(91, 42, 134, 0.10);
        }

        input[type="date"]:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(91, 42, 134, 0.10);
        }

        input[readonly] { background: #f1f3f5; color: #5f6368; cursor: default; }
        input[type="date"][readonly] { cursor: default; pointer-events: none; }

        .campo-preenchido {
            background: var(--green-light) !important;
            border-color: #72b879 !important;
        }

        /* 👇 NOVA SEÇÃO: RESUMO DE CARGOS */
        .cargos-resumo {
            margin-top: 18px;
            padding-top: 18px;
            border-top: 1px solid #edf0f2;
            display: none;
            flex-direction: column;
            gap: 8px;
        }

        .cargos-resumo.visivel { display: flex; }

        .cargos-titulo {
            font-size: 11px;
            font-weight: 600;
            color: #78909c;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }

        .cargo-item {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
            padding: 10px 14px;
            background: #fafbfc;
            border: 1px solid #edf0f2;
            border-radius: 6px;
        }

        .cargo-label {
            font-size: 11px;
            font-weight: 600;
            color: #78909c;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            min-width: 85px;
        }

        .cargo-numero {
            font-weight: 600;
            color: var(--primary);
            font-size: 12px;
            background: var(--primary-light);
            padding: 3px 10px;
            border-radius: 4px;
            white-space: nowrap;
        }

        .cargo-nome {
            color: var(--text);
            font-weight: 500;
            flex-grow: 1;
        }

        .vinculo-card {
            border: 1px solid #e0e4e7;
            border-radius: 8px;
            padding: 20px;
            margin-top: 18px;
            background: #fff;
        }

        .vinculo-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 18px;
        }

        .vinculo-title { margin: 0; font-size: 16px; font-weight: 700; color: var(--primary); }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: 20px;
            padding: 5px 10px;
            font-size: 11px;
            font-weight: 600;
        }

        .escola-box {
            margin-top: 18px;
            padding: 17px;
            border: 1px solid #e0e4e7;
            border-radius: 8px;
            background: #fafbfc;
        }

        .escola-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 15px;
        }

        .escola-title { margin: 0; font-size: 14px; font-weight: 700; color: #37474f; }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-top: 20px;
            padding: 14px;
            border-radius: 8px;
            background: #fafafa;
            border: 1px solid #e2e8f0;
        }

        .checkbox-wrapper input {
            width: 18px;
            height: 18px;
            margin: 0;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .checkbox-wrapper input:disabled { cursor: not-allowed; opacity: 0.5; }

        .checkbox-wrapper label { margin: 0; font-size: 13px; cursor: pointer; }

        .checkbox-wrapper label.disabled-label { color: #9ca3af; cursor: not-allowed; }

        .checkbox-hint { font-size: 11px; color: #9ca3af; margin-top: 4px; display: block; }

        .buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        button {
            height: 40px;
            border: none;
            border-radius: 6px;
            padding: 0 17px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            transition: background-color 0.15s ease, border-color 0.15s ease, transform 0.1s ease;
        }

        button:active { transform: translateY(1px); }
        button:disabled { opacity: 0.7; cursor: not-allowed; transform: none !important; }
        button .material-symbols-outlined { font-size: 19px; }

        .btn-primary { background: var(--primary); color: #fff; border: 1px solid var(--primary); }
        .btn-primary:hover:not(:disabled) { background: var(--primary-dark); border-color: var(--primary-dark); }

        .btn-green { background: var(--green); color: #fff; border: 1px solid var(--green); }
        .btn-green:hover:not(:disabled) { background: var(--green-dark); border-color: var(--green-dark); }

        .btn-danger { background: var(--danger); color: #fff; border: 1px solid var(--danger); }
        .btn-danger:hover:not(:disabled) { background: #a82020; border-color: #a82020; }

        .btn-secondary { background: #eef0f2; color: #454b52; border: 1px solid #e2e5e8; }
        .btn-secondary:hover:not(:disabled) { background: #e2e5e8; border-color: #d0d4d8; }

        .mensagem {
            display: none;
            margin-top: 14px;
            padding: 12px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 500;
            line-height: 1.5;
        }

        .mensagem.sucesso { display: block; background: #edf7ee; border: 1px solid #c8e6c9; color: #2e7d32; }
        .mensagem.erro { display: block; background: #fff0f0; border: 1px solid #efc5c5; color: #c62828; }
        .mensagem.info { display: block; background: #f1f5f9; color: #475569; border: 1px solid #d8e0e8; }

        #areaVinculos { display: none; }

        @media (max-width: 800px) {
            .topbar { width: calc(100% - 24px); margin-top: 12px; padding: 0 16px; }
            .system-divider, .system-module { display: none; }
            .container { width: calc(100% - 24px); padding: 20px 0 40px; }
            .field-6, .field-4, .field-3 { grid-column: span 12; }
            .card { padding: 17px; }
            .vinculo-card { padding: 16px; }
            .busca-row { flex-direction: column; }
            .busca-row button { width: 100%; }
        }

        @media (max-width: 600px) {
            .cargo-item {
                flex-direction: column;
                align-items: flex-start;
                gap: 6px;
            }
            .cargo-label { min-width: auto; }
        }

        @media (max-width: 500px) {
            .logo { width: 32px; height: 32px; }
            .system-name { font-size: 14px; }
            .page-header h1 { font-size: 20px; }
            .buttons { flex-direction: column; }
            .buttons button { width: 100%; }
            .vinculo-header, .escola-header { align-items: flex-start; flex-direction: column; }
        }
    </style>
</head>

<body>

    <header class="topbar">
        <div class="topbar-content">
            <img class="logo" src="https://drive.google.com/thumbnail?id=1Epk870R1TRNRFx4ionkXV-HDkgRyrATQ" alt="Logo">
            <span class="system-name">Vale Transporte</span>
            <div class="system-divider"></div>
            <span class="system-module">Semed - Recursos Humanos - Gestão de Benefícios</span>

            <div id="statusConexao" class="status-conexao online" title="Conexão estável">
                <div class="signal-bars">
                    <span class="bar bar-1"></span>
                    <span class="bar bar-2"></span>
                    <span class="bar bar-3"></span>
                    <span class="bar bar-4"></span>
                </div>
                <span id="statusTexto">Online</span>
            </div>
        </div>
    </header>

    <main class="container">

        <div class="breadcrumb">
            <span class="material-symbols-outlined">home</span>
            <a href="index.html">Início</a>
            <span>/</span>
            <a href="servidores.html">Servidores</a>
            <span>/</span>
            <span>Vínculos</span>
        </div>

        <div class="page-header">
            <h1>Vínculos</h1>
            <p>Localize o servidor pelo CPF para consultar e editar seus vínculos e dados de vale-transporte.</p>
        </div>

        <!-- BUSCA CPF -->
        <section class="card">
            <h2 class="section-title">
                <span class="material-symbols-outlined">person_search</span>
                Localizar servidor
            </h2>

            <div class="busca-box">
                <label class="busca-label" for="cpfBusca">CPF do servidor</label>

                <div class="busca-row">
                    <div class="busca-input">
                        <input type="text" id="cpfBusca" placeholder="000.000.000-00" maxlength="14" inputmode="
