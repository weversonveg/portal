```html
<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Servidores</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 30px;
            background: #f5f5f5;
        }

        h1 {
            margin-bottom: 20px;
        }

        .tabela-container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th,
        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #eeeeee;
        }

        button {
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            background: #1976d2;
            color: white;
        }

        button:hover {
            background: #125ca5;
        }

        #mensagem {
            margin-bottom: 15px;
        }

    </style>

</head>


<body>


    <h1>Servidores cadastrados</h1>


    <div id="mensagem">
        Carregando servidores...
    </div>


    <div class="tabela-container">

        <table>

            <thead>

                <tr>

                    <th>Nome</th>

                    <th>CPF</th>

                    <th>E-mail</th>

                    <th>Escola</th>

                    <th>Ação</th>

                </tr>

            </thead>


            <tbody id="tabelaServidores">

            </tbody>

        </table>

    </div>



<script type="module">


    // Conexão com o Firebase
    import { db } from "./firebase.js";


    // Funções do Firestore
    import {
        collection,
        getDocs
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";



    // =====================================================
    // CARREGAR SERVIDORES
    // =====================================================

    async function carregarServidores() {

        const tabela = document.getElementById("tabelaServidores");

        const mensagem = document.getElementById("mensagem");


        try {


            // Pega a coleção "servidores"
            const consulta = await getDocs(
                collection(db, "servidores")
            );


            // Limpa a tabela
            tabela.innerHTML = "";


            // Verifica se não existe nenhum cadastro
            if (consulta.empty) {

                mensagem.textContent = "Nenhum servidor cadastrado.";

                return;

            }


            // Percorre todos os documentos
            consulta.forEach((documento) => {


                // Dados do servidor
                const servidor = documento.data();


                // ID do documento no Firebase
                const id = documento.id;


                // Cria uma linha
                const linha = document.createElement("tr");


                // Descobre a primeira escola
                let escola = "";

                if (
                    servidor.matricula1 &&
                    servidor.matricula1.escola1
                ) {

                    escola = servidor.matricula1.escola1.nomeEscola;

                }


                // Monta a linha
                linha.innerHTML = `

                    <td>${servidor.nome || ""}</td>

                    <td>${servidor.cpf || ""}</td>

                    <td>${servidor.email || ""}</td>

                    <td>${escola}</td>

                    <td>

                        <button onclick="editarServidor('${id}')">

                            ✏️ Editar

                        </button>

                    </td>

                `;


                // Coloca a linha na tabela
                tabela.appendChild(linha);


            });


            mensagem.textContent =
                `${consulta.size} servidor(es) encontrado(s).`;


        } catch (erro) {


            console.error(
                "Erro ao carregar servidores:",
                erro
            );


            mensagem.textContent =
                "Erro ao carregar os servidores.";

        }

    }



    // =====================================================
    // BOTÃO EDITAR
    // =====================================================

    window.editarServidor = function(id) {


        console.log(
            "ID do servidor selecionado:",
            id
        );


        alert(
            "Servidor selecionado.\n\nID: " + id
        );


    }



    // =====================================================
    // INICIAR
    // =====================================================

    carregarServidores();


</script>


</body>

</html>
```
