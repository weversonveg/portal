<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">

<!-- Calendário Moderno (Flatpickr) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/material_purple.css">

<title>Editar Servidor - Vale Transporte</title>

<style>
:root {
    --primary: #5b2a86;
    --primary-hover: #47206b;
    --green: #2e7d32;
    --green-hover: #1b5e20;
    --green-light: #eaf6ec;
    --green-border: #72b879;
    --red: #c62828;
    --red-hover: #a51f1f;
    --text: #263238;
    --text-secondary: #68737d;
    --border: #d9dee3;
    --background: #f4f6f8;
    --white: #ffffff;
    --shadow: 0 2px 8px rgba(0,0,0,0.06);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    background: var(--background);
    color: var(--text);
}

.topbar {
    width: calc(100% - 64px);
    max-width: 1116px;
    height: 68px;
    margin: 16px auto 0;
    background: var(--white);
    border: 1px solid #e0e4e7;
    border-radius: 8px;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    padding: 0 24px;
}

.topbar-content {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 14px;
}

.logo {
    width: 38px;
    height: 38px;
    object-fit: contain;
    flex-shrink: 0;
}

.system-name {
    font-size: 17px;
    font-weight: 700;
    color: #3d2450;
}

.system-divider {
    width: 1px;
    height: 24px;
    background: #dfe3e6;
    margin: 0 2px;
}

.system-module {
    font-size: 14px;
    color: var(--text-secondary);
}

.main {
    width: calc(100% - 64px);
    max-width: 1116px;
    margin: 0 auto;
    padding: 32px 0;
}

.page-header {
    margin-bottom: 24px;
}

.breadcrumb {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 13px;
    color: #7b858e;
    margin-bottom: 10px;
}

.breadcrumb .material-symbols-outlined {
    font-size: 17px;
}

.page-header h1 {
    font-size: 24px;
    font-weight: 700;
    color: #263238;
    margin-bottom: 6px;
}

.page-header p {
    font-size: 14px;
    color: var(--text-secondary);
}

.form-card {
    width: 100%;
    background: var(--white);
    border: 1px solid #e0e4e7;
    border-radius: 8px;
    box-shadow: var(--shadow);
    overflow: hidden;
}

.card-header {
    min-height: 68px;
    padding: 18px 24px;
    border-bottom: 1px solid #e5e8eb;
    display: flex;
    align-items: center;
    gap: 13px;
}

.card-icon {
    width: 38px;
    height: 38px;
    border-radius: 7px;
    background: #f1ebf6;
    color: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
}

.card-icon .material-symbols-outlined {
    font-size: 22px;
}

.card-title {
    font-size: 16px;
    font-weight: 700;
    color: #37474f;
}

.card-description {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 2px;
}

.form {
    width: 100%;
}

.form-body {
    padding: 28px 24px;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px 24px;
}

.form-group {
    display: flex;
    flex-direction: column;
}

.form-group.full {
    grid-column: 1 / -1;
}

.form-group label {
    font-size: 13px;
    font-weight: 600;
    color: #455a64;
    margin-bottom: 7px;
}

.form-group label span {
    color: #c62828;
}

.form-group input {
    width: 100%;
    height: 44px;
    padding: 0 13px;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 6px;
    outline: none;
    font-size: 14px;
    color: #263238;
    transition: border-color .15s ease, box-shadow .15s ease, background-color .15s ease;
}

.form-group input:hover {
    border-color: #b7c0c7;
}

.form-group input:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(91,42,134,.10);
}

.form-group input.preenchido {
    background: var(--green-light) !important;
    border-color: var(--green-border) !important;
    color: #263238 !important;
}

.mensagem {
    display: none;
    margin: 0 24px 24px;
    padding: 12px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
}

.mensagem.sucesso {
    display: block;
    background: #edf7ee;
    border: 1px solid #c8e6c9;
    color: #2e7d32;
}

.mensagem.erro {
    display: block;
    background: #fff0f0;
    border: 1px solid #efc5c5;
    color: #c62828;
}

.form-footer {
    min-height: 76px;
    padding: 14px 24px;
    background: #fafbfc;
    border-top: 1px solid #e5e8eb;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.footer-info {
    font-size: 12px;
    color: #7a858d;
}

.footer-buttons {
    display: flex;
    align-items: center;
    gap: 10px;
}

button, .btn-voltar {
    height: 40px;
    border-radius: 6px;
    padding: 0 17px;
    border: none;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    text-decoration: none;
    transition: background-color .15s ease;
}

.btn-atualizar {
    background: var(--green);
    color: #ffffff;
}
.btn-atualizar:hover {
    background: var(--green-hover);
}

.btn-voltar {
    background: var(--red);
    color: #ffffff;
}
.btn-voltar:hover {
    background: var(--red-hover);
}
</style>
</head>

<body>

<header class="topbar">
    <div class="topbar-content">
        <img class="logo" src="https://drive.google.com/thumbnail?id=1Epk870R1TRNRFx4ionkXV-HDkgRyrATQ" alt="Logo">
        <span class="system-name">Vale Transporte</span>
        <div class="system-divider"></div>
        <span class="system-module">Semed-Recursos Humanos-Gestão de Benefícios</span>
    </div>
</header>

<main class="main">
    <div class="page-header">
        <div class="breadcrumb">
            <span class="material-symbols-outlined">home</span>
            <span>Servidores</span>
            <span>/</span>
            <span>Editar cadastro</span>
        </div>
        <h1>Editar Servidor</h1>
        <p>Atualize os dados cadastrais do servidor selecionado.</p>
    </div>

    <section class="form-card">
        <div class="card-header">
            <div class="card-icon">
                <span class="material-symbols-outlined">edit</span>
            </div>
            <div>
                <div class="card-title">Dados do servidor</div>
                <div class="card-description">Modifique as informações necessárias.</div>
            </div>
        </div>

        <form class="form" id="formEditar" onsubmit="atualizarServidor(event)">
            <div class="form-body">
                <div class="form-grid">
                    <div class="form-group full">
                        <label for="nome">Nome completo <span>*</span></label>
                        <input type="text" id="nome" required>
                    </div>

                    <div class="form-group">
                        <label for="cpf">CPF <span>*</span></label>
                        <input type="text" id="cpf" maxlength="14" required oninput="formatarCPF(this)">
                    </div>

                    <div class="form-group">
                        <label for="email">E-mail <span>*</span></label>
                        <input type="email" id="email" required>
                    </div>

                    <div class="form-group">
                        <label for="dataNascimento">Data de nascimento <span>*</span></label>
                        <input type="date" id="dataNascimento" required>
                    </div>

                    <div class="form-group">
                        <label for="dataAdmissao">Data de admissão <span>*</span></label>
                        <input type="date" id="dataAdmissao" required>
                    </div>

                    <div class="form-group">
                        <label for="cargo">Cargo <span>*</span></label>
                        <input type="text" id="cargo" required>
                    </div>

                    <div class="form-group">
                        <label for="telefone">Telefone para contato <span>*</span></label>
                        <input type="tel" id="telefone" maxlength="15" required oninput="formatarTelefone(this)">
                    </div>
                </div>
            </div>

            <div id="mensagem" class="mensagem"></div>

            <div class="form-footer">
                <div class="footer-info"><span>*</span> Campos obrigatórios</div>
                <div class="footer-buttons">
                    <button type="submit" id="btnAtualizar" class="btn-atualizar">
                        <span class="material-symbols-outlined">save</span>
                        Atualizar
                    </button>
                    <a href="consulta.html" class="btn-voltar">Cancelar</a>
                </div>
            </div>
        </form>
    </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/pt.js"></script>

<script type="module">
    import { db } from "./firebase.js";
    import { doc, getDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    let idServidor = null;
    let calendarioInstancias = [];

    document.addEventListener("DOMContentLoaded", async function() {
        calendarioInstancias = flatpickr("input[type='date']", {
            locale: "pt",
            dateFormat: "Y-m-d",
            allowInput: false,
            onChange: function(selectedDates, dateStr, instance) {
                atualizarCor(instance.element);
            }
        });

        // Pega o ID da URL
        const urlParams = new URLSearchParams(window.location.search);
        idServidor = urlParams.get("id");

        if (!idServidor) {
            mostrarMensagem("ID do servidor não informado.", "erro");
            return;
        }

        // Carrega os dados do Firestore para preencher o formulário
        try {
            const docRef = doc(db, "servidores", idServidor);
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                const data = docSnap.data();
                document.getElementById("nome").value = data.nome || "";
                document.getElementById("cpf").value = data.cpf || "";
                document.getElementById("email").value = data.email || "";
                document.getElementById("cargo").value = data.cargo || "";
                document.getElementById("telefone").value = data.telefone || "";

                if (data.dataNascimento) {
                    document.getElementById("dataNascimento")._flatpickr.setDate(data.dataNascimento);
                }
                if (data.dataAdmissao) {
                    document.getElementById("dataAdmissao")._flatpickr.setDate(data.dataAdmissao);
                }

                document.querySelectorAll("input").forEach(i => atualizarCor(i));
            } else {
                mostrarMensagem("Servidor não encontrado.", "erro");
            }
        } catch (erro) {
            console.error("Erro ao carregar:", erro);
            mostrarMensagem("Erro ao buscar dados do servidor.", "erro");
        }
    });

    function atualizarCor(campo) {
        if (campo.value.trim() !== "") campo.classList.add("preenchido");
        else campo.classList.remove("preenchido");
    }

    window.formatarCPF = function(input) {
        let v = input.value.replace(/\D/g, "").substring(0, 11);
        if (v.length > 9) v = v.replace(/^(\d{3})(\d{3})(\d{3})(\d{0,2}).*/, "$1.$2.$3-$4");
        else if (v.length > 6) v = v.replace(/^(\d{3})(\d{3})(\d{0,3}).*/, "$1.$2.$3");
        else if (v.length > 3) v = v.replace(/^(\d{3})(\d{0,3}).*/, "$1.$2");
        input.value = v;
        atualizarCor(input);
    }

    window.formatarTelefone = function(input) {
        let v = input.value.replace(/\D/g, "").substring(0, 11);
        if (v.length > 10) v = v.replace(/^(\d{2})(\d{5})(\d{0,4}).*/, "($1) $2-$3");
        else if (v.length > 6) v = v.replace(/^(\d{2})(\d{4})(\d{0,4}).*/, "($1) $2-$3");
        else if (v.length > 2) v = v.replace(/^(\d{2})(\d{0,5}).*/, "($1) $2");
        input.value = v;
        atualizarCor(input);
    }

    window.atualizarServidor = async function(event) {
        event.preventDefault();
        if (!idServidor) return;

        try {
            await updateDoc(doc(db, "servidores", idServidor), {
                nome: document.getElementById("nome").value.trim(),
                cpf: document.getElementById("cpf").value.trim(),
                email: document.getElementById("email").value.trim(),
                dataNascimento: document.getElementById("dataNascimento").value,
                dataAdmissao: document.getElementById("dataAdmissao").value,
                cargo: document.getElementById("cargo").value.trim(),
                telefone: document.getElementById("telefone").value.trim(),
                dataAtualizacao: new Date().toISOString()
            });

            mostrarMensagem("Servidor atualizado com sucesso!", "sucesso");
            setTimeout(() => {
                window.location.href = "consulta.html";
            }, 1200);

        } catch (erro) {
            console.error("Erro ao atualizar:", erro);
            mostrarMensagem("Erro ao atualizar os dados.", "erro");
        }
    }

    window.mostrarMensagem = function(texto, tipo) {
        const msg = document.getElementById("mensagem");
        msg.textContent = texto;
        msg.className = "mensagem " + tipo;
    }
</script>

</body>
</html>
