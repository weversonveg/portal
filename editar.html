<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">
<title>Gerenciar Servidores - Vale Transporte</title>
<style>
:root {
  --primary: #5b2a86;
  --primary-hover: #47206b;
  --green: #2e7d32;
  --green-hover: #1b5e20;
  --green-light: #eaf6ec;
  --red: #c62828;
  --red-hover: #a51f1f;
  --text: #263238;
  --text-secondary: #68737d;
  --border: #d9dee3;
  --background: #f4f6f8;
  --white: #ffffff;
  --shadow: 0 2px 8px rgba(0,0,0,0.06);
}
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
body {
  min-height: 100vh;
  background: var(--background);
  color: var(--text);
}
.topbar {
  width: calc(100% - 64px);
  max-width: 1116px;
  height: 68px;
  margin: 16px auto 0;
  background: var(--white);
  border: 1px solid #e0e4e7;
  border-radius: 8px;
  box-shadow: var(--shadow);
  display: flex;
  align-items: center;
  padding: 0 24px;
}
.topbar-content {
  width: 100%;
  display: flex;
  align-items: center;
  gap: 14px;
}
.logo {
  width: 38px;
  height: 38px;
  object-fit: contain;
  flex-shrink: 0;
}
.system-name {
  font-size: 17px;
  font-weight: 700;
  color: #3d2450;
}
.system-divider {
  width: 1px;
  height: 24px;
  background: #dfe3e6;
  margin: 0 2px;
}
.system-module {
  font-size: 14px;
  color: var(--text-secondary);
  flex-grow: 1;
}
.main {
  width: calc(100% - 64px);
  max-width: 1116px;
  margin: 0 auto;
  padding: 32px 0;
}
.page-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
}
.page-header h1 {
  font-size: 24px;
  font-weight: 700;
  color: #263238;
  margin-bottom: 4px;
}
.page-header p {
  font-size: 14px;
  color: var(--text-secondary);
}
.btn-novo {
  background: var(--primary);
  color: #fff;
  padding: 0 16px;
  height: 40px;
  border-radius: 6px;
  text-decoration: none;
  font-size: 13px;
  font-weight: 600;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  transition: background 0.15s;
}
.btn-novo:hover {
  background: var(--primary-hover);
}
.card {
  background: var(--white);
  border: 1px solid #e0e4e7;
  border-radius: 8px;
  box-shadow: var(--shadow);
  overflow: hidden;
}
.card-toolbar {
  padding: 16px 20px;
  border-bottom: 1px solid #e5e8eb;
  display: flex;
  gap: 12px;
}
.search-input {
  flex-grow: 1;
  height: 38px;
  padding: 0 12px;
  border: 1px solid var(--border);
  border-radius: 6px;
  font-size: 13px;
  outline: none;
}
.search-input:focus {
  border-color: var(--primary);
  box-shadow: 0 0 0 2px rgba(91,42,134,0.1);
}
.table-responsive {
  width: 100%;
  overflow-x: auto;
}
table {
  width: 100%;
  border-collapse: collapse;
  text-align: left;
  font-size: 13px;
}
th, td {
  padding: 12px 16px;
  border-bottom: 1px solid #e5e8eb;
}
th {
  background: #fafbfc;
  font-weight: 600;
  color: #455a64;
}
tr:hover td {
  background: #f8fafc;
}
.acoes {
  display: flex;
  gap: 8px;
}
.btn-acao {
  width: 32px;
  height: 32px;
  border-radius: 4px;
  border: 1px solid var(--border);
  background: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  text-decoration: none;
  color: #555;
  transition: all 0.15s;
}
.btn-acao:hover {
  background: #f1f3f5;
}
.btn-acao.editar:hover {
  border-color: var(--primary);
  color: var(--primary);
  background: #f1ebf6;
}
.btn-acao.excluir:hover {
  border-color: var(--red);
  color: var(--red);
  background: #fff0f0;
}
.empty-state {
  padding: 40px;
  text-align: center;
  color: var(--text-secondary);
  font-size: 14px;
}
@media (max-width: 700px) {
  .topbar, .main {
    width: calc(100% - 24px);
  }
  .page-header {
    flex-direction: column;
    align-items: flex-start;
    gap: 12px;
  }
}
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-content">
    <img class="logo" src="https://drive.google.com/thumbnail?id=1Epk870R1TRNRFx4ionkXV-HDkgRyrATQ" alt="Logo">
    <span class="system-name">Vale Transporte</span>
    <div class="system-divider"></div>
    <span class="system-module">Semed-Recursos Humanos-Gestão de Benefícios</span>
  </div>
</header>

<main class="main">
  <div class="page-header">
    <div>
      <h1>Servidores Cadastrados</h1>
      <p>Gerencie os servidores e acesse o cadastro para edição.</p>
    </div>
    <a href="servidores.html" class="btn-novo">
      <span class="material-symbols-outlined">person_add</span>
      Novo Servidor
    </a>
  </div>

  <div class="card">
    <div class="card-toolbar">
      <input type="text" id="filtroBusca" class="search-input" placeholder="Pesquisar por nome ou CPF..." oninput="filtrarServidores()">
    </div>
    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>Nome Completo</th>
            <th>CPF</th>
            <th>Matrícula 1</th>
            <th>Telefone</th>
            <th>Ações</th>
          </tr>
        </thead>
        <tbody id="tabelaServidores">
          <tr>
            <td colspan="5" class="empty-state">Carregando servidores...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<script type="module">
import { db } from "./firebase.js";
import { collection, getDocs, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

let listaServidores = [];

document.addEventListener("DOMContentLoaded", async function() {
  await carregarServidores();
});

async function carregarServidores() {
  try {
    const querySnapshot = await getDocs(collection(db, "servidores"));
    listaServidores = [];
    querySnapshot.forEach((docSnap) => {
      listaServidores.push({ id: docSnap.id, ...docSnap.data() });
    });
    renderizarTabela(listaServidores);
  } catch (erro) {
    console.error("Erro ao carregar servidores:", erro);
    document.getElementById("tabelaServidores").innerHTML = `<tr><td colspan="5" class="empty-state" style="color: var(--red);">Erro ao carregar dados do Firebase.</td></tr>`;
  }
}

function renderizarTabela(dados) {
  const tbody = document.getElementById("tabelaServidores");
  if (dados.length === 0) {
    tbody.innerHTML = `<tr><td colspan="5" class="empty-state">Nenhum servidor cadastrado.</td></tr>`;
    return;
  }

  let html = "";
  dados.forEach(s => {
    const mat1 = s.matricula1 ? s.matricula1.numeroMatricula : "-";
    html += `
      <tr>
        <td><strong>${s.nome || ""}</strong></td>
        <td>${s.cpf || ""}</td>
        <td>${mat1}</td>
        <td>${s.telefone || ""}</td>
        <td>
          <div class="acoes">
            <!-- Redireciona para o formulário passando o ID como parâmetro -->
            <a href="servidores.html?id=${s.id}" class="btn-acao editar" title="Editar Servidor">
              <span class="material-symbols-outlined" style="font-size: 18px;">edit</span>
            </a>
            <button type="button" class="btn-acao excluir" title="Excluir Servidor" onclick="excluirServidor('${s.id}')">
              <span class="material-symbols-outlined" style="font-size: 18px;">delete</span>
            </button>
          </div>
        </td>
      </tr>
    `;
  });
  tbody.innerHTML = html;
}

window.filtrarServidores = function() {
  const termo = document.getElementById("filtroBusca").value.toLowerCase();
  const filtrados = listaServidores.filter(s => {
    const nome = (s.nome || "").toLowerCase();
    const cpf = (s.cpf || "").toLowerCase();
    return nome.includes(termo) || cpf.includes(termo);
  });
  renderizarTabela(filtrados);
}

window.excluirServidor = async function(id) {
  if (confirm("Tem certeza que deseja excluir este servidor?")) {
    try {
      await deleteDoc(doc(db, "servidores", id));
      listaServidores = listaServidores.filter(s => s.id !== id);
      renderizarTabela(listaServidores);
      alert("Servidor excluído com sucesso!");
    } catch (erro) {
      console.error("Erro ao excluir servidor:", erro);
      alert("Erro ao excluir o registro.");
    }
  }
}
</script>

</body>
</html>
