<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet"
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">

<link rel="stylesheet"
href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0">

<title>Configuração de Dias Úteis - Vale Transporte</title>

<style>

:root {
    --primary: #5b2a86;
    --primary-hover: #47206b;

    --green: #2e7d32;
    --green-hover: #1b5e20;
    --green-light: #eaf6ec;
    --green-border: #72b879;

    --red: #c62828;
    --red-hover: #a51f1f;

    --text: #263238;
    --text-secondary: #68737d;

    --border: #d9dee3;
    --background: #f4f6f8;
    --white: #ffffff;

    --shadow: 0 2px 8px rgba(0,0,0,0.06);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    -webkit-tap-highlight-color: transparent;
}

html, body {
    width: 100%;
    min-height: 100%;
}

body {
    min-height: 100vh;
    background: var(--background);
    color: var(--text);
}

/* BARRA SUPERIOR */
.topbar {
    width: calc(100% - 64px);
    max-width: 1116px;
    height: 68px;
    margin: 16px auto 0;
    background: var(--white);
    border: 1px solid #e0e4e7;
    border-radius: 8px;
    box-shadow: var(--shadow);
    display: flex;
    align-items: center;
    padding: 0 24px;
}

.topbar-content {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 14px;
}

.logo {
    width: 38px;
    height: 38px;
    object-fit: contain;
    flex-shrink: 0;
}

.system-name {
    font-size: 17px;
    font-weight: 700;
    color: #3d2450;
}

.system-divider {
    width: 1px;
    height: 24px;
    background: #dfe3e6;
    margin: 0 2px;
}

.system-module {
    font-size: 14px;
    color: var(--text-secondary);
    flex-grow: 1;
}

/* INDICADOR DE SINAL DE REDE */
.status-conexao {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12px;
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 20px;
    background: #f1f3f5;
    border: 1px solid #e2e8f0;
}

.signal-bars {
    display: flex;
    align-items: flex-end;
    gap: 2px;
    height: 12px;
}

.signal-bars .bar {
    width: 3px;
    background-color: #2e7d32;
    border-radius: 1px;
}
.signal-bars .bar-1 { height: 3px; }
.signal-bars .bar-2 { height: 6px; }
.signal-bars .bar-3 { height: 9px; }
.signal-bars .bar-4 { height: 12px; }

.status-conexao.online {
    color: #2e7d32;
    background: #edf7ee;
    border-color: #c8e6c9;
}

/* ÁREA PRINCIPAL */
.main {
    width: calc(100% - 64px);
    max-width: 1116px;
    margin: 0 auto;
    padding: 32px 0;
}

.page-header {
    margin-bottom: 24px;
}

.breadcrumb {
    display: flex;
    align-items: center;
    gap: 7px;
    font-size: 13px;
    color: #7b858e;
    margin-bottom: 10px;
}

.breadcrumb .material-symbols-outlined {
    font-size: 17px;
}

.page-header h1 {
    font-size: 24px;
    font-weight: 700;
    color: #263238;
    margin-bottom: 6px;
}

.page-header p {
    font-size: 14px;
    color: var(--text-secondary);
}

/* CARD */
.form-card {
    width: 100%;
    background: var(--white);
    border: 1px solid #e0e4e7;
    border-radius: 8px;
    box-shadow: var(--shadow);
    overflow: hidden;
}

.card-header {
    min-height: 68px;
    padding: 18px 24px;
    border-bottom: 1px solid #e5e8eb;
    display: flex;
    align-items: center;
    gap: 13px;
}

.card-icon {
    width: 38px;
    height: 38px;
    border-radius: 7px;
    background: #f1ebf6;
    color: var(--primary);
    display: flex;
    align-items: center;
    justify-content: center;
}

.card-icon .material-symbols-outlined {
    font-size: 22px;
}

.card-title {
    font-size: 16px;
    font-weight: 700;
    color: #37474f;
}

.card-description {
    font-size: 13px;
    color: var(--text-secondary);
    margin-top: 2px;
}

/* FORMULÁRIO */
.form {
    width: 100%;
}

.form-body {
    padding: 28px 24px;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px 24px;
}

.form-group {
    display: flex;
    flex-direction: column;
}

.form-group.full {
    grid-column: 1 / -1;
}

.form-group label {
    font-size: 13px;
    font-weight: 600;
    color: #455a64;
    margin-bottom: 7px;
}

.form-group label span {
    color: #c62828;
}

.form-group input,
.form-group select {
    width: 100%;
    height: 44px;
    padding: 0 13px;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 6px;
    outline: none;
    font-size: 14px;
    color: #263238;
    transition: border-color .15s ease, box-shadow .15s ease;
}

.form-group input:focus,
.form-group select:focus {
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(91,42,134,.10);
}

.form-group input.preenchido,
.form-group select.preenchido {
    background: var(--green-light) !important;
    border-color: var(--green-border) !important;
}

/* MENSAGEM */
.mensagem {
    display: none;
    margin: 0 24px 24px;
    padding: 12px 14px;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 500;
}

.mensagem.sucesso {
    display: block;
    background: #edf7ee;
    border: 1px solid #c8e6c9;
    color: #2e7d32;
}

.mensagem.erro {
    display: block;
    background: #fff0f0;
    border: 1px solid #efc5c5;
    color: #c62828;
}

/* RODAPÉ */
.form-footer {
    min-height: 76px;
    padding: 14px 24px;
    background: #fafbfc;
    border-top: 1px solid #e5e8eb;
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.footer-info {
    font-size: 12px;
    color: #7a858d;
}

.footer-buttons {
    display: flex;
    align-items: center;
    gap: 10px;
}

button {
    height: 40px;
    border-radius: 6px;
    padding: 0 17px;
    border: none;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 7px;
    transition: background-color .15s ease;
}

button:disabled {
    opacity: 0.7;
    cursor: not-allowed;
}

.btn-salvar {
    background: var(--green);
    color: #ffffff;
}

.btn-salvar:hover {
    background: var(--green-hover);
}

.btn-cancelar {
    background: var(--red);
    color: #ffffff;
}

.btn-cancelar:hover {
    background: var(--red-hover);
}

@media (max-width: 700px) {
    .topbar {
        width: calc(100% - 24px);
        margin-top: 12px;
        padding: 0 16px;
    }
    .system-divider, .system-module {
        display: none;
    }
    .main {
        width: calc(100% - 24px);
        padding: 20px 0;
    }
    .form-grid {
        grid-template-columns: 1fr;
    }
    .form-footer {
        flex-direction: column;
        align-items: stretch;
        gap: 14px;
    }
    .footer-buttons {
        display: grid;
        grid-template-columns: 1fr;
    }
}

</style>
</head>

<body>

<header class="topbar">
    <div class="topbar-content">
        <img class="logo" src="https://drive.google.com/thumbnail?id=1Epk870R1TRNRFx4ionkXV-HDkgRyrATQ" alt="Logo">
        <span class="system-name">Vale Transporte</span>
        <div class="system-divider"></div>
        <span class="system-module">Semed - Configuração de Meses</span>
        <div class="status-conexao online">
            <div class="signal-bars">
                <span class="bar bar-1"></span>
                <span class="bar bar-2"></span>
                <span class="bar bar-3"></span>
                <span class="bar bar-4"></span>
            </div>
            <span>Online</span>
        </div>
    </div>
</header>

<main class="main">
    <div class="page-header">
        <div class="breadcrumb">
            <span class="material-symbols-outlined">home</span>
            <span>Configurações</span>
            <span>/</span>
            <span>Dias Úteis</span>
        </div>
        <h1>Dias Úteis Letivos</h1>
        <p>Defina a quantidade de dias úteis para o cálculo do benefício no mês correspondente.</p>
    </div>

    <section class="form-card">
        <div class="card-header">
            <div class="card-icon">
                <span class="material-symbols-outlined">calendar_month</span>
            </div>
            <div>
                <div class="card-title">Parâmetros do Mês</div>
                <div class="card-description">Informe o mês de referência e os dias letivos.</div>
            </div>
        </div>

        <form class="form" id="formConfig" onsubmit="salvarConfiguracao(event)">
            <div class="form-body">
                <div class="form-grid">
                    
                    <!-- MÊS DE REFERÊNCIA -->
                    <div class="form-group">
                        <label for="mesReferencia">
                            Mês de Referência <span>*</span>
                        </label>
                        <input
                            type="month"
                            id="mesReferencia"
                            name="mesReferencia"
                            required
                            onchange="carregarConfiguracao(this.value)"
                        >
                    </div>

                    <!-- DIAS ÚTEIS LETIVOS -->
                    <div class="form-group">
                        <label for="diasUteis">
                            Dias Úteis Letivos <span>*</span>
                        </label>
                        <input
                            type="number"
                            id="diasUteis"
                            name="diasUteis"
                            placeholder="Ex: 22"
                            min="1"
                            max="31"
                            inputmode="numeric"
                            required
                            oninput="atualizarCorCampo(this)"
                        >
                    </div>

                    <!-- OBSERVAÇÕES -->
                    <div class="form-group full">
                        <label for="observacoes">
                            Observações (Opcional)
                        </label>
                        <input
                            type="text"
                            id="observacoes"
                            name="observacoes"
                            placeholder="Ex: Mês com recesso escolar na última semana"
                        >
                    </div>

                </div>
            </div>

            <div id="mensagem" class="mensagem"></div>

            <div class="form-footer">
                <div class="footer-info">
                    <span>*</span> Campos obrigatórios
                </div>
                <div class="footer-buttons">
                    <button type="submit" id="btnSalvar" class="btn-salvar">
                        <span class="material-symbols-outlined" id="iconeSalvar">save</span>
                        <span id="textoBotao">Salvar Configuração</span>
                    </button>
                    <button type="button" class="btn-cancelar" onclick="limparFormulario()">
                        Limpar
                    </button>
                </div>
            </div>
        </form>
    </section>
</main>

<script type="module">
    import { db } from "./firebase.js";
    import { doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    document.addEventListener("DOMContentLoaded", function() {
        // Define o mês atual automaticamente ao abrir a tela
        const hoje = new Date();
        const ano = hoje.getFullYear();
        const mes = String(hoje.getMonth() + 1).padStart(2, '0');
        const mesAtualStr = `${ano}-${mes}`;
        
        const inputMes = document.getElementById("mesReferencia");
        inputMes.value = mesAtualStr;
        atualizarCorCampo(inputMes);
        
        // Tenta carregar se já existir configuração salva para este mês
        carregarConfiguracao(mesAtualStr);
    });

    window.atualizarCorCampo = function(campo) {
        if (campo.value && campo.value.trim() !== "") {
            campo.classList.add("preenchido");
        } else {
            campo.classList.remove("preenchido");
        }
    }

    // BUSCA CONFIGURAÇÃO EXISTENTE NO FIREBASE (CUSTO: 1 LEITURA)
    window.carregarConfiguracao = async function(mesAno) {
        if (!mesAno) return;
        ocultarMensagem();

        try {
            const docRef = doc(db, "configuracoes", mesAno);
            const docSnap = await getDoc(docRef);

            const inputDias = document.getElementById("diasUteis");
            const inputObs = document.getElementById("observacoes");

            if (docSnap.exists()) {
                const dados = docSnap.data();
                inputDias.value = dados.diasUteis || "";
                inputObs.value = dados.observacoes || "";
                atualizarCorCampo(inputDias);
                mostrarMensagem("Configuração carregada para este mês.", "sucesso");
            } else {
                inputDias.value = "";
                inputObs.value = "";
                inputDias.classList.remove("preenchido");
            }
        } catch (erro) {
            console.error("Erro ao carregar configuração:", erro);
        }
    }

    // SALVA OU ATUALIZA A CONFIGURAÇÃO NO FIREBASE
    window.salvarConfiguracao = async function(event) {
        event.preventDefault();

        const mesReferencia = document.getElementById("mesReferencia").value;
        const diasUteis = document.getElementById("diasUteis").value;
        const observacoes = document.getElementById("observacoes").value.trim();

        if (!mesReferencia || !diasUteis) {
            mostrarMensagem("Preencha o mês de referência e os dias úteis.", "erro");
            return;
        }

        const btnSalvar = document.getElementById("btnSalvar");
        const textoBotao = document.getElementById("textoBotao");
        const iconeSalvar = document.getElementById("iconeSalvar");

        btnSalvar.disabled = true;
        textoBotao.textContent = "Salvando...";
        iconeSalvar.textContent = "sync";

        try {
            // Usa setDoc com o ID do mês (ex: "2026-09") para salvar ou atualizar ativamente
            await setDoc(doc(db, "configuracoes", mesReferencia), {
                mesReferencia: mesReferencia,
                diasUteis: Number(diasUteis),
                observacoes: observacoes,
                dataAtualizacao: new Date().toISOString()
            });

            mostrarMensagem("Configuração de dias úteis salva com sucesso!", "sucesso");
        } catch (erro) {
            console.error("Erro ao salvar configuração:", erro);
            mostrarMensagem("Erro ao salvar. Verifique sua conexão com a internet.", "erro");
        } finally {
            btnSalvar.disabled = false;
            textoBotao.textContent = "Salvar Configuração";
            iconeSalvar.textContent = "save";
        }
    }

    window.limparFormulario = function() {
        document.getElementById("diasUteis").value = "";
        document.getElementById("observacoes").value = "";
        document.getElementById("diasUteis").classList.remove("preenchido");
        ocultarMensagem();
    }

    function mostrarMensagem(texto, tipo) {
        const msg = document.getElementById("mensagem");
        msg.textContent = texto;
        msg.className = "mensagem " + tipo;
    }

    function ocultarMensagem() {
        const msg = document.getElementById("mensagem");
        msg.className = "mensagem";
        msg.textContent = "";
    }
</script>

</body>
</html>
