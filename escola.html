<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel da Escola</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #f5f7fa; color: #1a1a1a; }

    .topo {
      display: flex; justify-content: space-between; align-items: center;
      background: #1e3a8a; color: #fff; padding: 1rem 2rem;
    }
    .topo h1 { font-size: 1.2rem; margin: 0; }
    .usuario { font-size: .9rem; opacity: .9; }

    .tela { max-width: 900px; margin: 2rem auto; padding: 0 1rem; }
    .hidden { display: none; }

    h2 { margin-top: 0; }
    .subtitulo { color: #555; margin-bottom: 1.5rem; }

    .card-tarefa {
      background: #fff; border-radius: 8px; padding: 1rem 1.2rem;
      margin-bottom: 1rem; box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .card-tarefa h3 { margin: 0 0 .5rem; }
    .card-tarefa p { margin: .2rem 0; font-size: .9rem; }

    .bloco-aluno {
      background: #fff; border-radius: 8px; padding: 1rem 1.2rem;
      margin-bottom: 1rem; box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .bloco-aluno h4 { margin: 0 0 .8rem; }

    .campo { margin-bottom: .6rem; display: flex; flex-direction: column; }
    .campo label { font-size: .85rem; color: #555; margin-bottom: .2rem; }
    .campo input, .campo select {
      padding: .45rem .6rem; border: 1px solid #ccc; border-radius: 4px;
    }

    .btn-primario {
      background: #1e3a8a; color: #fff; border: none;
      padding: .6rem 1.2rem; border-radius: 4px; cursor: pointer;
    }
    .btn-primario:hover { background: #16306e; }
    .btn-voltar {
      background: none; border: none; color: #1e3a8a;
      cursor: pointer; margin-bottom: 1rem; font-size: .9rem;
    }
    .rodape-form { text-align: right; margin-top: 1.5rem; }
    .vazio { color: #888; }
    .loading { color: #888; font-style: italic; }
    .status-pendente     { color: #d97706; font-weight: 600; }
    .status-em_andamento { color: #1e3a8a; font-weight: 600; }
    .status-concluida    { color: #16a34a; font-weight: 600; }
  </style>
</head>
<body>

  <header class="topo">
    <h1>Painel da Escola</h1>
    <div class="usuario" id="nomeUsuario">—</div>
  </header>

  <section id="tela-tarefas" class="tela">
    <h2>Tarefas Pendentes</h2>
    <p class="subtitulo">Preencha os dados solicitados pelos setores da Secretaria.</p>
    <div id="listaTarefas"><p class="loading">Carregando...</p></div>
  </section>

  <section id="tela-formulario" class="tela hidden">
    <button id="btnVoltar" class="btn-voltar">← Voltar</button>
    <h2 id="tituloTarefa">Tarefa</h2>
    <p id="descricaoTarefa" class="subtitulo"></p>
    <div id="listaAlunos"></div>
    <div class="rodape-form">
      <button id="btnSalvarTodos" class="btn-primario">Salvar tudo</button>
    </div>
  </section>

  <section id="tela-sucesso" class="tela hidden">
    <h2>✅ Dados enviados!</h2>
    <p>Os dados foram salvos no banco da rede municipal.</p>
    <button id="btnVoltarTarefas" class="btn-primario">Voltar para tarefas</button>
  </section>

  <script type="module">
    import { db, auth } from './firebase.js';
    import {
      collection, query, where, getDocs,
      doc, getDoc, updateDoc, writeBatch, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    let escolaIdAtual = null;
    let tarefaAtual = null;

    const telas = {
      tarefas:    document.getElementById("tela-tarefas"),
      formulario: document.getElementById("tela-formulario"),
      sucesso:    document.getElementById("tela-sucesso")
    };

    function mostrarTela(nome) {
      Object.values(telas).forEach(t => t.classList.add("hidden"));
      telas[nome].classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    // ---------- AUTH ----------
    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = "login.html"; return; }

      const token = await user.getIdTokenResult();
      escolaIdAtual = token.claims.escolaId;

      if (!escolaIdAtual) {
        alert("Usuário não está vinculado a uma escola.");
        return;
      }

      document.getElementById("nomeUsuario").textContent = user.email;
      await carregarTarefas();
    });

    // ---------- LISTA DE TAREFAS ----------
    async function carregarTarefas() {
      const lista = document.getElementById("listaTarefas");
      lista.innerHTML = '<p class="loading">Carregando...</p>';

      try {
        const q = query(
          collection(db, "tarefas"),
          where("escolaId", "==", escolaIdAtual),
          where("status", "in", ["pendente", "em_andamento"])
        );
        const snap = await getDocs(q);

        if (snap.empty) {
          lista.innerHTML = "<p class='vazio'>🎉 Nenhuma tarefa pendente!</p>";
          return;
        }

        lista.innerHTML = "";
        snap.forEach((d) => {
          const t = d.data();
          const card = document.createElement("div");
          card.className = "card-tarefa";
          card.innerHTML = `
            <h3>${t.titulo}</h3>
            <p><strong>Categoria:</strong> ${t.categoria || "alunos"}</p>
            <p><strong>Setor:</strong> ${t.setorSolicitante}</p>
            <p><strong>Campos:</strong> ${(t.camposNecessarios || []).map(formatarLabel).join(", ")}</p>
            <p><strong>Itens:</strong> ${t.totalItens ?? "—"}</p>
            <p><strong>Status:</strong> <span class="status-${t.status}">${t.status}</span></p>
            <button class="btn-primario">Abrir</button>
          `;
          card.querySelector("button").addEventListener("click", () => abrirTarefa(d.id));
          lista.appendChild(card);
        });
      } catch (err) {
        console.error("Erro ao carregar tarefas:", err);
        lista.innerHTML = "<p>Erro ao carregar tarefas.</p>";
      }
    }

    // ---------- ABRIR TAREFA ----------
    async function abrirTarefa(tarefaId) {
      try {
        const tarefaSnap = await getDoc(doc(db, "tarefas", tarefaId));
        if (!tarefaSnap.exists()) { alert("Tarefa não encontrada."); return; }
        tarefaAtual = { id: tarefaId, ...tarefaSnap.data() };

        mostrarTela("formulario");

        document.getElementById("tituloTarefa").textContent = tarefaAtual.titulo;
        document.getElementById("descricaoTarefa").textContent =
          `Campos solicitados: ${tarefaAtual.camposNecessarios.map(formatarLabel).join(", ")}`;

        const listaAlunos = document.getElementById("listaAlunos");
        listaAlunos.innerHTML = '<p class="loading">Carregando itens...</p>';

        const itensSnap = await getDocs(collection(db, "tarefas", tarefaId, "itens"));
        listaAlunos.innerHTML = "";

        if (itensSnap.empty) {
          listaAlunos.innerHTML = "<p>Nenhum item nesta tarefa.</p>";
          return;
        }

        itensSnap.forEach((itemDoc) => {
          const item = itemDoc.data();
          const bloco = document.createElement("div");
          bloco.className = "bloco-aluno";

          let html = `<h4>${item.nome || "Sem nome"}</h4>`;
          (item.camposFaltando || []).forEach((campo) => {
            const label = formatarLabel(campo);
            html += `
              <div class="campo">
                <label>${label}</label>
                ${criarInput(campo, item[campo] || "")}
              </div>
            `;
          });

          bloco.innerHTML = html;
          bloco.dataset.itemId = itemDoc.id;
          bloco.dataset.itemBancoId = item.itemId;
          listaAlunos.appendChild(bloco);
        });
      } catch (err) {
        console.error("Erro ao abrir tarefa:", err);
        alert("Erro ao abrir tarefa.");
      }
    }

    // ---------- INPUTS ----------
    function criarInput(campo, valor) {
      if (campo === "restricaoAlimentar") {
        return `
          <select data-campo="${campo}">
            <option value="">Selecione...</option>
            <option value="Não" ${valor === "Não" ? "selected" : ""}>Não</option>
            <option value="Sim" ${valor === "Sim" ? "selected" : ""}>Sim</option>
          </select>
        `;
      }
      if (campo === "genero") {
        return `
          <select data-campo="${campo}">
            <option value="">Selecione...</option>
            <option value="M" ${valor === "M" ? "selected" : ""}>Masculino</option>
            <option value="F" ${valor === "F" ? "selected" : ""}>Feminino</option>
          </select>
        `;
      }
      return `<input type="text" data-campo="${campo}" value="${valor}">`;
    }

    // ---------- SALVAR ----------
    document.getElementById("btnSalvarTodos").addEventListener("click", async () => {
      const blocos = document.querySelectorAll(".bloco-aluno");
      const batch = writeBatch(db);
      let totalAtualizacoes = 0;
      const colecaoDestino = tarefaAtual.categoria || "alunos";

      blocos.forEach((bloco) => {
        const itemTarefaId = bloco.dataset.itemId;
        const itemBancoId = bloco.dataset.itemBancoId;
        const dados = {};

        bloco.querySelectorAll("[data-campo]").forEach((input) => {
          const campo = input.dataset.campo;
          const valor = input.value.trim();
          if (valor !== "") dados[campo] = valor;
        });

        if (Object.keys(dados).length === 0) return;

        // Atualiza o documento principal na coleção de destino
        const bancoRef = doc(db, colecaoDestino, itemBancoId);
        batch.update(bancoRef, { ...dados, atualizadoEm: serverTimestamp() });

        // Atualiza o item dentro da tarefa
        const itemTarefaRef = doc(db, "tarefas", tarefaAtual.id, "itens", itemTarefaId);
        batch.update(itemTarefaRef, { ...dados, status: "concluida" });

        totalAtualizacoes++;
      });

      if (totalAtualizacoes === 0) {
        alert("Nenhum dado foi preenchido.");
        return;
      }

      // Verifica se ainda há pendentes
      const restantesSnap = await getDocs(
        query(
          collection(db, "tarefas", tarefaAtual.id, "itens"),
          where("status", "==", "pendente")
        )
      );

      const aindaPendentes = restantesSnap.size - totalAtualizacoes;
      const tarefaRef = doc(db, "tarefas", tarefaAtual.id);
      batch.update(tarefaRef, {
        status: aindaPendentes <= 0 ? "concluida" : "em_andamento",
        atualizadoEm: serverTimestamp()
      });

      try {
        await batch.commit();
        mostrarTela("sucesso");
      } catch (err) {
        console.error("Erro ao salvar:", err);
        alert("Erro ao salvar os dados. Tente novamente.");
      }
    });

    // ---------- NAVEGAÇÃO ----------
    document.getElementById("btnVoltar").addEventListener("click", () => mostrarTela("tarefas"));
    document.getElementById("btnVoltarTarefas").addEventListener("click", async () => {
      await carregarTarefas();
      mostrarTela("tarefas");
    });

    // ---------- HELPERS ----------
    function formatarLabel(campo) {
      const mapa = {
        nomeMae: "Nome da mãe",
        nomePai: "Nome do pai",
        genero: "Gênero",
        restricaoAlimentar: "Restrição alimentar",
        endereco: "Endereço",
        cpf: "CPF",
        telefone: "Telefone",
        serie: "Série",
        cargo: "Cargo",
        email: "E-mail",
        formacao: "Formação",
        cargaHoraria: "Carga horária",
        dataAdmissao: "Data de admissão",
        inep: "Código INEP",
        diretor: "Diretor(a)",
        numAlunos: "Nº de alunos",
        numServidores: "Nº de servidores"
      };
      return mapa[campo] || campo;
    }
  </script>
</body>
</html>
