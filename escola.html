<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel da Escola</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; background: #f5f7fa; color: #1a1a1a; font-size: 16px; }

    .topo {
      display: flex; justify-content: space-between; align-items: center;
      background: #1e3a8a; color: #fff; padding: 1rem 1.5rem;
      flex-wrap: wrap; gap: .5rem;
    }
    .topo h1 { font-size: 1.1rem; margin: 0; }
    .usuario { font-size: .9rem; display: flex; align-items: center; gap: .6rem; }
    .usuario select { padding: .45rem .6rem; border-radius: 4px; border: none; font-size: .9rem; max-width: 260px; }

    .tela { max-width: 1000px; margin: 1.5rem auto; padding: 0 1rem; }
    .hidden { display: none; }
    h2 { margin-top: 0; font-size: 1.3rem; }
    .subtitulo { color: #555; margin-bottom: 1.2rem; font-size: .92rem; }

    .card-tarefa {
      background: #fff; border-radius: 8px; padding: 1rem 1.2rem;
      margin-bottom: 1rem; box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .card-tarefa h3 { margin: 0 0 .5rem; font-size: 1rem; }
    .card-tarefa p { margin: .2rem 0; font-size: .88rem; }
    .card-tarefa.evento { border-left: 4px solid #7c3aed; }
    .card-tarefa.evento h3 { color: #6d28d9; }

    .bloco-registro {
      background: #fff; border-radius: 8px; padding: 1rem 1.2rem;
      margin-bottom: 1rem; box-shadow: 0 1px 3px rgba(0,0,0,.08);
    }
    .bloco-registro.evento { border-left: 4px solid #7c3aed; }
    .bloco-registro .cabecalho { display: flex; align-items: center; gap: .6rem; margin-bottom: .8rem; flex-wrap: wrap; }
    .bloco-registro h4 { margin: 0; font-size: 1rem; }

    .tag-tipo {
      display: inline-block; padding: .15rem .55rem; border-radius: 10px;
      font-size: .7rem; font-weight: 600; text-transform: uppercase;
    }
    .tag-aluno { background: #dbeafe; color: #1e40af; }
    .tag-escola { background: #dcfce7; color: #166534; }
    .tag-servidor { background: #f3e8ff; color: #6b21a8; }
    .tag-evento { background: #ede9fe; color: #6d28d9; }

    .campo { margin-bottom: .6rem; display: flex; flex-direction: column; }
    .campo label { font-size: .85rem; color: #555; margin-bottom: .2rem; }
    .campo input, .campo select { padding: .55rem .7rem; border: 1px solid #ccc; border-radius: 4px; font-size: .95rem; }

    .btn-primario { background: #1e3a8a; color: #fff; border: none; padding: .7rem 1.2rem; border-radius: 4px; cursor: pointer; font-size: .95rem; font-weight: 500; }
    .btn-primario:hover { background: #16306e; }
    .btn-voltar { background: none; border: none; color: #1e3a8a; cursor: pointer; margin-bottom: 1rem; font-size: .9rem; padding: .3rem 0; }
    .rodape-form { text-align: right; margin-top: 1.5rem; }
    .vazio { color: #888; }

    .barra-confirmar {
      background: #f3e8ff; border-radius: 8px; padding: .8rem 1rem;
      margin-bottom: 1rem; display: flex; gap: .5rem; align-items: center;
      flex-wrap: wrap; border-left: 4px solid #7c3aed;
    }
    .barra-confirmar .texto { flex: 1; font-size: .9rem; color: #4c1d95; }
    .barra-confirmar button {
      background: #7c3aed; color: #fff; border: none;
      padding: .6rem 1rem; border-radius: 4px; cursor: pointer;
      font-size: .9rem; font-weight: 500;
    }
    .barra-confirmar button:hover { background: #6d28d9; }

    @media (max-width: 768px) {
      .topo { padding: .8rem 1rem; }
      .topo h1 { font-size: 1rem; }
      .usuario select { max-width: 180px; font-size: .85rem; }
      .tela { margin: 1rem auto; padding: 0 .8rem; }
      h2 { font-size: 1.15rem; }
      .card-tarefa, .bloco-registro { padding: .9rem 1rem; }
      .rodape-form { text-align: stretch; }
      .rodape-form button { width: 100%; }
      .barra-confirmar { flex-direction: column; align-items: stretch; }
      .barra-confirmar button { width: 100%; }
    }

    @media (max-width: 480px) {
      .topo { padding: .7rem .8rem; flex-direction: column; align-items: flex-start; gap: .4rem; }
      .topo h1 { font-size: .95rem; }
      .usuario { width: 100%; flex-direction: column; align-items: stretch; gap: .3rem; }
      .usuario select { max-width: 100%; width: 100%; }
      .tela { padding: 0 .6rem; }
      h2 { font-size: 1.05rem; }
      .bloco-registro { padding: .8rem .9rem; border-radius: 6px; }
      .campo input, .campo select { padding: .5rem .6rem; font-size: .9rem; }
      .btn-primario { padding: .65rem 1rem; font-size: .9rem; }
    }
  </style>
</head>
<body>

  <header class="topo">
    <h1>Painel da Escola</h1>
    <div class="usuario">
      <select id="seletorEscola"></select>
    </div>
  </header>

  <section id="tela-tarefas" class="tela">
    <h2>Tarefas Pendentes</h2>
    <p class="subtitulo">Preencha os dados solicitados pelos setores da Secretaria.</p>
    <div id="listaTarefas"></div>
  </section>

  <section id="tela-formulario" class="tela hidden">
    <button id="btnVoltar" class="btn-voltar">← Voltar</button>
    <h2 id="tituloTarefa">Tarefa</h2>
    <p id="descricaoTarefa" class="subtitulo"></p>
    <div id="barraConfirmar"></div>
    <div id="listaRegistros"></div>
    <div class="rodape-form">
      <button id="btnSalvarTodos" class="btn-primario">Salvar tudo</button>
    </div>
  </section>

  <section id="tela-sucesso" class="tela hidden">
    <h2>✅ Dados enviados!</h2>
    <p>Os dados foram salvos no banco da rede municipal.</p>
    <button id="btnVoltarTarefas" class="btn-primario">Voltar para tarefas</button>
  </section>

  <script>
    const DB_KEY = "rede_municipal_db";

    function carregarDB() {
      const raw = localStorage.getItem(DB_KEY);
      if (!raw) {
        const inicial = { escolas: [], alunos: [], servidores: [], tarefas: [], campos: [], eventos: [] };
        localStorage.setItem(DB_KEY, JSON.stringify(inicial));
        return inicial;
      }
      const db = JSON.parse(raw);
      db.escolas    = db.escolas    || [];
      db.alunos     = db.alunos     || [];
      db.servidores = db.servidores || [];
      db.tarefas    = db.tarefas    || [];
      db.campos     = db.campos     || [];
      db.eventos    = db.eventos    || [];
      return db;
    }

    function salvarDB(db) { localStorage.setItem(DB_KEY, JSON.stringify(db)); }

    function getCatalogo() {
      const db = carregarDB();
      const porTipo = { aluno: [], escola: [], servidor: [] };
      (db.campos || []).forEach(c => {
        if (porTipo[c.tipo]) porTipo[c.tipo].push(c);
      });
      return porTipo;
    }

    function definicaoDoCampo(tipo, campoId) {
      const cat = getCatalogo();
      return (cat[tipo] || []).find(x => x.id === campoId) || null;
    }

    function labelDoCampo(tipo, campoId) {
      const def = definicaoDoCampo(tipo, campoId);
      return def ? def.label : campoId;
    }

    const ROTULO_TIPO = { aluno: "Aluno", escola: "Escola", servidor: "Servidor" };

    let ESCOLA_ATUAL = null;
    let db = carregarDB();
    let tarefaAtual = null;

    const telas = {
      tarefas:    document.getElementById("tela-tarefas"),
      formulario: document.getElementById("tela-formulario"),
      sucesso:    document.getElementById("tela-sucesso")
    };

    function mostrarTela(nome) {
      Object.values(telas).forEach(t => t.classList.add("hidden"));
      telas[nome].classList.remove("hidden");
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function montarSeletorEscola() {
      db = carregarDB();
      const select = document.getElementById("seletorEscola");
      select.innerHTML = "";
      if (db.escolas.length === 0) {
        select.innerHTML = '<option value="">Nenhuma escola cadastrada</option>';
        ESCOLA_ATUAL = null;
        return;
      }
      db.escolas.forEach(e => {
        const opt = document.createElement("option");
        opt.value = e.id;
        opt.textContent = e.nome || e.id;
        select.appendChild(opt);
      });
      if (ESCOLA_ATUAL && db.escolas.find(e => e.id === ESCOLA_ATUAL)) {
        select.value = ESCOLA_ATUAL;
      } else {
        ESCOLA_ATUAL = db.escolas[0].id;
        select.value = ESCOLA_ATUAL;
      }
    }

    document.getElementById("seletorEscola").addEventListener("change", (e) => {
      ESCOLA_ATUAL = e.target.value;
      carregarTarefas();
      mostrarTela("tarefas");
    });

    function carregarTarefas() {
      db = carregarDB();
      const lista = document.getElementById("listaTarefas");
      lista.innerHTML = "";

      if (!ESCOLA_ATUAL) {
        lista.innerHTML = "<p class='vazio'>Nenhuma escola cadastrada. Peça ao administrador.</p>";
        return;
      }

      const pendentes = db.tarefas.filter(t =>
        t.escolaId === ESCOLA_ATUAL &&
        (t.registros || []).some(r => r.status !== "concluida")
      );

      if (pendentes.length === 0) {
        lista.innerHTML = "<p class='vazio'>🎉 Nenhuma tarefa pendente!</p>";
        return;
      }

      pendentes.forEach((t) => {
        const card = document.createElement("div");
        const ehEvento = !!t.eventoId;
        card.className = "card-tarefa" + (ehEvento ? " evento" : "");
        const tipos = Object.entries(t.camposPorTipo || {})
          .filter(([_, v]) => v.length > 0)
          .map(([tipo, campos]) => `${ROTULO_TIPO[tipo]} (${campos.length})`).join(", ") || "—";
        const totalPendentes = (t.registros || []).filter(r => r.status !== "concluida").length;
        const tagEvento = ehEvento ? `<span class="tag-tipo tag-evento">🔄 Evento</span> ` : "";
        card.innerHTML = `
          <h3>${tagEvento}${t.titulo}</h3>
          <p><strong>Setor:</strong> ${t.setorSolicitante}</p>
          <p><strong>Tipos:</strong> ${tipos}</p>
          <p><strong>Registros a preencher:</strong> ${totalPendentes}</p>
          <button class="btn-primario" style="margin-top:.6rem;">Abrir</button>
        `;
        card.querySelector("button").addEventListener("click", () => { abrirTarefa(t.id); });
        lista.appendChild(card);
      });
    }

    function abrirTarefa(tarefaId) {
      db = carregarDB();
      tarefaAtual = db.tarefas.find(t => t.id === tarefaId);
      mostrarTela("formulario");

      const ehEvento = !!tarefaAtual.eventoId;

      document.getElementById("tituloTarefa").textContent =
        (ehEvento ? "🔄 " : "") + tarefaAtual.titulo;

      const camposTexto = Object.entries(tarefaAtual.camposPorTipo || {})
        .filter(([_, v]) => v.length > 0)
        .map(([tipo, campos]) =>
          `${ROTULO_TIPO[tipo]}: ${campos.map(c => labelDoCampo(tipo, c)).join(", ")}`
        ).join(" | ");
      document.getElementById("descricaoTarefa").textContent = camposTexto;

      const barra = document.getElementById("barraConfirmar");
      if (ehEvento) {
        barra.innerHTML = `
          <div class="barra-confirmar">
            <span class="texto">
              💡 <strong>Evento:</strong> confirme os dados abaixo.
              Se estiver tudo certo, use o botão ao lado para confirmar todos de uma vez.
            </span>
            <button id="btnConfirmarTudo">✓ Confirmar todos</button>
          </div>
        `;
        document.getElementById("btnConfirmarTudo").addEventListener("click", confirmarTudo);
      } else {
        barra.innerHTML = "";
      }

      const listaRegistros = document.getElementById("listaRegistros");
      listaRegistros.innerHTML = "";

      const pendentes = (tarefaAtual.registros || []).filter(r => r.status !== "concluida");

      if (pendentes.length === 0) {
        listaRegistros.innerHTML = "<p class='vazio'>✅ Nada para preencher nesta tarefa.</p>";
        return;
      }

      pendentes.forEach((r) => {
        const bloco = document.createElement("div");
        bloco.className = "bloco-registro" + (ehEvento ? " evento" : "");

        const colecao = r.tipo === "aluno" ? db.alunos
                      : r.tipo === "escola" ? db.escolas
                      : db.servidores;
        const objBanco = colecao.find(x => x.id === r.id) || {};

        let html = `
          <div class="cabecalho">
            <span class="tag-tipo tag-${r.tipo}">${ROTULO_TIPO[r.tipo]}</span>
            <h4>${r.nome || "(sem nome)"}</h4>
          </div>
        `;

        (r.camposFaltando || []).forEach((campoId) => {
          const def = definicaoDoCampo(r.tipo, campoId);
          const label = def ? def.label : campoId;
          const tipoCampo = def ? def.tipoCampo : "text";
          const valorAtual = objBanco[campoId] || "";
          html += `
            <div class="campo">
              <label>${label}</label>
              ${renderizarInput(tipoCampo, campoId, valorAtual, def)}
            </div>
          `;
        });

        bloco.innerHTML = html;
        bloco.dataset.registroId = r.id;
        bloco.dataset.tipo = r.tipo;
        listaRegistros.appendChild(bloco);
      });
    }

    function renderizarInput(tipoCampo, campoId, valor, def) {
      const attr = `data-campo="${campoId}"`;
      const val = (valor ?? "").toString().replace(/"/g, "&quot;");

      if (tipoCampo === "escola") {
        const dbAtual = carregarDB();
        let options = '<option value="">Selecione...</option>';
        dbAtual.escolas.forEach(e => {
          const sel = (valor === e.id) ? "selected" : "";
          options += `<option value="${e.id}" ${sel}>${e.nome}</option>`;
        });
        return `<select ${attr}>${options}</select>`;
      }

      if (tipoCampo === "select") {
        const opcoes = def && def.opcoes ? def.opcoes : [];
        let options = '<option value="">Selecione...</option>';
        opcoes.forEach(o => {
          const sel = (valor === o) ? "selected" : "";
          options += `<option value="${o}" ${sel}>${o}</option>`;
        });
        return `<select ${attr}>${options}</select>`;
      }

      if (tipoCampo === "date")   return `<input type="date" ${attr} value="${val}">`;
      if (tipoCampo === "number") return `<input type="number" ${attr} value="${val}">`;
      if (tipoCampo === "email")  return `<input type="email" ${attr} value="${val}">`;
      return `<input type="text" ${attr} value="${val}">`;
    }

    function confirmarTudo() {
      const blocos = document.querySelectorAll(".bloco-registro");
      let algum = false;
      blocos.forEach((bloco) => {
        bloco.querySelectorAll("[data-campo]").forEach((input) => {
          if (!input.value || input.value.trim() === "") {
            const registroId = bloco.dataset.registroId;
            const tipo = bloco.dataset.tipo;
            const campoId = input.dataset.campo;
            const dbAtual = carregarDB();
            const colecao = tipo === "aluno" ? dbAtual.alunos
                          : tipo === "escola" ? dbAtual.escolas
                          : dbAtual.servidores;
            const obj = colecao.find(x => x.id === registroId);
            if (obj && obj[campoId]) input.value = obj[campoId];
          }
          algum = true;
        });
      });
      if (!algum) { alert("Nada para confirmar."); return; }
      blocos.forEach(b => b.style.borderLeftColor = "#16a34a");
      document.getElementById("btnSalvarTodos").click();
    }

    function verificarEncerramentoEvento(eventoId) {
      const dbAtual = carregarDB();
      const tarefasDoEvento = dbAtual.tarefas.filter(t => t.eventoId === eventoId);
      if (tarefasDoEvento.length === 0) return;

      const todasConcluidas = tarefasDoEvento.every(t =>
        (t.registros || []).every(r => r.status === "concluida")
      );
      if (!todasConcluidas) return;

      const ev = (dbAtual.eventos || []).find(e => e.id === eventoId);
      if (!ev) return;

      const colecao = ev.tipo === "aluno" ? dbAtual.alunos : dbAtual.servidores;
      const todosConfirmados = colecao.every(r =>
        r.ultimoEvento === eventoId && r.confirmadoEm
      );
      if (!todosConfirmados) return;

      ev.ativo = false;
      ev.concluidoEm = new Date().toISOString();
      salvarDB(dbAtual);
      console.log(`Evento "${ev.label}" encerrado automaticamente.`);
    }

    document.getElementById("btnSalvarTodos").addEventListener("click", () => {
      db = carregarDB();
      const tarefaDb = db.tarefas.find(t => t.id === tarefaAtual.id);
      const blocos = document.querySelectorAll(".bloco-registro");
      let totalAtualizacoes = 0;
      const ehEvento = !!tarefaDb.eventoId;
      const agora = new Date().toISOString();

      blocos.forEach((bloco) => {
        const registroId = bloco.dataset.registroId;
        const tipo = bloco.dataset.tipo;
        const registroTarefa = tarefaDb.registros.find(r => r.id === registroId);
        const colecao = tipo === "aluno" ? db.alunos
                      : tipo === "escola" ? db.escolas
                      : db.servidores;
        const objBanco = colecao.find(x => x.id === registroId);

        bloco.querySelectorAll("[data-campo]").forEach((input) => {
          const campo = input.dataset.campo;
          const valor = input.value.trim();
          if (valor !== "") {
            if (objBanco) {
              objBanco[campo] = valor;
              objBanco.atualizadoEm = agora;
              objBanco.atualizadoPor = ESCOLA_ATUAL;
            }
            registroTarefa[campo] = valor;
            registroTarefa.camposFaltando =
              (registroTarefa.camposFaltando || []).filter(c => c !== campo);
            totalAtualizacoes++;
          }
        });

        if ((registroTarefa.camposFaltando || []).length === 0) {
          registroTarefa.status = "concluida";
          if (ehEvento && objBanco) {
            objBanco.ultimoEvento = tarefaDb.eventoId;
            objBanco.confirmadoEm = agora;
            objBanco.atualizadoEm = agora;
            objBanco.atualizadoPor = ESCOLA_ATUAL;
          }
        }
      });

      if (totalAtualizacoes === 0) { alert("Nenhum dado foi preenchido."); return; }

      const aindaPendentes = tarefaDb.registros.some(r => r.status !== "concluida");
      tarefaDb.status = aindaPendentes ? "em_andamento" : "concluida";
      tarefaDb.atualizadoEm = agora;

      salvarDB(db);

      if (ehEvento && !aindaPendentes) {
        verificarEncerramentoEvento(tarefaDb.eventoId);
      }

      mostrarTela("sucesso");
    });

    document.getElementById("btnVoltar").addEventListener("click", () => { mostrarTela("tarefas"); });
    document.getElementById("btnVoltarTarefas").addEventListener("click", () => {
      carregarTarefas();
      mostrarTela("tarefas");
    });

    montarSeletorEscola();
    carregarTarefas();
  </script>
</body>
</html>
